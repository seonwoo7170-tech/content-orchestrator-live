name: Inspect Targeted Production State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-targeted-production.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/live-runtime-snapshot-20260923
          fetch-depth: 0
      - name: Extract remaining live source sections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.live-snapshot'); out=root/'extracted'; out.mkdir(parents=True,exist_ok=True)
          specs={
            'orchestrator': (root/'modules/content-orchestrator/mcp-entry.js', {
              'worker/lib/expansion-acceptance.js',
              'worker/lib/internal-links.js',
              'worker/lib/publisher.js',
              'worker/lib/job-runner.js',
            }),
            'hub': (root/'modules/api-hub-v2/index.js', {
              'src/lib/master-v45-role-prompts.js',
              'src/lib/ai-routes.js',
              'src/lib/article-length.js',
              'src/lib/blogger-posts.js',
              'src/lib/write-policy.js',
            }),
          }
          for kind,(path,wanted) in specs.items():
            text=path.read_text('utf-8',errors='replace')
            markers=[(m.start(),m.group(1).strip()) for m in re.finditer(r'^// ([^\n]+\.js)\s*$',text,re.M)]
            for idx,(start,name) in enumerate(markers):
              if name not in wanted: continue
              finish=markers[idx+1][0] if idx+1<len(markers) else len(text)
              section=text[start:finish].rstrip()+'\n'
              target=out/f'{kind}__{name.replace("/","__")}'
              target.write_text(section,encoding='utf-8')
              print(target.name, len(section))
          PY
      - name: Commit extraction to snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .live-snapshot/extracted
          if git diff --cached --quiet; then echo 'EXTRACTION_UNCHANGED'; exit 0; fi
          git commit -m 'ops: extract remaining live Sep 23 modules'
          git push origin HEAD:ops/live-runtime-snapshot-20260923
