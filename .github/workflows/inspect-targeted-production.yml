name: Inspect Targeted Production State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-targeted-production.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/live-runtime-snapshot-20260923
          fetch-depth: 0
      - name: Analyze captured live bundles
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.live-snapshot')
          targets=[
            root/'modules/content-orchestrator/mcp-entry.js',
            root/'modules/api-hub-v2/index.js'
          ]
          needles=[
            'TARGETED_REPAIR_INSERTION_REJECTED',
            'TARGETED_REPAIR_CHANGED_HTML_STRUCTURE',
            'TARGET_NOT_FOUND',
            'data-smileseon-internal-links',
            'Related Articles',
            '[DATE]',
            '8000',
            'targeted-repair-guard.js',
            'internal-link-injector.js',
            'deterministic-quality-gate.js',
            'auto-publisher.js',
            'state-machine.js',
            'pipeline.js'
          ]
          out=[]
          for path in targets:
            text=path.read_text('utf-8',errors='replace')
            out.append(f'===== FILE {path} size={len(text)} =====')
            lines=text.splitlines()
            for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle in line]
              out.append(f'\n--- NEEDLE {needle!r} hits={len(hits)} ---')
              for i in hits[:20]:
                lo=max(0,i-10); hi=min(len(lines),i+11)
                out.append(f'@@ line {i+1} @@')
                out.extend(f'{j+1:06d}: {lines[j]}' for j in range(lo,hi))
          report='\n'.join(out)+'\n'
          (root/'bundle-marker-report.txt').write_text(report,encoding='utf-8')
          print(report[:50000])
          PY
      - name: Commit analysis to snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .live-snapshot/bundle-marker-report.txt
          git diff --cached --check
          if git diff --cached --quiet; then echo 'REPORT_UNCHANGED'; exit 0; fi
          git commit -m 'ops: analyze live Sep 23 worker bundle markers'
          git push origin HEAD:ops/live-runtime-snapshot-20260923
