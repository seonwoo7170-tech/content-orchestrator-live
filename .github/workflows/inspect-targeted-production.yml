name: Inspect Targeted Production State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-targeted-production.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/live-runtime-snapshot-20260923
          fetch-depth: 0
      - name: Locate publication-date substitution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.live-snapshot')
          path=root/'modules/content-orchestrator/mcp-entry.js'
          text=path.read_text('utf-8',errors='replace')
          lines=text.splitlines()
          matches=[]
          for needle in ['function applyPublicationDate', 'applyPublicationDate =', 'Published:', 'Last updated:', '게시일:', '작성일:']:
              for i,line in enumerate(lines):
                  if needle in line:
                      lo=max(0,i-30); hi=min(len(lines),i+80)
                      matches.append(f'=== {needle} @ {i+1} ===\n'+'\n'.join(f'{j+1:06d}: {lines[j]}' for j in range(lo,hi)))
          report='\n\n'.join(matches)+'\n'
          target=root/'extracted/publication-date-context.txt'
          target.write_text(report,encoding='utf-8')
          print(report[:40000])
          PY
      - name: Commit context to snapshot branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .live-snapshot/extracted/publication-date-context.txt
          if git diff --cached --quiet; then echo 'CONTEXT_UNCHANGED'; exit 0; fi
          git commit -m 'ops: locate live publication date substitution'
          git push origin HEAD:ops/live-runtime-snapshot-20260923
