name: Phase 2 R2 Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [feature/phase2-ops-images]
    paths:
      - '.github/phase2-r2-bootstrap-trigger'
      - '.github/workflows/phase2-r2-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: phase2-r2-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET_NAME: content-orchestrator-images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Cloudflare token without printing it
        shell: bash
        run: |
          if [ -n "$R2_API_TOKEN" ]; then
            echo 'Using dedicated R2 API token.'
            echo "CLOUDFLARE_API_TOKEN=$R2_API_TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$DEPLOY_API_TOKEN" ]; then
            echo 'Dedicated R2 token absent; using deployment token.'
            echo "CLOUDFLARE_API_TOKEN=$DEPLOY_API_TOKEN" >> "$GITHUB_ENV"
          else
            echo 'No Cloudflare API token is configured.'
            exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account id missing'; exit 1; }
      - name: Resolve or create Standard R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          set +e
          LIST_OUTPUT="$(npx --yes wrangler@latest r2 bucket list 2>&1)"
          LIST_STATUS=$?
          set -e
          if [ "$LIST_STATUS" -ne 0 ]; then
            echo "$LIST_OUTPUT" | sed -E 's/[A-Za-z0-9_-]{30,}/[redacted]/g'
            echo 'R2 access failed. Add Cloudflare Account > Workers R2 Storage > Edit permission to the token, or set production secret CLOUDFLARE_R2_API_TOKEN with that permission.'
            exit "$LIST_STATUS"
          fi
          if printf '%s' "$LIST_OUTPUT" | grep -Fq "$BUCKET_NAME"; then
            echo "R2 bucket already exists: $BUCKET_NAME"
          else
            npx --yes wrangler@latest r2 bucket create "$BUCKET_NAME"
            echo "R2 bucket created: $BUCKET_NAME"
          fi
      - name: Verify bucket exists
        shell: bash
        run: |
          npx --yes wrangler@latest r2 bucket list | grep -F "$BUCKET_NAME" >/dev/null
          echo 'R2 bucket verification passed.'
