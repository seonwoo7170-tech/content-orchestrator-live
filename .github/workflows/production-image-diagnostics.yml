            console.log('PAGE_TEXT',p,r.status,JSON.stringify(strip(body).slice(0,900)));
          }
          const post=await get(origin+'/2026/09/why-your-home-has-cold-spots-and-how-to.html');
          console.log('POST_TEMPLATE',JSON.stringify({
            status:post.status,
            authorNames:[...new Set([...post.text.matchAll(/class=["'][^"']*fn[^"']*["'][^>]*>\s*([^<]{1,40})/gi)].map((m)=>m[1].trim()))].slice(0,5),
            hasAuthorMeta:/<meta[^>]+name=["']author["']/i.test(post.text),
            hasArticleSchema:/"@type"\s*:\s*"(?:Article|BlogPosting|NewsArticle)"/i.test(post.text),
            hasDatePublishedSchema:/"datePublished"/i.test(post.text),
            hasBreadcrumb:/"BreadcrumbList"/i.test(post.text),
            imgSrcHosts:[...new Set([...post.text.matchAll(/<img[^>]+src=["'](https?:\/\/[^"'\/]+)/gi)].map((m)=>m[1]))].slice(0,6),
            imgAltSamples:[...post.text.matchAll(/<img[^>]+alt=["']([^"']{0,90})["']/gi)].map((m)=>m[1]).slice(0,5),
            relatedPostsWidget:/related[-_ ]?post/i.test(post.text),
            labelLinksInPost:(post.text.match(/\/search\/label\//g)||[]).length,
            commentsEnabled:!/comments are (closed|disabled)/i.test(post.text) && /comment/i.test(post.text)
          }));
