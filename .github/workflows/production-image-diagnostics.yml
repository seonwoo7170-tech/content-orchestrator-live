name: production-image-diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-image-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BASE_URL: https://content-orchestrator.smileseon.workers.dev
    steps:
      - name: Read production image state
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,100)}`);
            return j;
          }
          const [health, jobsResponse, today]=await Promise.all([
            get('/health'), get('/api/jobs?status=ready&limit=100'), get('/api/operations/today')
          ]);
          const jobs=Array.isArray(jobsResponse.jobs)?jobsResponse.jobs:[];
          const rows=[];
          for(const j of jobs){
            const [detail,imageResponse]=await Promise.all([
              get(`/api/jobs/${Number(j.id)}`), get(`/api/jobs/${Number(j.id)}/images`)
            ]);
            const job=detail.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const images=Array.isArray(imageResponse.images)?imageResponse.images:[];
            rows.push({
              id:Number(j.id), blogId:String(j.blog_id||''), mode:String(j.mode||''), updatedAt:j.updated_at||null,
              resultStatus:result?.status||null,
              imagePipeline:result?.imagePipeline||null,
              images:images.map(i=>({
                id:Number(i.id),role:i.role,position:Number(i.position||0),status:i.status,
                prompt:String(i.prompt||'').slice(0,700),
                provider:i.provider||null,model:i.model||null,error:i.error||null,publicUrl:Boolean(i.public_url),
                providerTaskId:i.provider_task_id||null,providerStatus:i.provider_status||null,
                providerAttemptCount:Number(i.provider_attempt_count||0),
                providerErrorCode:i.provider_error_code||null,providerCheckedAt:i.provider_checked_at||null,
                updatedAt:i.updated_at||null
              }))
            });
          }
          const counts={};
          const providers={};
          let activeKieTasks=0;
          let localRendererRows=0;
          for(const row of rows) for(const i of row.images){
            counts[i.status]=(counts[i.status]||0)+1;
            if(i.provider) providers[i.provider]=(providers[i.provider]||0)+1;
            if(i.provider==='kie-ai' && i.providerTaskId && ['waiting','queuing','generating','pending','processing','running'].includes(String(i.providerStatus||'').toLowerCase())) activeKieTasks+=1;
            if(i.provider==='local-free-renderer') localRendererRows+=1;
          }
          console.log('IMAGE_HEALTH',JSON.stringify({
            workerOk:health?.ok!==false,
            dailyWorkExecutionEnabled:health?.phase2Automation?.dailyWorkExecutionEnabled ?? null,
            readyJobs:rows.length,
            imageStatusCounts:counts,
            providerCounts:providers,
            activeKieTasks,
            localRendererRows,
            todayPlanDate:today?.planDate||null
          }));
          console.log('READY_IMAGE_JOBS',JSON.stringify(rows));
          NODE

