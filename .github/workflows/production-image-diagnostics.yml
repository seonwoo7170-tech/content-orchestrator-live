name: production-image-diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-image-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      BASE_URL: https://content-orchestrator.smileseon.workers.dev
      API_HUB_V2_BASE_URL: https://api-hub-v2.smileseon.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read production image state
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,100)}`);
            return j;
          }
          const [health, jobsResponse, today]=await Promise.all([
            get('/health'), get('/api/jobs?status=ready&limit=100'), get('/api/operations/today')
          ]);
          const jobs=Array.isArray(jobsResponse.jobs)?jobsResponse.jobs:[];
          const rows=[];
          for(const j of jobs){
            const [detail,imageResponse]=await Promise.all([
              get(`/api/jobs/${Number(j.id)}`), get(`/api/jobs/${Number(j.id)}/images`)
            ]);
            const job=detail.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const images=Array.isArray(imageResponse.images)?imageResponse.images:[];
            rows.push({
              id:Number(j.id), blogId:String(j.blog_id||''), mode:String(j.mode||''), updatedAt:j.updated_at||null,
              resultStatus:result?.status||null,
              imagePipeline:result?.imagePipeline||null,
              images:images.map(i=>({
                id:Number(i.id),role:i.role,position:Number(i.position||0),status:i.status,
                prompt:String(i.prompt||'').slice(0,700),
                provider:i.provider||null,model:i.model||null,error:i.error||null,publicUrl:Boolean(i.public_url),
                providerTaskId:i.provider_task_id||null,providerStatus:i.provider_status||null,
                providerAttemptCount:Number(i.provider_attempt_count||0),
                providerErrorCode:i.provider_error_code||null,providerCheckedAt:i.provider_checked_at||null,
                updatedAt:i.updated_at||null
              }))
            });
          }
          const counts={};
          const providers={};
          let activeKieTasks=0;
          let localRendererRows=0;
          for(const row of rows) for(const i of row.images){
            counts[i.status]=(counts[i.status]||0)+1;
            if(i.provider) providers[i.provider]=(providers[i.provider]||0)+1;
            if(i.provider==='kie-ai' && i.providerTaskId && ['waiting','queuing','generating','pending','processing','running'].includes(String(i.providerStatus||'').toLowerCase())) activeKieTasks+=1;
            if(i.provider==='local-free-renderer') localRendererRows+=1;
          }
          console.log('IMAGE_HEALTH',JSON.stringify({
            workerOk:health?.ok!==false,
            dailyWorkExecutionEnabled:health?.phase2Automation?.dailyWorkExecutionEnabled ?? null,
            readyJobs:rows.length,
            imageStatusCounts:counts,
            providerCounts:providers,
            activeKieTasks,
            localRendererRows,
            todayPlanDate:today?.planDate||null
          }));
          console.log('READY_IMAGE_JOBS',JSON.stringify(rows));
          NODE

      - name: Run the repair-publish tick and report why ready repair jobs are/aren't scheduled
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin,'content-type':'application/json'};
          const r=await fetch(base+'/api/operations/repair-publish-tick',{method:'POST',headers,body:'{}',cache:'no-store'});
          const j=await r.json().catch(()=>({}));
          console.log('REPAIR_PUBLISH_TICK',JSON.stringify(j));
          NODE

      - name: Dump QA rejection reasons for every currently-failed job (set JOB_IDS_TO_INSPECT below)
        shell: bash
        env:
          JOB_IDS_TO_INSPECT: '185,182,181,179,178,177,171,168,167,166,165,164,163,162,161'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const jobIds=String(process.env.JOB_IDS_TO_INSPECT||'').split(',').map((s)=>s.trim()).filter(Boolean);
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of jobIds){
            let after=0; const all=[];
            for(let page=0; page<20; page+=1){
              const r=await fetch(`${base}/api/jobs/${jobId}/events?after=${after}&limit=100`,{headers,cache:'no-store'});
              const j=await r.json().catch(()=>({}));
              if(!r.ok) { console.log('JOB_EVENTS_READ_FAILED',jobId,r.status); break; }
              const events=Array.isArray(j.events)?j.events:[];
              all.push(...events);
              if(events.length===0) break;
              after=j.lastEventId;
            }
            const qaLines=all.filter((e)=>/IMAGE_QA_REJECTED|SEMANTIC_MISMATCH|TEXT_OR_LOGO/.test(e.message||''));
            console.log('JOB_QA_REASONS',jobId,JSON.stringify(qaLines.slice(-6).map((e)=>e.message)));
          }
          NODE

      - name: Measure real per-image and per-job wall-clock timing from event timestamps (set TIMING_JOB_IDS below)
        shell: bash
        env:
          TIMING_JOB_IDS: '185,166,161'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const jobIds=String(process.env.TIMING_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean);
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of jobIds){
            let after=0; const all=[];
            for(let page=0; page<20; page+=1){
              const r=await fetch(`${base}/api/jobs/${jobId}/events?after=${after}&limit=100`,{headers,cache:'no-store'});
              const j=await r.json().catch(()=>({}));
              if(!r.ok) { console.log('TIMING_EVENTS_READ_FAILED',jobId,r.status); break; }
              const events=Array.isArray(j.events)?j.events:[];
              all.push(...events);
              if(events.length===0) break;
              after=j.lastEventId;
            }
            const first=all[0];
            const last=all[all.length-1];
            const spanMs=(first&&last)?(new Date(last.created_at).getTime()-new Date(first.created_at).getTime()):null;
            const imageLines=all.filter((e)=>/이미지|IMAGE_|QA_REJECTED|attached|생성|재시도/i.test(e.message||''));
            console.log('JOB_TIMING',jobId,JSON.stringify({
              totalEvents:all.length,
              firstEventAt:first?first.created_at:null,
              lastEventAt:last?last.created_at:null,
              spanMs,
              spanMinutes:spanMs!=null?Math.round(spanMs/60000*10)/10:null,
              sampleImageEvents:imageLines.slice(0,60).map((e)=>({t:e.created_at,m:e.message}))
            }));
          }
          NODE

      - name: Check why "today done" stays at zero -- compare completed-job status vs ready-job disappearance
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,150)}`);
            return j;
          }
          function kstDateKey(value){
            const raw=String(value||'').trim(); if(!raw) return '';
            const normalized=/(?:Z|[+-]\d\d:\d\d)$/i.test(raw)?raw:`${raw.replace(' ','T')}Z`;
            const date=new Date(normalized); if(Number.isNaN(date.getTime())) return '';
            return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
          }
          const nowKst=kstDateKey(new Date().toISOString());
          const completedResponse=await get('/api/jobs?status=completed&limit=100');
          const completedJobs=Array.isArray(completedResponse.jobs)?completedResponse.jobs:[];
          const completedToday=completedJobs.filter((j)=>kstDateKey(j.updated_at||j.created_at)===nowKst);
          console.log('COMPLETED_JOBS_TOTAL_AND_TODAY',JSON.stringify({
            nowKst, totalCompletedReturned:completedJobs.length,
            completedTodayCount:completedToday.length,
            mostRecentCompletedUpdatedAt:completedJobs.slice(0,5).map((j)=>({id:j.id,updated_at:j.updated_at,mode:j.mode}))
          }));
          // Cross-check: pull every non-ready status bucket and count jobs updated today, so we
          // can see where jobs that recently left "ready" actually landed.
          const statusesToScan=['completed','needs_review','failed','publishing_new','updating_existing','writing','critic_review','repairing','final_critic','queued'];
          const buckets={};
          for(const status of statusesToScan){
            try{
              const resp=await get(`/api/jobs?status=${encodeURIComponent(status)}&limit=100`);
              const jobs=Array.isArray(resp.jobs)?resp.jobs:[];
              const todayJobs=jobs.filter((j)=>kstDateKey(j.updated_at||j.created_at)===nowKst);
              buckets[status]={total:jobs.length,updatedToday:todayJobs.length,sample:todayJobs.slice(0,3).map((j)=>({id:j.id,updated_at:j.updated_at}))};
            }catch(error){ buckets[status]={error:String(error.message||error)}; }
          }
          console.log('JOB_STATUS_BUCKETS_TODAY',JSON.stringify(buckets));
          NODE

      - name: Confirm the archived=true fix actually surfaces completed history, and check Critic health
        shell: bash
        env:
          CRITIC_CHECK_JOB_IDS: '203,164,172,185'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,150)}`);
            return j;
          }
          const archivedResp=await get('/api/jobs?status=completed&archived=true&limit=20');
          const archivedJobs=Array.isArray(archivedResp.jobs)?archivedResp.jobs:[];
          console.log('ARCHIVED_COMPLETED_JOBS',JSON.stringify({
            count:archivedJobs.length,
            sample:archivedJobs.slice(0,10).map((j)=>({id:j.id,mode:j.mode,archived_at:j.archived_at,updated_at:j.updated_at}))
          }));
          const jobIds=String(process.env.CRITIC_CHECK_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean);
          for(const jobId of jobIds){
            let after=0; const all=[];
            for(let page=0; page<20; page+=1){
              const r=await fetch(`${base}/api/jobs/${jobId}/events?after=${after}&limit=100`,{headers,cache:'no-store'});
              const j=await r.json().catch(()=>({}));
              if(!r.ok) { console.log('CRITIC_EVENTS_READ_FAILED',jobId,r.status); break; }
              const events=Array.isArray(j.events)?j.events:[];
              all.push(...events);
              if(events.length===0) break;
              after=j.lastEventId;
            }
            const criticLines=all.filter((e)=>/딴지|critic/i.test(e.message||'')||/critic/i.test(e.event_type||'')||/critic/i.test(e.stage||''));
            console.log('CRITIC_EVENTS',jobId,JSON.stringify(criticLines.map((e)=>({t:e.created_at,m:e.message}))));
          }
          NODE

      - name: Audit smileinfo.net's actual published content for AdSense low-value-content signals
        shell: bash
        env:
          TARGET_BLOG_HOST: 'smileinfo.net'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const targetHost=String(process.env.TARGET_BLOG_HOST||'').toLowerCase();
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,150)}`);
            return j;
          }
          function stripHtml(value){
            return String(value||'')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ')
              .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&quot;/gi,'"').replace(/&#39;/gi,"'")
              .replace(/\s+/g,' ').trim();
          }
          const blogsResp=await get('/api/blogs');
          const blogs=Array.isArray(blogsResp.blogs)?blogsResp.blogs:[];
          const blog=blogs.find((b)=>{
            try{ return new URL(String(b.url||'')).hostname.toLowerCase().replace(/^www\./,'')===targetHost; }catch{ return false; }
          });
          if(!blog){ console.log('TARGET_BLOG_NOT_FOUND',JSON.stringify({targetHost,knownBlogs:blogs.map((b)=>({blogId:b.blogId,url:b.url}))})); process.exit(0); }
          console.log('TARGET_BLOG_FOUND',JSON.stringify(blog));

          const archivedResp=await get(`/api/jobs?status=completed&archived=true&blogId=${encodeURIComponent(blog.blogId)}&limit=100`);
          const archivedJobs=Array.isArray(archivedResp.jobs)?archivedResp.jobs:[];
          console.log('ARCHIVED_JOBS_FOR_BLOG',JSON.stringify({count:archivedJobs.length}));

          const audits=[];
          for(const job of archivedJobs){
            const detail=await get(`/api/jobs/${Number(job.id)}`);
            let result=null; try{ result=detail.job?.result_json?JSON.parse(detail.job.result_json):null; }catch{}
            const article=result?.article||null;
            if(!article){ audits.push({id:job.id,mode:job.mode,error:'NO_ARTICLE_IN_RESULT'}); continue; }
            const html=String(article.html||'');
            const text=stripHtml(html);
            const wordCount=text?text.split(/\s+/).filter(Boolean).length:0;
            const h2Count=(html.match(/<h2\b/gi)||[]).length;
            const imageCount=(html.match(/<img\b/gi)||[]).length;
            const faqBlocks=[...html.matchAll(/<p[^>]*>\s*Q\.?\s*([\s\S]*?)<\/p>\s*<p[^>]*>\s*A\.?\s*([\s\S]*?)<\/p>/gi)].map((m)=>stripHtml(m[2]).slice(0,120));
            audits.push({
              id:job.id, mode:job.mode, title:String(article.title||'').slice(0,80),
              bloggerPostId:job.blogger_post_id||null, targetUrl:job.target_url||null,
              wordCount, h2Count, imageCount, faqAnswerSample:faqBlocks.slice(0,2),
              archived_at:job.archived_at
            });
          }
          const thin=audits.filter((a)=>!a.error && a.wordCount<800);
          const noImages=audits.filter((a)=>!a.error && a.imageCount===0);
          // Group by bloggerPostId to tell "this post was created then later repaired
          // (one live URL, two job rows -- normal)" apart from "two DIFFERENT live URLs
          // that ended up with near-identical titles (a real duplicate-content problem)".
          const byPost={};
          for(const a of audits){ if(a.error) continue; const key=a.bloggerPostId||`no-post-id:${a.id}`; (byPost[key]=byPost[key]||[]).push({id:a.id,mode:a.mode,title:a.title,wordCount:a.wordCount}); }
          const postsWithMultipleJobs=Object.entries(byPost).filter(([,rows])=>rows.length>1).map(([postId,rows])=>({bloggerPostId:postId,jobs:rows}));
          const titleCounts={};
          for(const a of audits){ if(a.error) continue; titleCounts[a.title]=(titleCounts[a.title]||0)+1; }
          const duplicateTitles=Object.entries(titleCounts).filter(([,n])=>n>1).map(([title,n])=>({title,count:n}));
          console.log('CONTENT_AUDIT_SUMMARY',JSON.stringify({
            audited:audits.length,
            distinctBloggerPostIds:Object.keys(byPost).length,
            avgWordCount:Math.round(audits.filter((a)=>!a.error).reduce((s,a)=>s+a.wordCount,0)/Math.max(1,audits.filter((a)=>!a.error).length)),
            thinCount:thin.length,
            noImagesCount:noImages.length,
            thinSample:thin.slice(0,10).map((a)=>({id:a.id,title:a.title,wordCount:a.wordCount,imageCount:a.imageCount})),
            postsWithMultipleJobs,
            duplicateTitles
          }));
          console.log('CONTENT_AUDIT_FULL',JSON.stringify(audits));
          NODE

      - name: Check whether free-ai (qwen7b) is actually configured before considering it for Critic
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.API_HUB_V2_BASE_URL;
          const r=await fetch(`${base}/health?free_ai_check=${Date.now()}`,{cache:'no-store'});
          const h=await r.json().catch(()=>({}));
          if(!r.ok) throw new Error(`API_HUB_HEALTH_READ_FAILED:${r.status}`);
          console.log('FREE_AI_CONFIG_STATUS',JSON.stringify({
            freeAiConfigured:h.freeAiConfigured,
            freeAiFallbackEnabled:h.freeAiFallbackEnabled,
            freeAiModel:h.freeAiModel,
            freeAiCriticModel:h.freeAiCriticModel,
            geminiConfigured:h.geminiConfigured,
            criticProvider:h.criticProvider,
            criticConfigured:h.criticConfigured
          }));
          NODE

      - name: Verify the new critic/repair word-count instrumentation is actually landing in job_events
        shell: bash
        env:
          INSTRUMENTATION_SINCE: '2026-09-20T03:21:00Z'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const since=new Date(process.env.INSTRUMENTATION_SINCE);
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,150)}`);
            return j;
          }
          function toDate(value){
            const raw=String(value||'').trim(); if(!raw) return null;
            const normalized=/(?:Z|[+-]\d\d:\d\d)$/i.test(raw)?raw:`${raw.replace(' ','T')}Z`;
            const date=new Date(normalized); return Number.isNaN(date.getTime())?null:date;
          }
          const statusesToScan=['writing','critic_review','repairing','final_critic','needs_review','ready','failed'];
          const candidateIds=new Set();
          for(const status of statusesToScan){
            const resp=await get(`/api/jobs?status=${encodeURIComponent(status)}&limit=100`);
            const jobs=Array.isArray(resp.jobs)?resp.jobs:[];
            for(const job of jobs){
              const updated=toDate(job.updated_at||job.created_at);
              if(updated && updated>=since) candidateIds.add(Number(job.id));
            }
          }
          const completedResp=await get('/api/jobs?status=completed&archived=true&limit=100');
          for(const job of (Array.isArray(completedResp.jobs)?completedResp.jobs:[])){
            const updated=toDate(job.archived_at||job.updated_at);
            if(updated && updated>=since) candidateIds.add(Number(job.id));
          }
          console.log('INSTRUMENTATION_CANDIDATE_JOB_IDS',JSON.stringify([...candidateIds]));

          const roundRows=[];
          const eventsRouteOk=[];
          const criticStartRows=[];
          for(const jobId of candidateIds){
            let after=0; const all=[]; let routeFailed=false;
            for(let page=0; page<20; page+=1){
              const r=await fetch(`${base}/api/jobs/${jobId}/events?after=${after}&limit=100`,{headers,cache:'no-store'});
              const j=await r.json().catch(()=>({}));
              if(!r.ok){ console.log('EVENTS_READ_FAILED',jobId,r.status,JSON.stringify(j)); routeFailed=true; break; }
              const events=Array.isArray(j.events)?j.events:[];
              all.push(...events);
              if(events.length===0) break;
              after=j.lastEventId;
            }
            eventsRouteOk.push({jobId,ok:!routeFailed,eventCount:all.length});
            for(const event of all){
              const createdAt=toDate(event.created_at);
              const isCriticStart=event.event_type==='critic'&&createdAt&&createdAt>=since;
              if(isCriticStart){
                criticStartRows.push({jobId,stage:event.stage,createdAt:event.created_at,message:event.message,meta:event.meta||null});
              }
              if(!event.meta) continue;
              const hasCriticMeta=Object.prototype.hasOwnProperty.call(event.meta,'criticStatus');
              const hasRepairMeta=Object.prototype.hasOwnProperty.call(event.meta,'wordCountBefore');
              if(hasCriticMeta||hasRepairMeta){
                roundRows.push({jobId,stage:event.stage,eventType:event.event_type,createdAt:event.created_at,meta:event.meta});
              }
            }
          }
          console.log('EVENTS_ROUTE_STATUS',JSON.stringify(eventsRouteOk));
          console.log('CRITIC_STARTS_SINCE_FREEAI_DEPLOY',JSON.stringify({count:criticStartRows.length,rows:criticStartRows}));
          console.log('INSTRUMENTATION_ROUNDS_FOUND',JSON.stringify({count:roundRows.length}));
          console.log('INSTRUMENTATION_ROUNDS_DETAIL',JSON.stringify(roundRows));
          NODE

      - name: Check why no new writer/critic job has been queued in over 90 minutes
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`READ_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,150)}`);
            return j;
          }
          const today=await get('/api/operations/today');
          console.log('DAILY_PLAN_TODAY',JSON.stringify({
            planDate:today.planDate,
            slotCount:today.count,
            slots:(today.slots||[]).map((s)=>({id:s.id,blogId:s.blog_id||s.blogId,mode:s.mode,status:s.status,scheduledAt:s.scheduled_at||s.scheduledAt,jobId:s.job_id||s.jobId})),
            diagnosticSummary:today.diagnosticSummary,
            workload:today.workload
          }));
          const readyResp=await get('/api/jobs?status=ready&limit=100');
          console.log('READY_BACKLOG_COUNT',JSON.stringify({count:(readyResp.jobs||[]).length}));
          NODE

      - name: Check test job 204's writer/critic/repair outcome (read-only, does not create a new job)
        shell: bash
        env:
          TEST_JOB_ID: '204'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
