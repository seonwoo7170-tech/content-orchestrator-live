      # RETIRED. /api/jobs/{id}/run hands the pipeline to ctx.waitUntil, which does not survive a
      # full writer/critic/repair chain: job 251 died after its first event and sat at 'writing'.
      # claimStoredJobExecution is a global lane -- NOT EXISTS over every job in writing,
      # critic_review, repairing or final_critic -- so that one stuck row blocked job execution for
      # every blog until the 20-minute stale sweeper freed it. Re-running this step would simply
      # do it again the moment the sweeper returns the job to 'queued'.
      - name: Run the verification article directly, since it has no daily-plan slot
        if: false
        shell: bash
        env:
          VERIFY_JOB_ID: '251'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const jobId=String(process.env.VERIFY_JOB_ID||'').trim();
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          if(!jobId){ console.log('NO_VERIFY_JOB_ID'); process.exit(0); }
          const headers={'x-admin-api-key':admin,'content-type':'application/json'};
          const read=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
          const job=read.ok?((await read.json()).job||{}):{};
          console.log('BEFORE',JSON.stringify({status:job.status,updated:job.updated_at}));
          // runScheduledAutomaticWork iterates daily-plan slots, so a job created straight through
          // /api/jobs/new is never selected -- it sat queued because nothing was looking for it.
          if(String(job.status||'')!=='queued'){ console.log('NOT_QUEUED_SKIPPING'); process.exit(0); }
          const r=await fetch(`${base}/api/jobs/${jobId}/run`,{method:'POST',headers});
          console.log('RUN',r.status,JSON.stringify(await r.json().catch(()=>({}))));
          NODE

      - name: Confirm the execution lane is free, then enable smileinfo.net for one article
        if: always()
