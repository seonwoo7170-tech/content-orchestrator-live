          TARGET_BLOG_HOST: 'smileinfo.net'
          ENABLE_FOR_ONE_ARTICLE: 'true'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin,'content-type':'application/json'};
          async function api(path,init){
            const r=await fetch(base+path,{headers,cache:'no-store',...init});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`API_FAILED:${path}:${r.status}:${String(j.error||'unknown').slice(0,160)}`);
            return j;
          }
          // claimStoredJobExecution refuses while ANY job anywhere is in one of these states, so
          // nothing runs until job 251 is out of 'writing'.
          const ACTIVE=['writing','critic_review','repairing','final_critic'];
          const active=[];
          for(const status of ACTIVE){
            const r=await api(`/api/jobs?status=${status}&limit=20`);
            for(const j of (Array.isArray(r.jobs)?r.jobs:[])) active.push({id:j.id,status,blog:j.blog_id,updated:j.updated_at});
          }
          console.log('EXECUTION_LANE',JSON.stringify({blocked:active.length>0,active}));
          if(active.length>0){ console.log('LANE_STILL_BLOCKED_NOT_ENABLING'); process.exit(0); }
          if(String(process.env.ENABLE_FOR_ONE_ARTICLE)!=='true'){ console.log('ENABLE_SKIPPED'); process.exit(0); }

          const targetHost=String(process.env.TARGET_BLOG_HOST||'').toLowerCase();
          const blogs=await api('/api/blogs');
          const blog=(Array.isArray(blogs.blogs)?blogs.blogs:[]).find((b)=>{
            try{ return new URL(String(b.url||'')).hostname.toLowerCase().replace(/^www\./,'')===targetHost; }catch{ return false; }
          });
          if(!blog){ console.log('TARGET_BLOG_NOT_FOUND'); process.exit(1); }
          const blogId=String(blog.blogId);

          const before=await api('/api/automation/settings');
          const row=(before.blogs||[]).find((b)=>String(b.blogId)===blogId)||null;
          if(row?.effective?.enabled===true){ console.log('ALREADY_ENABLED',JSON.stringify(row.effective)); process.exit(0); }

          // Narrowed to exactly one article and one publication: the daily planner is the only
          // path that actually executes a job, and this is the smallest slice of it that verifies
          // the length contract, the internal links and the publish-time date fill together.
          const settings={
            ...(row?.override || before.global),
            enabled:true,
            newArticlesEnabled:true, newArticlesPerDay:1,
            repairsEnabled:false, repairsPerDay:0,
            fixedDailyTargets:true,
            autoPublishEnabled:true, maxPublishesPerDay:1,
            approvalMode:'auto'
          };
          const saved=await api(`/api/automation/settings/blogs/${encodeURIComponent(blogId)}`,{
            method:'PUT', body:JSON.stringify({inheritGlobal:false, settings})
          });
          console.log('ENABLED_FOR_ONE',JSON.stringify(saved.settings));
          const plan=await api('/api/operations/plan-today',{method:'POST',body:JSON.stringify({})});
          console.log('PLAN_TODAY',JSON.stringify(plan).slice(0,600));
          NODE

      - name: Retry the jobs the transition regression killed, and enable one verification article
        if: always()
        shell: bash
        env:
          TARGET_BLOG_HOST: 'smileinfo.net'
          RETRY_JOB_IDS: '157,234,236,241,246,251'
          ENABLE_FOR_ONE_ARTICLE: 'true'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin,'content-type':'application/json'};
          async function api(path,init){
            const r=await fetch(base+path,{headers,cache:'no-store',...init});
            const j=await r.json().catch(()=>({}));
            return {ok:r.ok,status:r.status,body:j};
          }
          // The execution lane is global: claimStoredJobExecution refuses while any job anywhere is
          // active. Retrying into a busy lane just queues work behind it, so this waits instead.
          const ACTIVE=['writing','critic_review','repairing','final_critic'];
          const active=[];
          for(const status of ACTIVE){
            const r=await api(`/api/jobs?status=${status}&limit=20`);
            for(const j of (Array.isArray(r.body.jobs)?r.body.jobs:[])) active.push({id:j.id,status,updated:j.updated_at});
          }
          console.log('EXECUTION_LANE',JSON.stringify({blocked:active.length>0,active}));

          const targetHost=String(process.env.TARGET_BLOG_HOST||'').toLowerCase();
          const blogsResp=await api('/api/blogs');
          const blog=(Array.isArray(blogsResp.body.blogs)?blogsResp.body.blogs:[]).find((b)=>{
            try{ return new URL(String(b.url||'')).hostname.toLowerCase().replace(/^www\./,'')===targetHost; }catch{ return false; }
          });
          if(!blog){ console.log('TARGET_BLOG_NOT_FOUND'); process.exit(1); }
          const blogId=String(blog.blogId);

          if(String(process.env.ENABLE_FOR_ONE_ARTICLE)==='true'){
            const before=await api('/api/automation/settings');
            const row=(before.body.blogs||[]).find((b)=>String(b.blogId)===blogId)||null;
            if(row?.effective?.enabled===true){
              console.log('ALREADY_ENABLED',JSON.stringify({newArticlesPerDay:row.effective.newArticlesPerDay,maxPublishesPerDay:row.effective.maxPublishesPerDay}));
            } else {
              // One article, one publication, no repairs. Enough to verify the length contract,
              // the internal links and the publish-time date fill together, and no more.
              const settings={
                ...(row?.override || before.body.global),
                enabled:true,
                newArticlesEnabled:true, newArticlesPerDay:1,
                repairsEnabled:false, repairsPerDay:0,
                fixedDailyTargets:true,
                autoPublishEnabled:true, maxPublishesPerDay:1,
                approvalMode:'auto'
              };
              const saved=await api(`/api/automation/settings/blogs/${encodeURIComponent(blogId)}`,{
                method:'PUT', body:JSON.stringify({inheritGlobal:false, settings})
              });
              console.log('ENABLED_FOR_ONE',saved.status,JSON.stringify(saved.body?.settings||saved.body));
              const plan=await api('/api/operations/plan-today',{method:'POST',body:JSON.stringify({})});
              console.log('PLAN_TODAY',plan.status,JSON.stringify(plan.body).slice(0,400));
            }
          }

          // 252 carries the same topic as 251 and is deliberately left failed, so the verification
          // cannot publish the same article twice.
          for(const id of String(process.env.RETRY_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const read=await api(`/api/jobs/${id}`);
            const job=read.body?.job||{};
            if(!['failed','needs_review'].includes(String(job.status||''))){
              console.log('RETRY_SKIPPED',id,JSON.stringify({status:job.status,reason:'NOT_RETRYABLE'}));
              continue;
            }
            const r=await api(`/api/jobs/${id}/retry`,{method:'POST',body:JSON.stringify({})});
            console.log('RETRY',id,r.status,JSON.stringify(r.body).slice(0,220));
          }
          NODE

      - name: Final summary of the verification articles (read-only, kept last so it lands in the log tail)
        if: always()
        shell: bash
        env:
          SUMMARY_JOB_IDS: '157'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const id of String(process.env.SUMMARY_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${id}`,{headers,cache:'no-store'});
            if(!r.ok){ console.log('SUMMARY_READ_FAILED',id,r.status); continue; }
            const job=(await r.json()).job||{};
            let result=null; try{ result=job.result_json?JSON.parse(job.result_json):null; }catch{}
            const article=result?.article||null;
            const html=String(article?.html||'');
            const text=html.replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim();
            const links=[...html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"']+)["']/gi)].map((m)=>m[1]);
            const internal=links.filter((h)=>h.includes('smileinfo.net'));
            const im=await fetch(`${base}/api/jobs/${id}/images`,{headers,cache:'no-store'});
            const imgs=im.ok?((await im.json()).images||[]):[];
            console.log('SUMMARY',id,JSON.stringify({
              imageRows:imgs.length,
              imageStates:[...new Set(imgs.map((x)=>x.status||x.state||'?'))],
              status:job.status, mode:job.mode, hold:job.hold_reason||null, lastError:job.last_error_code||null,
              topic:String(job.topic||'').slice(0,70),
              created:job.created_at, updated:job.updated_at,
              title:String(article?.title||'').slice(0,70),
              bodyChars:text.length,
              measuredLength:result?.advisoryReview?.measuredLength ?? result?.finalCritic?.measuredLength ?? null,
              criticStatus:result?.advisoryReview?.criticStatus ?? result?.finalCritic?.status ?? null,
              criticScore:result?.advisoryReview?.criticScore ?? null,
              deterministicQa:result?.deterministicQa?.status ?? null,
              reviewReason:result?.reviewReason ?? null,
              internalLinks:internal.length,
              internalSample:internal.slice(0,3),
              hasRelatedSection:/id="related-articles"/.test(html),
              publishedLineInBody:(text.match(/Published:[^.]{0,26}/)||[])[0]||null,
              h2:(html.match(/<h2\b/gi)||[]).length,
              img:(html.match(/<img\b/gi)||[]).length,
              repairAttempts:result?.repairAttempts ?? null,
              repairApplied:result?.repairApplied ?? null,
              totalRepairAttempts:result?.totalRepairAttempts ?? null,
              continuationAttempt:result?.continuationAttempt ?? null,
              guardCodes:(Array.isArray(result?.repairGuardViolations)?result.repairGuardViolations:[]).map((v)=>v&&v.code),
              issueCodes:(Array.isArray(result?.advisoryReview?.issues)?result.advisoryReview.issues:[]).map((i)=>i&&i.code),
              issueInstructions:(Array.isArray(result?.advisoryReview?.issues)?result.advisoryReview.issues:[]).slice(0,3).map((i)=>String(i?.repairInstruction||'').slice(0,150))
            }));
          }
          NODE
