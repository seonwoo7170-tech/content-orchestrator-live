      # /api/jobs/:id carries no publications array, so no job-detail step can answer this --
      # an empty "publications" field there is an artifact of the API shape, not evidence.
      # job_publications in D1 is the only place a real blogger_post_id can be read. Kept last,
      # and collapsed to one row per job, so a log tail always reaches the answer.
      - name: Read-only D1 check of job_publications for the 8 publish-gate jobs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT job_id || ' | plan=' || plan_date || ' | ' || status || ' | post=' || COALESCE(blogger_post_id, '-') || ' | at=' || COALESCE(scheduled_time, '-') || ' | n=' || attempts || ' | err=' || COALESCE(error, '-') AS publish_row FROM job_publications WHERE job_id IN (137,139,149,151,153,154,156,157) ORDER BY job_id;"

      # 176 and 164 have sat in publishing_new for ten hours across five snapshots, so this is
      # not a slow publish. holdStalePublicationClaims() repairs only the job_publications row
      # and never jobs.status, and publication-readback-recovery only lists rows that already
      # carry a blogger_post_id -- so a publish that broke off before Blogger returned an id
      # would have no owner at all. These reads say whether that is what happened.
      - name: Read-only D1 check of the two jobs stuck in publishing_new
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'PUB ' || job_id || ' | ' || status || ' | post=' || COALESCE(blogger_post_id, '-') || ' | n=' || attempts || ' | upd=' || updated_at || ' | err=' || COALESCE(error, '-') AS row_text FROM job_publications WHERE job_id IN (176,164) ORDER BY job_id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'JOB ' || id || ' | ' || status || ' | rec=' || COALESCE(recovery_state,'-') || ' | hold=' || COALESCE(hold_reason,'-') || ' | err=' || COALESCE(last_error_code,'-') || ' | upd=' || updated_at AS row_text FROM jobs WHERE id IN (176,164) ORDER BY id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'EVT ' || job_id || ' | ' || created_at || ' | ' || event_type || ' | ' || substr(message,1,110) AS row_text FROM job_events WHERE job_id IN (176,164) ORDER BY id DESC LIMIT 16;"

      # The five jobs held at QUALITY_REVIEW_LIMIT_REACHED burned all four continuations. What
      # matters is not that they failed but what the critic kept asking for and whether repair
      # could ever satisfy it: repair runs strategy 'targeted_sections_only', so a finding that
      # demands broad expansion (CORE_INFORMATION_MISSING from the Section 26 length pass) can
      # be re-emitted every round without repair being allowed to fix it.
      - name: Read what the critic keeps flagging on the five quality-limit jobs (read-only)
        shell: bash
        env:
          QUALITY_LIMIT_JOB_IDS: '213,212,208,207'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          function words(html){
            const text=String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
            if(!text) return 0;
            // Korean has no spaces between words, so a space count under-reports badly. Count
            // Hangul syllables as ~0.5 words and space-separated Latin runs as 1 each.
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          for(const jobId of String(process.env.QUALITY_LIMIT_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok){ console.log('QLIMIT_READ_FAILED',jobId,r.status); continue; }
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const critic=result?.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('QLIMIT_JOB',jobId,JSON.stringify({
              blog:job.blog_id,
              lang:result?.article?.language||null,
              title:String(result?.article?.title||'').slice(0,70),
              wordEstimate:words(result?.article?.html),
              continuationAttempt:result?.continuationAttempt??null,
              totalRepairAttempts:result?.totalRepairAttempts??null,
              repairAttempts:result?.repairAttempts??null,
              repairStrategy:result?.repairStrategy||null,
              reviewReason:result?.reviewReason||null,
              criticStatus:critic?.status||null,
              criticScore:critic?.score??null,
              issueCodes:issues.map((i)=>i.code)
            }));
            for(const issue of issues.slice(0,6)){
              console.log('QLIMIT_ISSUE',jobId,JSON.stringify({
                code:issue.code,severity:issue.severity,
                location:String(issue.location||'').slice(0,60),
                reason:String(issue.reason||'').slice(0,200),
                repairInstruction:String(issue.repairInstruction||'').slice(0,160)
              }));
            }
            const history=Array.isArray(result?.continuationHistory)?result.continuationHistory:[];
            console.log('QLIMIT_HISTORY',jobId,JSON.stringify(history.map((h)=>({
              n:h.continuationAttempt,status:h.status,reason:h.reviewReason,repairs:h.repairAttempts,guard:h.repairGuardViolationCount
            }))));
          }
          NODE

      # The queue filled with blocked jobs roughly ten hours after the evidence-basis deploy
      # (api-hub-v2 run #44, 2026-09-21T20:51:29Z). Before touching anything the only question
      # worth answering is whether that deploy changed the failure mix or whether these are the
      # holds that were already running. Every read here is a plain SELECT, split on the deploy
      # boundary so the comparison is visible rather than asserted.
      - name: Did the evidence-basis deploy change the failure mix? (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT (CASE WHEN created_at >= '2026-09-21 20:52:00' THEN 'AFTER ' ELSE 'BEFORE' END) || ' | ' || COALESCE(last_error_code,'(none)') || ' | ' || status || ' | n=' || COUNT(*) AS row_text FROM jobs WHERE archived_at IS NULL AND created_at >= '2026-09-20 00:00:00' GROUP BY (CASE WHEN created_at >= '2026-09-21 20:52:00' THEN 'AFTER ' ELSE 'BEFORE' END), last_error_code, status ORDER BY row_text;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'JOB ' || id || ' | ' || status || ' | err=' || COALESCE(last_error_code,'-') || ' | hold=' || COALESCE(hold_reason,'-') || ' | created=' || created_at || ' | upd=' || updated_at AS row_text FROM jobs WHERE archived_at IS NULL AND id >= 205 ORDER BY id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'EVT ' || job_id || ' | ' || created_at || ' | ' || event_type || ' | ' || substr(message,1,140) AS row_text FROM job_events WHERE job_id >= 218 AND (message LIKE '%CRITIC%' OR message LIKE '%WRITER_JSON%' OR message LIKE '%evidence%' OR event_type LIKE '%critic%') ORDER BY id DESC LIMIT 30;"

      # Whether the writer is actually emitting article.evidence decides which way to go: an
      # empty field everywhere means the new prompt is inert and the holds are the old length
      # problem, while a populated one alongside UNSUPPORTED_SOURCE_ATTRIBUTION findings means
      # the new pass is what is consuming the continuation budget.
      - name: Is the writer emitting evidence, and is it what the critic is failing on? (read-only)
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          function words(html){
            const text=String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
            if(!text) return 0;
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          for(let jobId=205;jobId<=232;jobId+=1){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok) continue;
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            if(!result) { console.log('EV_JOB',jobId,JSON.stringify({status:job.status,err:job.last_error_code||null,result:null})); continue; }
            const article=result.article||null;
            const evidence=Array.isArray(article?.evidence)?article.evidence:null;
            const critic=result.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('EV_JOB',jobId,JSON.stringify({
              status:job.status,err:job.last_error_code||null,
              createdAt:job.created_at||null,
              lang:article?.language||null,
              title:String(article?.title||'').slice(0,60),
              words:words(article?.html),
              sources:Array.isArray(article?.sources)?article.sources.length:null,
              evidenceCount:evidence?evidence.length:0,
              evidenceBases:evidence?evidence.map((e)=>e&&e.basis):null,
              continuationAttempt:result.continuationAttempt??null,
              reviewReason:result.reviewReason||null,
              criticScore:critic?.score??null,
              issueCodes:issues.map((i)=>i.code)
            }));
            if(evidence&&evidence.length){
              for(const entry of evidence.slice(0,4)){
                console.log('EV_ENTRY',jobId,JSON.stringify({
                  basis:entry&&entry.basis,
                  claim:String((entry&&entry.claim)||'').slice(0,90),
                  source:String((entry&&entry.source)||'').slice(0,90)
                }));
              }
            }
          }
          NODE

      # Five of the holds created before the evidence deploy, and several after it, ended on
      # reviewReason TARGETED_REPAIR_SCOPE_VIOLATION -- repair produced an article the guard
      # rejected, every attempt, until the continuation budget ran out. result.repairGuardViolations
      # records which guard threw and on what, so this says whether they are all the same guard
      # and whether source-quality findings are the ones that cannot be applied.
      - name: Which repair guard is actually rejecting the held jobs? (read-only)
        shell: bash
        env:
          GUARD_JOB_IDS: '207,208,209,213,214,215,216,217,218,220,223'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of String(process.env.GUARD_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok){ console.log('GUARD_READ_FAILED',jobId,r.status); continue; }
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const violations=Array.isArray(result?.repairGuardViolations)?result.repairGuardViolations:[];
            const critic=result?.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('GUARD_JOB',jobId,JSON.stringify({
              err:job.last_error_code||null,
              reviewReason:result?.reviewReason||null,
              repairAttempts:result?.repairAttempts??null,
              repairApplied:result?.repairApplied??null,
              violationCount:violations.length,
              violationCodes:violations.map((v)=>v&&v.code),
              violationMeta:violations.map((v)=>v&&v.meta).slice(0,4)
            }));
            for(const issue of issues.slice(0,8)){
              console.log('GUARD_ISSUE',jobId,JSON.stringify({
                code:issue.code,
                location:String(issue.location||'').slice(0,40),
                repairInstruction:String(issue.repairInstruction||'').slice(0,150)
              }));
            }
            const history=Array.isArray(result?.continuationHistory)?result.continuationHistory:[];
            console.log('GUARD_HISTORY',jobId,JSON.stringify(history.map((h)=>({
              n:h.continuationAttempt,reason:h.reviewReason,repairs:h.repairAttempts,guard:h.repairGuardViolationCount
            }))));
          }
          NODE

      # ONE-TIME, GUARDED MUTATION. These seven were held at the continuation limit by two
      # things now fixed: the guard read "html li 55" as the 55th block rather than the 55th
      # list item and threw TARGET_NOT_FOUND, discarding the whole repair batch (208, 209, 214,
      # 217, 218, 220, and 215 in two of its rounds), and the critic's evidence pass reported
      # legitimate TourAPI-sourced claims as fabrications (215, 217, 218, 220) before being
      # taken back out. 207, 213, 216 and 223 are deliberately absent: the first two need block
      # insertions no repair can make, 216 needs an HTML restructure the guard rejects by
      # design, and 223 holds CRITIC_SCHEMA_INVALID, which is not a continuation code -- its
      # retry would null result_json and delete its images.
      #
      # The guard POSTs only while a job is still needs_review AND held AND holding
      # QUALITY_REVIEW_LIMIT_REACHED AND still carrying an article in result_json, so a re-run
      # of this workflow is a no-op once a job has moved, and a job that somehow lost its
      # article is never pushed down the destructive branch. clearedImages in each response
      # shows whether anything was destroyed.
      - name: One-time guarded retry of the seven repairable quality-limit jobs (mutating, no-op once cleared)
        shell: bash
        env:
          GUARD_FIX_RETRY_JOB_IDS: '208,209,214,215,217,218,220'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of String(process.env.GUARD_FIX_RETRY_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const hasArticle=Boolean(result&&result.article&&typeof result.article==='object');
            const eligible=String(job.status)==='needs_review'
              && String(job.recovery_state)==='held'
              && String(job.hold_reason||'')==='QUALITY_REVIEW_LIMIT_REACHED'
              && String(job.last_error_code||'')==='QUALITY_REVIEW_LIMIT_REACHED'
              && hasArticle;
            if(!eligible){
              console.log('GUARDFIX_RETRY_SKIPPED',jobId,JSON.stringify({
                status:job.status,recoveryState:job.recovery_state||null,
                hold:job.hold_reason||null,err:job.last_error_code||null,hasArticle
              }));
              continue;
            }
            const res=await fetch(`${base}/api/jobs/${jobId}/retry`,{method:'POST',headers,cache:'no-store'});
            const body=await res.json().catch(()=>({}));
            console.log('GUARDFIX_RETRY_RESULT',jobId,res.status,JSON.stringify(body));
          }
          NODE
