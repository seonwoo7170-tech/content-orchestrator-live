      - name: Compare each blog's recent pipeline output against its own older content (read-only)
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          async function getJson(url,headers=UA){
            const r=await fetch(url,{headers,cache:'no-store',redirect:'follow'});
            if(!r.ok) throw new Error('FETCH_FAILED:'+url+':'+r.status);
            return r.json();
          }
          function strip(v){
            return String(v||'').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim();
          }
          function stats(v){
            v=v.slice().sort((a,b)=>a-b);
            if(!v.length) return null;
            const at=(q)=>v[Math.min(v.length-1,Math.floor(v.length*q))];
            return {n:v.length,min:v[0],median:at(0.5),max:v[v.length-1]};
          }
          const CUT='2026-08-01';
          const blogsResp=await getJson(base+'/api/blogs',{'x-admin-api-key':admin});
          for(const blog of (Array.isArray(blogsResp.blogs)?blogsResp.blogs:[])){
            let origin; try{ origin=new URL(String(blog.url)).origin; }catch{ continue; }
            const tag=String(blog.name||blog.blogId).replace(/\s+/g,'_');
            const rows=[];
            try{
              let start=1,total=null;
              for(let page=0;page<20;page+=1){
                const feed=await getJson(`${origin}/feeds/posts/default?alt=json&max-results=150&start-index=${start}`);
                const f=feed.feed||{};
                if(total===null) total=Number(f['openSearch$totalResults']?.$t||0);
                const entries=Array.isArray(f.entry)?f.entry:[];
                if(!entries.length) break;
                for(const e of entries){
                  const html=String(e.content?.$t||'');
                  const text=strip(html);
                  const host=new URL(origin).hostname.replace(/^www\./,'');
                  const links=[...html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"']+)["']/gi)].map((m)=>m[1]);
                  rows.push({
                    published:String(e.published?.$t||'').slice(0,10),
                    chars:text.length,
                    h2:(html.match(/<h2\b/gi)||[]).length,
                    inLinks:links.filter((h)=>h.includes(host)).length
                  });
                }
                start+=entries.length;
                if(total && start>total) break;
              }
            }catch(e){ console.log('SPLIT_FEED_FAILED',tag,String(e.message||e)); continue; }
            const recent=rows.filter((r)=>r.published>=CUT);
            const older=rows.filter((r)=>r.published<CUT);
            console.log('ERA_SPLIT',tag,JSON.stringify({
              cutoff:CUT,
              recentChars:stats(recent.map((r)=>r.chars)),
              olderChars:stats(older.map((r)=>r.chars)),
              recentH2:stats(recent.map((r)=>r.h2)),
              olderH2:stats(older.map((r)=>r.h2)),
              recentZeroInternalLinks:recent.filter((r)=>r.inLinks===0).length,
              olderZeroInternalLinks:older.filter((r)=>r.inLinks===0).length
            }));
          }
          NODE

      - name: Verify the second-opinion audit's claims about smileinfo.net (read-only)
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const origin='https://www.smileinfo.net';
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          async function get(url){
            try{ const r=await fetch(url,{headers:UA,cache:'no-store',redirect:'follow'});
              return {status:r.status,ok:r.ok,url:r.url,text:r.ok?await r.text():''}; }
            catch(e){ return {status:0,ok:false,url,text:'',err:String(e.message||e)}; }
          }
          function strip(v){ return String(v||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/&#8209;/g,'-').replace(/\s+/g,' ').trim(); }

          // CLAIM 1: PC/AI posts are still on this domain.
          const sm=await get(origin+'/sitemap.xml');
          const smUrls=[...sm.text.matchAll(/<loc>([^<]+)<\/loc>/gi)].map((m)=>m[1]);
          const byMonth={};
          for(const u of smUrls){ const m=u.match(/\/(\d{4})\/(\d{2})\//); if(m) byMonth[`${m[1]}-${m[2]}`]=(byMonth[`${m[1]}-${m[2]}`]||0)+1; }
          console.log('SITEMAP',JSON.stringify({status:sm.status,locs:smUrls.length,byMonth,
            nested:smUrls.filter((u)=>/sitemap/i.test(u)).slice(0,5)}));
          for(const nested of smUrls.filter((u)=>/sitemap/i.test(u)).slice(0,5)){
            const n=await get(nested);
            const nu=[...n.text.matchAll(/<loc>([^<]+)<\/loc>/gi)].map((m)=>m[1]);
            const nb={}; for(const u of nu){ const m=u.match(/\/(\d{4})\/(\d{2})\//); if(m) nb[`${m[1]}-${m[2]}`]=(nb[`${m[1]}-${m[2]}`]||0)+1; }
            console.log('SITEMAP_NESTED',nested,JSON.stringify({locs:nu.length,byMonth:nb}));
          }
          for(const ym of ['2026/03','2026/04','2026/05','2026/06','2026/07','2025/12']){
            const a=await get(`${origin}/${ym}/`);
            console.log('ARCHIVE',ym,a.status,(a.text.match(/class=["'][^"']*post-outer[^"']*["']/gi)||[]).length);
          }
          for(const q of ['v0.dev','Zen','SSD','NPU','overclocking','laptop','PSU']){
            const s=await get(`${origin}/search?q=${encodeURIComponent(q)}`);
            const titles=[...s.text.matchAll(/<h3[^>]*class=["'][^"']*post-title[^"']*["'][^>]*>\s*<a[^>]*>([\s\S]*?)<\/a>/gi)].map((m)=>strip(m[1])).slice(0,4);
            console.log('BLOGGER_SEARCH',q,s.status,JSON.stringify(titles));
          }
          const feedAll=await get(`${origin}/feeds/posts/default?alt=json&max-results=500&start-index=1`);
          let parsed=null; try{ parsed=JSON.parse(feedAll.text); }catch{}
          console.log('FEED_TOTAL',JSON.stringify({
            total:parsed?.feed?.['openSearch$totalResults']?.$t||null,
            oldest:(Array.isArray(parsed?.feed?.entry)?parsed.feed.entry:[]).map((e)=>String(e.published?.$t||'').slice(0,10)).sort()[0]||null,
            blogTitle:strip(parsed?.feed?.title?.$t||'')
          }));

          // CLAIM 2: in-body dates contradict the real publish date; CLAIM 3: bare "Editorial Team"
          // byline; CLAIM 4: source lists that look like citations but are unlinkable prose.
          const entries=Array.isArray(parsed?.feed?.entry)?parsed.feed.entry:[];
          let dateMismatch=0, hasInBodyDate=0, editorialTeam=0, methodologySection=0;
          const bareSourceSamples=[];
          let linkedSourceTotal=0, bareSourceTotal=0;
          for(const e of entries){
            const html=String(e.content?.$t||'');
            const text=strip(html);
            const pub=String(e.published?.$t||'').slice(0,10);
            const m=text.match(/Published:\s*([A-Za-z]+\s+\d{4}|[^|<]{0,30})/i);
            if(m){
              hasInBodyDate+=1;
              const claimed=m[1].trim();
              const month=new Date(pub).toLocaleString('en-US',{month:'long',timeZone:'UTC'});
              const year=pub.slice(0,4);
              if(!new RegExp(`${month}\\s+${year}`,'i').test(claimed)) {
                dateMismatch+=1;
                if(dateMismatch<=6) console.log('DATE_MISMATCH',JSON.stringify({feedPublished:pub,inBody:claimed.slice(0,40),title:strip(e.title?.$t||'').slice(0,60)}));
              }
            }
            if(/Editorial Team/i.test(text)) editorialTeam+=1;
            if(/Sources and Methodology|Sources & Methodology/i.test(text)) methodologySection+=1;
            const secIdx=html.search(/Sources (?:and|&amp;|&) Methodology/i);
            if(secIdx>=0){
              const tail=html.slice(secIdx);
              const items=[...tail.matchAll(/<li\b[^>]*>([\s\S]*?)<\/li>/gi)].map((x)=>x[1]).slice(0,10);
              for(const it of items){
                if(/<a\b[^>]*href/i.test(it)) linkedSourceTotal+=1;
                else { bareSourceTotal+=1; if(bareSourceSamples.length<8) bareSourceSamples.push(strip(it).slice(0,70)); }
              }
            }
          }
          console.log('BODY_CLAIMS',JSON.stringify({
            posts:entries.length, hasInBodyDate, dateMismatch, editorialTeam, methodologySection,
            linkedSourceItems:linkedSourceTotal, bareSourceItems:bareSourceTotal, bareSourceSamples
          }));
          NODE

      - name: Re-measure smileinfo.net source sections correctly and check the quoted citation names
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const origin='https://www.smileinfo.net';
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          const r=await fetch(`${origin}/feeds/posts/default?alt=json&max-results=500`,{headers:UA,cache:'no-store'});
          const feed=await r.json();
          const entries=Array.isArray(feed.feed?.entry)?feed.feed.entry:[];
          function strip(v){ return String(v||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim(); }

          // The earlier count sliced from the FIRST match, which is the "In This Article" table of
          // contents, so it swallowed the whole body. Take the LAST occurrence instead.
          let linked=0, bare=0, withSection=0;
          const bareSamples=[];
          const quoted=[
            'Standard Plumbing Maintenance Guidelines','Appliance Maintenance Guidelines',
            'Standard Residential Carpentry and Hardware Maintenance Guidelines',
            'Wood Moisture Dynamics','Editorial Archive','Standard Guide'
          ];
          const quotedHits={}; for(const q of quoted) quotedHits[q]=0;
          let anyByline=0;
          for(const e of entries){
            const html=String(e.content?.$t||'');
            const text=strip(html);
            for(const q of quoted) if(text.includes(q)) quotedHits[q]+=1;
            if(/Editorial Team|By\s+[A-Z][a-z]+\s+[A-Z][a-z]+/.test(text)) anyByline+=1;
            const idx=html.toLowerCase().lastIndexOf('sources and methodology');
            if(idx<0) continue;
            withSection+=1;
            const tail=html.slice(idx);
            const items=[...tail.matchAll(/<li\b[^>]*>([\s\S]*?)<\/li>/gi)].map((m)=>m[1]);
            for(const it of items){
              if(/<a\b[^>]*href\s*=\s*["']https?:/i.test(it)) linked+=1;
              else { bare+=1; if(bareSamples.length<10) bareSamples.push(strip(it).slice(0,80)); }
            }
          }
          console.log('SOURCE_SECTIONS',JSON.stringify({posts:entries.length,withSection,linkedItems:linked,bareItems:bare,bareSamples}));
          console.log('QUOTED_CITATION_NAMES',JSON.stringify(quotedHits));
          console.log('BYLINE',JSON.stringify({postsWithAnyByline:anyByline,postsWithout:entries.length-anyByline}));
          NODE

      - name: Dump the exact markup carrying the in-body date and byline on smileinfo.net
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const origin='https://www.smileinfo.net';
          const r=await fetch(`${origin}/feeds/posts/default?alt=json&max-results=500`,{headers:{'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'},cache:'no-store'});
