          });
          if(!blog){ console.log('TARGET_BLOG_NOT_FOUND',targetHost); process.exit(1); }
          const blogId=String(blog.blogId);
          console.log('TARGET',JSON.stringify({blogId,name:blog.name,url:blog.url}));

          const before=await api('/api/automation/settings');
          const row=(before.blogs||[]).find((b)=>String(b.blogId)===blogId)||null;
          // Printed in full so the exact prior state can be restored later. inheritGlobal matters:
          // while it is true the blog runs on the global settings and its own row is inert.
          console.log('BEFORE_GLOBAL',JSON.stringify(before.global));
          console.log('BEFORE_BLOG',JSON.stringify(row));

          if(String(process.env.APPLY_DISABLE)!=='true'){ console.log('DRY_RUN_ONLY'); process.exit(0); }
          if(row?.inheritGlobal===false && row?.settings?.enabled===false){ console.log('ALREADY_DISABLED'); process.exit(0); }

          // Detach this blog from the global settings and switch it off. enabled:false stops both
          // halves: buildDailySlotsFromAutomation skips the blog entirely, and the auto-publisher
          // refuses it. Every other field is carried over from what was in effect, so flipping
          // enabled back to true restores exactly today's behaviour.
          const effective=row?.effective || before.global;
          const saved=await api(`/api/automation/settings/blogs/${encodeURIComponent(blogId)}`,{
            method:'PUT',
            body:JSON.stringify({inheritGlobal:false,settings:{...effective,enabled:false}})
          });
          console.log('SAVED',JSON.stringify(saved));

          const after=await api('/api/automation/settings');
          const afterRow=(after.blogs||[]).find((b)=>String(b.blogId)===blogId)||null;
          console.log('AFTER_BLOG',JSON.stringify(afterRow));
          console.log('AFTER_OTHER_BLOGS',JSON.stringify((after.blogs||[])
            .filter((b)=>String(b.blogId)!==blogId)
            .map((b)=>({blogId:b.blogId,inheritGlobal:b.inheritGlobal,enabled:b.effective?.enabled,newArticles:b.effective?.newArticlesEnabled,autoPublish:b.effective?.autoPublishEnabled}))));
          NODE

