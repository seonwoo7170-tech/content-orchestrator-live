# probe: job-167-semantic-mismatch-investigation-2026-09-19
# probe: repair-existing-auto-publish-stuck-investigation-2026-09-19

      # /api/jobs/:id carries no publications array, so no job-detail step can answer this --
      # an empty "publications" field there is an artifact of the API shape, not evidence.
      # job_publications in D1 is the only place a real blogger_post_id can be read. Kept last,
      # and collapsed to one row per job, so a log tail always reaches the answer.
      - name: Read-only D1 check of job_publications for the 8 publish-gate jobs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT job_id || ' | plan=' || plan_date || ' | ' || status || ' | post=' || COALESCE(blogger_post_id, '-') || ' | at=' || COALESCE(scheduled_time, '-') || ' | n=' || attempts || ' | err=' || COALESCE(error, '-') AS publish_row FROM job_publications WHERE job_id IN (137,139,149,151,153,154,156,157) ORDER BY job_id;"

      # 176 and 164 have sat in publishing_new for ten hours across five snapshots, so this is
      # not a slow publish. holdStalePublicationClaims() repairs only the job_publications row
      # and never jobs.status, and publication-readback-recovery only lists rows that already
      # carry a blogger_post_id -- so a publish that broke off before Blogger returned an id
      # would have no owner at all. These reads say whether that is what happened.
      - name: Read-only D1 check of the two jobs stuck in publishing_new
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'PUB ' || job_id || ' | ' || status || ' | post=' || COALESCE(blogger_post_id, '-') || ' | n=' || attempts || ' | upd=' || updated_at || ' | err=' || COALESCE(error, '-') AS row_text FROM job_publications WHERE job_id IN (176,164) ORDER BY job_id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'JOB ' || id || ' | ' || status || ' | rec=' || COALESCE(recovery_state,'-') || ' | hold=' || COALESCE(hold_reason,'-') || ' | err=' || COALESCE(last_error_code,'-') || ' | upd=' || updated_at AS row_text FROM jobs WHERE id IN (176,164) ORDER BY id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'EVT ' || job_id || ' | ' || created_at || ' | ' || event_type || ' | ' || substr(message,1,110) AS row_text FROM job_events WHERE job_id IN (176,164) ORDER BY id DESC LIMIT 16;"

      # The five jobs held at QUALITY_REVIEW_LIMIT_REACHED burned all four continuations. What
      # matters is not that they failed but what the critic kept asking for and whether repair
      # could ever satisfy it: repair runs strategy 'targeted_sections_only', so a finding that
      # demands broad expansion (CORE_INFORMATION_MISSING from the Section 26 length pass) can
      # be re-emitted every round without repair being allowed to fix it.
      - name: Read what the critic keeps flagging on the five quality-limit jobs (read-only)
        shell: bash
        env:
          QUALITY_LIMIT_JOB_IDS: '213,212,208,207'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          function words(html){
            const text=String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
            if(!text) return 0;
            // Korean has no spaces between words, so a space count under-reports badly. Count
            // Hangul syllables as ~0.5 words and space-separated Latin runs as 1 each.
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          for(const jobId of String(process.env.QUALITY_LIMIT_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            if(!r.ok){ console.log('QLIMIT_READ_FAILED',jobId,r.status); continue; }
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const critic=result?.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('QLIMIT_JOB',jobId,JSON.stringify({
              blog:job.blog_id,
              lang:result?.article?.language||null,
              title:String(result?.article?.title||'').slice(0,70),
              wordEstimate:words(result?.article?.html),
              continuationAttempt:result?.continuationAttempt??null,
              totalRepairAttempts:result?.totalRepairAttempts??null,
              repairAttempts:result?.repairAttempts??null,
              repairStrategy:result?.repairStrategy||null,
              reviewReason:result?.reviewReason||null,
              criticStatus:critic?.status||null,
              criticScore:critic?.score??null,
              issueCodes:issues.map((i)=>i.code)
            }));
            for(const issue of issues.slice(0,6)){
              console.log('QLIMIT_ISSUE',jobId,JSON.stringify({
                code:issue.code,severity:issue.severity,
                location:String(issue.location||'').slice(0,60),
                reason:String(issue.reason||'').slice(0,200),
                repairInstruction:String(issue.repairInstruction||'').slice(0,160)
              }));
            }
            const history=Array.isArray(result?.continuationHistory)?result.continuationHistory:[];
            console.log('QLIMIT_HISTORY',jobId,JSON.stringify(history.map((h)=>({
              n:h.continuationAttempt,status:h.status,reason:h.reviewReason,repairs:h.repairAttempts,guard:h.repairGuardViolationCount
            }))));
          }
          NODE

      # The queue filled with blocked jobs roughly ten hours after the evidence-basis deploy
      # (api-hub-v2 run #44, 2026-09-21T20:51:29Z). Before touching anything the only question
      # worth answering is whether that deploy changed the failure mix or whether these are the
      # holds that were already running. Every read here is a plain SELECT, split on the deploy
      # boundary so the comparison is visible rather than asserted.
      - name: Did the evidence-basis deploy change the failure mix? (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT (CASE WHEN created_at >= '2026-09-21 20:52:00' THEN 'AFTER ' ELSE 'BEFORE' END) || ' | ' || COALESCE(last_error_code,'(none)') || ' | ' || status || ' | n=' || COUNT(*) AS row_text FROM jobs WHERE archived_at IS NULL AND created_at >= '2026-09-20 00:00:00' GROUP BY (CASE WHEN created_at >= '2026-09-21 20:52:00' THEN 'AFTER ' ELSE 'BEFORE' END), last_error_code, status ORDER BY row_text;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'JOB ' || id || ' | ' || status || ' | err=' || COALESCE(last_error_code,'-') || ' | hold=' || COALESCE(hold_reason,'-') || ' | created=' || created_at || ' | upd=' || updated_at AS row_text FROM jobs WHERE archived_at IS NULL AND id >= 205 ORDER BY id;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'EVT ' || job_id || ' | ' || created_at || ' | ' || event_type || ' | ' || substr(message,1,140) AS row_text FROM job_events WHERE job_id >= 218 AND (message LIKE '%CRITIC%' OR message LIKE '%WRITER_JSON%' OR message LIKE '%evidence%' OR event_type LIKE '%critic%') ORDER BY id DESC LIMIT 30;"

      # Whether the writer is actually emitting article.evidence decides which way to go: an
      # empty field everywhere means the new prompt is inert and the holds are the old length
      # problem, while a populated one alongside UNSUPPORTED_SOURCE_ATTRIBUTION findings means
      # the new pass is what is consuming the continuation budget.
      - name: Is the writer emitting evidence, and is it what the critic is failing on? (read-only)
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          function words(html){
            const text=String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
            if(!text) return 0;
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          for(let jobId=205;jobId<=232;jobId+=1){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok) continue;
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            if(!result) { console.log('EV_JOB',jobId,JSON.stringify({status:job.status,err:job.last_error_code||null,result:null})); continue; }
            const article=result.article||null;
            const evidence=Array.isArray(article?.evidence)?article.evidence:null;
            const critic=result.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('EV_JOB',jobId,JSON.stringify({
              status:job.status,err:job.last_error_code||null,
              createdAt:job.created_at||null,
              lang:article?.language||null,
              title:String(article?.title||'').slice(0,60),
              words:words(article?.html),
              sources:Array.isArray(article?.sources)?article.sources.length:null,
              evidenceCount:evidence?evidence.length:0,
              evidenceBases:evidence?evidence.map((e)=>e&&e.basis):null,
              continuationAttempt:result.continuationAttempt??null,
              reviewReason:result.reviewReason||null,
              criticScore:critic?.score??null,
              issueCodes:issues.map((i)=>i.code)
            }));
            if(evidence&&evidence.length){
              for(const entry of evidence.slice(0,4)){
                console.log('EV_ENTRY',jobId,JSON.stringify({
                  basis:entry&&entry.basis,
                  claim:String((entry&&entry.claim)||'').slice(0,90),
                  source:String((entry&&entry.source)||'').slice(0,90)
                }));
              }
            }
          }
          NODE

      # Five of the holds created before the evidence deploy, and several after it, ended on
      # reviewReason TARGETED_REPAIR_SCOPE_VIOLATION -- repair produced an article the guard
      # rejected, every attempt, until the continuation budget ran out. result.repairGuardViolations
      # records which guard threw and on what, so this says whether they are all the same guard
      # and whether source-quality findings are the ones that cannot be applied.
      - name: Which repair guard is actually rejecting the held jobs? (read-only)
        shell: bash
        env:
          GUARD_JOB_IDS: '207,208,209,213,214,215,216,217,218,220,223'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of String(process.env.GUARD_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok){ console.log('GUARD_READ_FAILED',jobId,r.status); continue; }
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const violations=Array.isArray(result?.repairGuardViolations)?result.repairGuardViolations:[];
            const critic=result?.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            console.log('GUARD_JOB',jobId,JSON.stringify({
              err:job.last_error_code||null,
              reviewReason:result?.reviewReason||null,
              repairAttempts:result?.repairAttempts??null,
              repairApplied:result?.repairApplied??null,
              violationCount:violations.length,
              violationCodes:violations.map((v)=>v&&v.code),
              violationMeta:violations.map((v)=>v&&v.meta).slice(0,4)
            }));
            for(const issue of issues.slice(0,8)){
              console.log('GUARD_ISSUE',jobId,JSON.stringify({
                code:issue.code,
                location:String(issue.location||'').slice(0,40),
                repairInstruction:String(issue.repairInstruction||'').slice(0,150)
              }));
            }
            const history=Array.isArray(result?.continuationHistory)?result.continuationHistory:[];
            console.log('GUARD_HISTORY',jobId,JSON.stringify(history.map((h)=>({
              n:h.continuationAttempt,reason:h.reviewReason,repairs:h.repairAttempts,guard:h.repairGuardViolationCount
            }))));
          }
          NODE

      # ONE-TIME, GUARDED MUTATION. These seven were held at the continuation limit by two
      # things now fixed: the guard read "html li 55" as the 55th block rather than the 55th
      # list item and threw TARGET_NOT_FOUND, discarding the whole repair batch (208, 209, 214,
      # 217, 218, 220, and 215 in two of its rounds), and the critic's evidence pass reported
      # legitimate TourAPI-sourced claims as fabrications (215, 217, 218, 220) before being
      # taken back out. 207, 213, 216 and 223 are deliberately absent: the first two need block
      # insertions no repair can make, 216 needs an HTML restructure the guard rejects by
      # design, and 223 holds CRITIC_SCHEMA_INVALID, which is not a continuation code -- its
      # retry would null result_json and delete its images.
      #
      # The guard POSTs only while a job is still needs_review AND held AND holding
      # QUALITY_REVIEW_LIMIT_REACHED AND still carrying an article in result_json, so a re-run
      # of this workflow is a no-op once a job has moved, and a job that somehow lost its
      # article is never pushed down the destructive branch. clearedImages in each response
      # shows whether anything was destroyed.
      - name: One-time guarded retry of the seven repairable quality-limit jobs (mutating, no-op once cleared)
        shell: bash
        env:
          GUARD_FIX_RETRY_JOB_IDS: '208,209,214,215,217,218,220'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          for(const jobId of String(process.env.GUARD_FIX_RETRY_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const hasArticle=Boolean(result&&result.article&&typeof result.article==='object');
            const eligible=String(job.status)==='needs_review'
              && String(job.recovery_state)==='held'
              && String(job.hold_reason||'')==='QUALITY_REVIEW_LIMIT_REACHED'
              && String(job.last_error_code||'')==='QUALITY_REVIEW_LIMIT_REACHED'
              && hasArticle;
            if(!eligible){
              console.log('GUARDFIX_RETRY_SKIPPED',jobId,JSON.stringify({
                status:job.status,recoveryState:job.recovery_state||null,
                hold:job.hold_reason||null,err:job.last_error_code||null,hasArticle
              }));
              continue;
            }
            const res=await fetch(`${base}/api/jobs/${jobId}/retry`,{method:'POST',headers,cache:'no-store'});
            const body=await res.json().catch(()=>({}));
            console.log('GUARDFIX_RETRY_RESULT',jobId,res.status,JSON.stringify(body));
          }
          NODE

      # The thumbnail overlay caption is still unsatisfying after the heading-derived fallback
      # shipped. buildThumbnailHook prefers the writer's own thumbnailHook over everything else,
      # so what actually lands on the image is almost always writer-authored -- reading the real
      # values, next to each title, says whether the problem is the writer's phrasing, the
      # heading fallback, or the generic filler at the bottom of the chain.
      - name: Read the actual thumbnail hooks the writer produced (read-only)
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          const GENERIC=new Set([
            'Fix the Risky Stuff First','Try This First','Don’t Ignore This','What Matters Most','Start Here',
            '큰돈 들기 전에 먼저','이것부터 확인',
            '놓치면 안 되는 것','고를 때 핵심은 이것',
            '핵심부터 확인'
          ]);
          for(let jobId=205;jobId<=236;jobId+=1){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok) continue;
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const article=result?.article;
            if(!article) continue;
            const hook=String(article.thumbnailHook||'');
            console.log('HOOK',jobId,JSON.stringify({
              lang:article.language||null,
              title:String(article.title||'').slice(0,64),
              writerHook:hook||null,
              hookLength:hook.length,
              isGenericFiller:GENERIC.has(hook),
              echoesTitle:Boolean(hook)&&String(article.title||'').toLowerCase().includes(hook.toLowerCase())
            }));
            const imgs=await fetch(`${base}/api/jobs/${jobId}/images`,{headers,cache:'no-store'});
            if(!imgs.ok) continue;
            const body=await imgs.json().catch(()=>({}));
            for(const image of (Array.isArray(body.images)?body.images:[])){
              if(String(image.role)!=='thumbnail') continue;
              console.log('HOOK_BAKED',jobId,JSON.stringify({
                hookText:image.hook_text||null,hookBaked:image.hook_baked??null,status:image.status
              }));
            }
          }
          NODE

      # The app shows today's plan as "2/20 linked, 17 held". A freshly generated slot is
      # inserted pending with a null hold_reason, so today's plan cannot start out held --
      # which means the 17 is almost certainly the standing backlog of held jobs rather than
      # anything about today. These three reads settle it: today's slots by status, every held
      # job by its reason, and where the held ones came from.
      - name: Is today's plan actually held, or is that the standing backlog? (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'SLOT | ' || plan_date || ' | ' || status || ' | hold=' || COALESCE(hold_reason,'-') || ' | job=' || (CASE WHEN job_id IS NULL THEN 'none' ELSE 'set' END) || ' | n=' || COUNT(*) AS row_text FROM daily_plan_slots WHERE plan_date >= date('now','-1 day') GROUP BY plan_date, status, hold_reason, (job_id IS NULL) ORDER BY plan_date DESC, status;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'HELD | ' || COALESCE(hold_reason,'(none)') || ' | ' || status || ' | n=' || COUNT(*) AS row_text FROM jobs WHERE archived_at IS NULL AND recovery_state = 'held' GROUP BY hold_reason, status ORDER BY COUNT(*) DESC;"
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command \
            "SELECT 'HELDJOB | ' || id || ' | ' || status || ' | ' || COALESCE(hold_reason,'-') || ' | created=' || substr(created_at,1,16) AS row_text FROM jobs WHERE archived_at IS NULL AND recovery_state = 'held' ORDER BY id;"

      # The four oldest quality-limit holds -- 154, 156, 157 and 165 -- have been cycling since
      # 2026-09-12. They were retried once with their articles and paid images intact and came
      # straight back, so a retry is not what they need. What the critic keeps asking of them,
      # and whether repair was ever able to act on it, decides whether there is a code fix here
      # at all or whether they are genuinely finished work that needs a human verdict.
      - name: What do the oldest quality-limit holds actually need? (read-only)
        shell: bash
        env:
          OLDEST_HOLD_JOB_IDS: '154,156,157,165,207,213,216'
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const headers={'x-admin-api-key':admin};
          function words(html){
            const text=String(html||'').replace(/<[^>]*>/g,' ').replace(/&[a-z#0-9]+;/gi,' ').replace(/\s+/g,' ').trim();
            if(!text) return 0;
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          for(const jobId of String(process.env.OLDEST_HOLD_JOB_IDS||'').split(',').map((s)=>s.trim()).filter(Boolean)){
            const r=await fetch(`${base}/api/jobs/${jobId}`,{headers,cache:'no-store'});
            if(!r.ok){ console.log('OLD_READ_FAILED',jobId,r.status); continue; }
            const j=await r.json().catch(()=>({}));
            const job=j.job||{};
            let result=null; try{result=job.result_json?JSON.parse(job.result_json):null;}catch{}
            const critic=result?.finalCritic||null;
            const issues=Array.isArray(critic?.issues)?critic.issues:[];
            const violations=Array.isArray(result?.repairGuardViolations)?result.repairGuardViolations:[];
            console.log('OLD_JOB',jobId,JSON.stringify({
              status:job.status,hold:job.hold_reason||null,
              lang:result?.article?.language||null,
              title:String(result?.article?.title||'').slice(0,58),
              words:words(result?.article?.html),
              criticScore:critic?.score??null,
              reviewReason:result?.reviewReason||null,
              repairApplied:result?.repairApplied??null,
              repairAttempts:result?.repairAttempts??null,
              guardCodes:violations.map((v)=>v&&v.code),
              issueCodes:issues.map((i)=>i.code)
            }));
            for(const issue of issues.slice(0,4)){
              console.log('OLD_ISSUE',jobId,JSON.stringify({
                code:issue.code,severity:issue.severity,
                location:String(issue.location||'').slice(0,30),
                repairInstruction:String(issue.repairInstruction||'').slice(0,130)
              }));
            }
          }
          NODE

      - name: Audit every live post on smileinfo.net from the Blogger feed (read-only, no D1)
        if: always()
        shell: bash
        env:
          SITE_ORIGIN: 'https://www.smileinfo.net'
        run: |
          node - <<'NODE'
          const origin=String(process.env.SITE_ORIGIN||'').replace(/\/+$/,'');
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          async function getText(url){
            const r=await fetch(url,{headers:UA,cache:'no-store',redirect:'follow'});
            return {status:r.status,ok:r.ok,text:r.ok?await r.text():''};
          }
          async function getJson(url){
            const r=await getText(url);
            if(!r.ok) throw new Error('FETCH_FAILED:'+url+':'+r.status);
            try{ return JSON.parse(r.text); }catch(e){ throw new Error('FEED_NOT_JSON:'+url); }
          }
          function stripHtml(v){
            return String(v||'')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ')
              .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
              .replace(/&quot;/gi,'"').replace(/&#39;/gi,"'")
              .replace(/\s+/g,' ').trim();
          }
          // Same length heuristic the repo already uses, so numbers here line up with job-side numbers.
          function words(text){
            if(!text) return 0;
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i+=1){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
          function normalizeForShingles(t){ return String(t||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,''); }
          const SIG=96, K=16, STEP=4;
          function signature(text){
            const n=normalizeForShingles(text);
            const mins=new Array(SIG).fill(0xffffffff);
            for(let i=0;i+K<=n.length;i+=STEP){
              const h=fnv(n.slice(i,i+K));
              for(let s=0;s<SIG;s+=1){ const v=(h ^ Math.imul(s+1,0x9e3779b1))>>>0; if(v<mins[s]) mins[s]=v; }
            }
            return mins;
          }
          function similarity(a,b){ let same=0; for(let i=0;i<SIG;i+=1) if(a[i]===b[i]) same+=1; return same/SIG; }
          function sentences(text){
            return String(text||'').split(/(?<=[.!?])\s+|(?<=다\.)\s*|(?<=요\.)\s*/)
              .map((s)=>s.trim()).filter((s)=>s.length>=18 && s.length<=220);
          }

          // ---- 1. every post, paged out of the Blogger feed
          const posts=[];
          let start=1, total=null;
          for(let page=0;page<20;page+=1){
            const feed=await getJson(`${origin}/feeds/posts/default?alt=json&max-results=150&start-index=${start}`);
            const f=feed.feed||{};
            if(total===null) total=Number(f['openSearch$totalResults']?.$t||0);
            const entries=Array.isArray(f.entry)?f.entry:[];
            if(entries.length===0) break;
            for(const e of entries){
              const html=String(e.content?.$t||'');
              const text=stripHtml(html);
              const link=(Array.isArray(e.link)?e.link:[]).find((l)=>l.rel==='alternate');
              const links=[...html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"']+)["']/gi)].map((m)=>m[1]);
              const hangul=(text.match(/[가-힣]/g)||[]).length;
              posts.push({
                title:stripHtml(e.title?.$t||''),
                url:String(link?.href||''),
                published:String(e.published?.$t||'').slice(0,10),
                updated:String(e.updated?.$t||'').slice(0,10),
                labels:(Array.isArray(e.category)?e.category:[]).map((c)=>c.term),
                chars:text.length,
                words:words(text),
                lang:hangul>text.length*0.15?'ko':'en',
                h2:(html.match(/<h2\b/gi)||[]).length,
                h3:(html.match(/<h3\b/gi)||[]).length,
                img:(html.match(/<img\b/gi)||[]).length,
                table:(html.match(/<table\b/gi)||[]).length,
                list:(html.match(/<(?:ul|ol)\b/gi)||[]).length,
                internalLinks:links.filter((h)=>h.includes('smileinfo.net')).length,
                externalLinks:links.filter((h)=>/^https?:\/\//i.test(h)&&!h.includes('smileinfo.net')).length,
                externalHosts:[...new Set(links.filter((h)=>/^https?:\/\//i.test(h)&&!h.includes('smileinfo.net')).map((h)=>{try{return new URL(h).hostname.replace(/^www\./,'');}catch{return 'bad';}}))],
                text
              });
            }
            start+=entries.length;
            if(total && start>total) break;
          }
          console.log('SITE_TOTALS',JSON.stringify({
            feedTotalResults:total, fetched:posts.length,
            ko:posts.filter((p)=>p.lang==='ko').length,
            en:posts.filter((p)=>p.lang==='en').length,
            firstPublished:posts.map((p)=>p.published).sort()[0]||null,
            lastPublished:posts.map((p)=>p.published).sort().slice(-1)[0]||null
          }));

          // ---- 2. length distribution, split by language
          function stats(rows,key){
            const v=rows.map((r)=>r[key]).sort((a,b)=>a-b);
            if(v.length===0) return null;
            const at=(q)=>v[Math.min(v.length-1,Math.floor(v.length*q))];
            return {n:v.length,min:v[0],p25:at(0.25),median:at(0.5),p75:at(0.75),max:v[v.length-1],mean:Math.round(v.reduce((s,x)=>s+x,0)/v.length)};
          }
          console.log('LENGTH_KO_CHARS',JSON.stringify(stats(posts.filter((p)=>p.lang==='ko'),'chars')));
          console.log('LENGTH_EN_CHARS',JSON.stringify(stats(posts.filter((p)=>p.lang==='en'),'chars')));
          console.log('LENGTH_KO_WORDS',JSON.stringify(stats(posts.filter((p)=>p.lang==='ko'),'words')));
          console.log('LENGTH_EN_WORDS',JSON.stringify(stats(posts.filter((p)=>p.lang==='en'),'words')));
          console.log('STRUCTURE_MEANS',JSON.stringify({
            h2:+(posts.reduce((s,p)=>s+p.h2,0)/Math.max(1,posts.length)).toFixed(1),
            img:+(posts.reduce((s,p)=>s+p.img,0)/Math.max(1,posts.length)).toFixed(1),
            table:+(posts.reduce((s,p)=>s+p.table,0)/Math.max(1,posts.length)).toFixed(1),
            internalLinks:+(posts.reduce((s,p)=>s+p.internalLinks,0)/Math.max(1,posts.length)).toFixed(1),
            externalLinks:+(posts.reduce((s,p)=>s+p.externalLinks,0)/Math.max(1,posts.length)).toFixed(1),
            postsWithZeroInternalLinks:posts.filter((p)=>p.internalLinks===0).length,
            postsWithZeroExternalLinks:posts.filter((p)=>p.externalLinks===0).length,
            postsWithZeroImages:posts.filter((p)=>p.img===0).length,
            thinUnder2000Chars:posts.filter((p)=>p.chars<2000).length,
            thinUnder3000Chars:posts.filter((p)=>p.chars<3000).length
          }));

          // ---- 3. publishing cadence (AdSense reads a burst of same-day posts as mass production)
          const byDay={};
          for(const p of posts) byDay[p.published]=(byDay[p.published]||0)+1;
          const days=Object.entries(byDay).sort();
          console.log('CADENCE',JSON.stringify({
            distinctDays:days.length,
            maxPostsInOneDay:Math.max(0,...days.map(([,n])=>n)),
            busiestDays:days.sort((a,b)=>b[1]-a[1]).slice(0,10)
          }));

          // ---- 4. near-duplicate posts
          const sigs=posts.map((p)=>signature(p.text));
          const pairs=[];
          for(let i=0;i<posts.length;i+=1){
            for(let j=i+1;j<posts.length;j+=1){
              const s=similarity(sigs[i],sigs[j]);
              if(s>=0.35) pairs.push({s:+s.toFixed(2),a:posts[i].title.slice(0,50),b:posts[j].title.slice(0,50),aUrl:posts[i].url,bUrl:posts[j].url});
            }
          }
          pairs.sort((x,y)=>y.s-x.s);
          console.log('NEAR_DUPLICATE_PAIRS',JSON.stringify({count:pairs.length,top:pairs.slice(0,25)}));

          // ---- 5. boilerplate: the same sentence appearing across many different posts
          const sentPosts=new Map();
          posts.forEach((p,idx)=>{
            for(const s of new Set(sentences(p.text))){
              const key=normalizeForShingles(s);
              if(key.length<14) continue;
              if(!sentPosts.has(key)) sentPosts.set(key,{sample:s,posts:new Set()});
              sentPosts.get(key).posts.add(idx);
            }
          });
          const boiler=[...sentPosts.values()].filter((v)=>v.posts.size>=3)
            .map((v)=>({inPosts:v.posts.size,sample:v.sample.slice(0,140)}))
            .sort((a,b)=>b.inPosts-a.inPosts);
          console.log('REPEATED_SENTENCES',JSON.stringify({distinct:boiler.length,top:boiler.slice(0,25)}));

          // ---- 6. title templates
          const titleHeads={};
          const titleTails={};
          for(const p of posts){
            const t=p.title.trim();
            const head=t.split(/[\s:·\-–—|]+/).slice(0,2).join(' ');
            const tail=t.split(/[\s:·\-–—|]+/).slice(-2).join(' ');
            if(head) titleHeads[head]=(titleHeads[head]||0)+1;
            if(tail) titleTails[tail]=(titleTails[tail]||0)+1;
          }
          const topOf=(o)=>Object.entries(o).filter(([,n])=>n>1).sort((a,b)=>b[1]-a[1]).slice(0,15);
          console.log('TITLE_PATTERNS',JSON.stringify({repeatedHeads:topOf(titleHeads),repeatedTails:topOf(titleTails)}));

          // ---- 7. labels
          const labelCounts={};
          for(const p of posts) for(const l of p.labels) labelCounts[l]=(labelCounts[l]||0)+1;
          console.log('LABELS',JSON.stringify(Object.entries(labelCounts).sort((a,b)=>b[1]-a[1])));

          // ---- 8. the pages AdSense explicitly looks for
          let pages=[];
          try{
            const pf=await getJson(`${origin}/feeds/pages/default?alt=json&max-results=50`);
            pages=(Array.isArray(pf.feed?.entry)?pf.feed.entry:[]).map((e)=>({
              title:stripHtml(e.title?.$t||''),
              url:String((Array.isArray(e.link)?e.link:[]).find((l)=>l.rel==='alternate')?.href||''),
              chars:stripHtml(e.content?.$t||'').length
            }));
          }catch(e){ console.log('PAGES_FEED_FAILED',String(e.message||e)); }
          const pageText=pages.map((p)=>p.title).join(' | ');
          console.log('STATIC_PAGES',JSON.stringify({count:pages.length,pages}));
          console.log('POLICY_PAGE_PRESENCE',JSON.stringify({
            privacy:/privacy|개인정보/i.test(pageText),
            about:/about|소개|누구/i.test(pageText),
            contact:/contact|문의|연락/i.test(pageText),
            terms:/terms|이용약관|약관/i.test(pageText)
          }));

          // ---- 9. site-level files and the homepage shell
          for(const path of ['/robots.txt','/ads.txt']){
            const r=await getText(origin+path);
            console.log('SITE_FILE',path,r.status,JSON.stringify(r.text.slice(0,300)));
          }
          const home=await getText(origin+'/');
          console.log('HOMEPAGE',JSON.stringify({
            status:home.status,
            bytes:home.text.length,
            hasDescriptionMeta:/<meta[^>]+name=["']description["']/i.test(home.text),
            title:(home.text.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]?.trim().slice(0,120)||null,
            navLinkCount:(home.text.match(/<a\b[^>]*class=["'][^"']*(?:nav|menu)[^"']*["']/gi)||[]).length,
            postsOnHomepage:(home.text.match(/class=["'][^"']*post-outer[^"']*["']/gi)||[]).length
          }));

          // ---- 10. every post, one line each, shortest first
          for(const p of [...posts].sort((a,b)=>a.chars-b.chars)){
            console.log('POST',JSON.stringify({
              published:p.published,lang:p.lang,chars:p.chars,words:p.words,
              h2:p.h2,h3:p.h3,img:p.img,table:p.table,list:p.list,
              inLinks:p.internalLinks,exLinks:p.externalLinks,exHosts:p.externalHosts.slice(0,4),
              labels:p.labels,title:p.title.slice(0,70),url:p.url
            }));
          }
          NODE

      - name: Same live audit across every configured blog, so ko and en can be compared (read-only)
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.BASE_URL;
          const admin=process.env.ADMIN_API_KEY;
          if(!admin) throw new Error('ADMIN_API_KEY_MISSING');
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          async function getText(url,headers=UA){
            const r=await fetch(url,{headers,cache:'no-store',redirect:'follow'});
            return {status:r.status,ok:r.ok,text:r.ok?await r.text():''};
          }
          async function getJson(url,headers=UA){
            const r=await getText(url,headers);
            if(!r.ok) throw new Error('FETCH_FAILED:'+url+':'+r.status);
            return JSON.parse(r.text);
          }
          function stripHtml(v){
            return String(v||'')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ')
              .replace(/<[^>]+>/g,' ')
              .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&').replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
              .replace(/&quot;/gi,'"').replace(/&#39;/gi,"'")
              .replace(/\s+/g,' ').trim();
          }
          function words(text){
            if(!text) return 0;
            const hangul=(text.match(/[가-힣]/g)||[]).length;
            const latin=(text.match(/[A-Za-z0-9][A-Za-z0-9'-]*/g)||[]).length;
            return hangul ? Math.round(hangul/2)+latin : latin;
          }
          function stats(v){
            v=v.slice().sort((a,b)=>a-b);
            if(!v.length) return null;
            const at=(q)=>v[Math.min(v.length-1,Math.floor(v.length*q))];
            return {n:v.length,min:v[0],p25:at(0.25),median:at(0.5),p75:at(0.75),max:v[v.length-1],mean:Math.round(v.reduce((s,x)=>s+x,0)/v.length)};
          }
          function fnv(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i+=1){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
          function norm(t){ return String(t||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,''); }
          const SIG=96,K=16,STEP=4;
          function signature(text){
            const n=norm(text); const mins=new Array(SIG).fill(0xffffffff);
            for(let i=0;i+K<=n.length;i+=STEP){ const h=fnv(n.slice(i,i+K));
              for(let s=0;s<SIG;s+=1){ const v=(h ^ Math.imul(s+1,0x9e3779b1))>>>0; if(v<mins[s]) mins[s]=v; } }
            return mins;
          }
          function sim(a,b){ let n=0; for(let i=0;i<SIG;i+=1) if(a[i]===b[i]) n+=1; return n/SIG; }
          function sentences(t){
            return String(t||'').split(/(?<=[.!?])\s+|(?<=다\.)\s*|(?<=요\.)\s*/)
              .map((s)=>s.trim()).filter((s)=>s.length>=18 && s.length<=220);
          }

          const blogsResp=await getJson(base+'/api/blogs',{'x-admin-api-key':admin});
          const blogs=(Array.isArray(blogsResp.blogs)?blogsResp.blogs:[]).filter((b)=>b&&b.url);
          console.log('BLOGS',JSON.stringify(blogs.map((b)=>({blogId:b.blogId,name:b.name,url:b.url,lang:b.language||b.lang||null}))));

          for(const blog of blogs){
            let origin;
            try{ origin=new URL(String(blog.url)).origin; }catch{ console.log('BAD_BLOG_URL',blog.blogId,blog.url); continue; }
            const tag=String(blog.name||blog.blogId).replace(/\s+/g,'_');
            const posts=[];
            try{
              let start=1,total=null;
              for(let page=0;page<20;page+=1){
                const feed=await getJson(`${origin}/feeds/posts/default?alt=json&max-results=150&start-index=${start}`);
                const f=feed.feed||{};
                if(total===null) total=Number(f['openSearch$totalResults']?.$t||0);
                const entries=Array.isArray(f.entry)?f.entry:[];
                if(!entries.length) break;
                for(const e of entries){
                  const html=String(e.content?.$t||'');
                  const text=stripHtml(html);
                  const links=[...html.matchAll(/<a\b[^>]*href\s*=\s*["']([^"']+)["']/gi)].map((m)=>m[1]);
                  const host=new URL(origin).hostname.replace(/^www\./,'');
                  const hangul=(text.match(/[가-힣]/g)||[]).length;
                  posts.push({
                    title:stripHtml(e.title?.$t||''),
                    url:String((Array.isArray(e.link)?e.link:[]).find((l)=>l.rel==='alternate')?.href||''),
                    published:String(e.published?.$t||'').slice(0,10),
                    labels:(Array.isArray(e.category)?e.category:[]).map((c)=>c.term),
                    chars:text.length, words:words(text),
                    lang:hangul>text.length*0.15?'ko':'en',
                    h2:(html.match(/<h2\b/gi)||[]).length,
                    img:(html.match(/<img\b/gi)||[]).length,
                    table:(html.match(/<table\b/gi)||[]).length,
                    inLinks:links.filter((h)=>h.includes(host)).length,
                    exLinks:links.filter((h)=>/^https?:\/\//i.test(h)&&!h.includes(host)).length,
                    text
                  });
                }
                start+=entries.length;
                if(total && start>total) break;
              }
            }catch(e){ console.log('FEED_FAILED',tag,origin,String(e.message||e)); continue; }

            const ko=posts.filter((p)=>p.lang==='ko'), en=posts.filter((p)=>p.lang==='en');
            const labelSet=new Set(); for(const p of posts) for(const l of p.labels) labelSet.add(l);
            const sigs=posts.map((p)=>signature(p.text));
            let dupPairs=0, topDup=[];
            for(let i=0;i<posts.length;i+=1) for(let j=i+1;j<posts.length;j+=1){
              const s=sim(sigs[i],sigs[j]);
              if(s>=0.35){ dupPairs+=1; if(topDup.length<5) topDup.push({s:+s.toFixed(2),a:posts[i].title.slice(0,40),b:posts[j].title.slice(0,40)}); }
            }
            const sentPosts=new Map();
            posts.forEach((p,idx)=>{ for(const s of new Set(sentences(p.text))){ const k=norm(s); if(k.length<14) continue;
              if(!sentPosts.has(k)) sentPosts.set(k,{sample:s,n:new Set()}); sentPosts.get(k).n.add(idx); } });
            const boiler=[...sentPosts.values()].filter((v)=>v.n.size>=3).sort((a,b)=>b.n.size-a.n.size);
            let pages=[];
            try{
              const pf=await getJson(`${origin}/feeds/pages/default?alt=json&max-results=50`);
              pages=(Array.isArray(pf.feed?.entry)?pf.feed.entry:[]).map((e)=>({title:stripHtml(e.title?.$t||''),chars:stripHtml(e.content?.$t||'').length}));
            }catch{}
            const pageText=pages.map((p)=>p.title).join(' | ');

            console.log('BLOG_AUDIT',tag,JSON.stringify({
              origin, posts:posts.length, ko:ko.length, en:en.length,
              first:posts.map((p)=>p.published).sort()[0]||null,
              last:posts.map((p)=>p.published).sort().slice(-1)[0]||null,
              koChars:stats(ko.map((p)=>p.chars)), enChars:stats(en.map((p)=>p.chars)),
              koWords:stats(ko.map((p)=>p.words)), enWords:stats(en.map((p)=>p.words)),
              koH2:stats(ko.map((p)=>p.h2)), enH2:stats(en.map((p)=>p.h2)),
              meanInLinks:+(posts.reduce((s,p)=>s+p.inLinks,0)/Math.max(1,posts.length)).toFixed(2),
              meanExLinks:+(posts.reduce((s,p)=>s+p.exLinks,0)/Math.max(1,posts.length)).toFixed(2),
              zeroInternalLinks:posts.filter((p)=>p.inLinks===0).length,
              zeroExternalLinks:posts.filter((p)=>p.exLinks===0).length,
              zeroImages:posts.filter((p)=>p.img===0).length,
              distinctLabels:labelSet.size,
              nearDuplicatePairs:dupPairs, topDup,
              repeatedSentenceGroups:boiler.length,
              repeatedSample:boiler.slice(0,3).map((v)=>({inPosts:v.n.size,sample:v.sample.slice(0,90)})),
              pages:pages.map((p)=>`${p.title}(${p.chars})`),
              policyPages:{privacy:/privacy|개인정보/i.test(pageText),about:/about|소개/i.test(pageText),contact:/contact|문의/i.test(pageText)}
            }));
            for(const p of posts.slice().sort((a,b)=>a.chars-b.chars).slice(0,15)){
              console.log('BLOG_POST',tag,JSON.stringify({published:p.published,lang:p.lang,chars:p.chars,words:p.words,h2:p.h2,img:p.img,inLinks:p.inLinks,exLinks:p.exLinks,title:p.title.slice(0,60)}));
            }
          }
          NODE

      - name: Read smileinfo.net's policy pages and post template the way an AdSense reviewer would
        if: always()
        shell: bash
        run: |
          node - <<'NODE'
          const origin='https://www.smileinfo.net';
          const UA={'user-agent':'Mozilla/5.0 (compatible; smileseon-content-audit/1.0)'};
          async function get(url){ const r=await fetch(url,{headers:UA,cache:'no-store',redirect:'follow'}); return {status:r.status,text:r.ok?await r.text():''}; }
          function strip(v){ return String(v||'').replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,' ').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ').trim(); }
          for(const p of ['/p/about.html','/p/about-smile-homefix.html','/p/contact.html','/p/privacy-policy.html','/p/disclaimer.html']){
