name: diagnose-stuck-job-180

on:
  push:
    branches:
      - 'claude/github-connection-check-umb3pv'
    paths:
      - '.github/diagnose-stuck-job-180-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'claude/github-connection-check-umb3pv'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose production job 180 safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          DB_ID="$(npx --yes wrangler@latest d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);const db=rows.find(x=>x.name==='content-orchestrator');if(db?.uuid)process.stdout.write(db.uuid);});")"
          test -n "$DB_ID"
          export D1_DATABASE_ID="$DB_ID"
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const db=process.env.D1_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function sql(query, params=[]){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{
              method:'POST',headers:{Authorization:`Bearer ${token}`,'content-type':'application/json'},
              body:JSON.stringify({sql:query,params})
            });
            const j=await r.json();
            if(!r.ok||j.success!==true) throw new Error(`D1_QUERY_FAILED:${r.status}`);
            return j.result?.[0]?.results||[];
          }
          const jobs=await sql(`SELECT id, mode, blog_id, status, updated_at, retry_count, recovery_state, next_retry_at, hold_reason, last_error_code, error, blogger_post_id, target_url, result_json FROM jobs WHERE id IN (179,180) ORDER BY id`,[]);
          const images=await sql(`SELECT id, job_id, role, position, status, provider, provider_status, provider_checked_at, error, CASE WHEN public_url IS NOT NULL AND public_url <> '' THEN 1 ELSE 0 END AS has_url, updated_at FROM job_images WHERE job_id IN (179,180) ORDER BY job_id, position, id`,[]);
          const pubs=await sql(`SELECT job_id, plan_date, slot_no, scheduled_time, status, attempts, blogger_post_id, error, updated_at FROM job_publications WHERE job_id IN (179,180) ORDER BY job_id, updated_at`,[]);
          const slots=await sql(`SELECT id, plan_date, blog_id, slot_no, kind, status, job_id, updated_at FROM daily_plan_slots WHERE job_id IN (179,180) ORDER BY job_id, id`,[]).catch(()=>[]);
          function safeJob(row){
            let result=null; try{result=JSON.parse(row.result_json||'');}catch{}
            const html=String(result?.article?.html||'');
            return {
              id:Number(row.id),mode:row.mode,blogId:row.blog_id,status:row.status,updatedAt:row.updated_at,
              retryCount:Number(row.retry_count||0),recoveryState:row.recovery_state||null,nextRetryAt:row.next_retry_at||null,
              holdReason:row.hold_reason||null,lastErrorCode:row.last_error_code||null,error:row.error||null,
              bloggerPostId:row.blogger_post_id||null,targetUrl:row.target_url||null,
              resultStatus:result?.status||null,
              finalCritic:result?.finalCritic?{status:result.finalCritic.status,score:Number(result.finalCritic.score||0),issues:Array.isArray(result.finalCritic.issues)?result.finalCritic.issues.length:null}:null,
              imagePipeline:result?.imagePipeline||null,
              articleHtmlLength:html.length,
              articleImageIds:(html.match(/data-job-image-id=/g)||[]).length
            };
          }
          for(const row of jobs) console.log('JOB_SAFE '+JSON.stringify(safeJob(row)));
          console.log('IMAGES_SAFE '+JSON.stringify(images.map(i=>({id:i.id,jobId:i.job_id,role:i.role,position:i.position,status:i.status,provider:i.provider,providerStatus:i.provider_status,providerCheckedAt:i.provider_checked_at,error:i.error||null,hasUrl:Boolean(i.has_url),updatedAt:i.updated_at}))));
          console.log('PUBLICATIONS_SAFE '+JSON.stringify(pubs));
          console.log('SLOTS_SAFE '+JSON.stringify(slots));
          NODE