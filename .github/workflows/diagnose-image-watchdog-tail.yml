name: diagnose-image-watchdog-tail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-image-watchdog-tail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Capture one production watchdog window
        shell: bash
        run: |
          set -u
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          rm -f /tmp/tail.log
          timeout 205s npx --yes wrangler@latest tail content-orchestrator --format json > /tmp/tail.log 2>&1 || true
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.existsSync('/tmp/tail.log')?fs.readFileSync('/tmp/tail.log','utf8'):'';
          const rows=text.split(/\r?\n/).filter(Boolean);
          let count=0;
          for(const raw of rows){
            let line=raw;
            if(!/(SERIAL_IMAGE|IMAGE_WORK|SCHEDULED_IMAGE|KIE|job.?105|jobId.?[:=]?\s*105|IMAGE_COMPLETION|IMAGE_LANE)/i.test(line)) continue;
            line=line
              .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+/gi,'Bearer [redacted]')
              .replace(/\b[a-f0-9]{24,}\b/gi,'[id]')
              .replace(/([?&](?:key|token|secret)=)[^&\s"']+/gi,'$1[redacted]');
            console.log(line.slice(0,12000));
            count++;
          }
          console.log(`MATCHED_LOG_LINES=${count}`);
          if(count===0){
            const tail=rows.slice(-12).map(line=>line.replace(/\b[a-f0-9]{24,}\b/gi,'[id]').slice(0,4000));
            console.log('TAIL_FALLBACK');
            for(const line of tail) console.log(line);
          }
          NODE
