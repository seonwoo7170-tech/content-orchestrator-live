name: deploy-cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/deploy-cloudflare-trigger'

permissions:
  contents: read

concurrency:
  group: content-orchestrator-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      WORKER_NAME: content-orchestrator

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source
        run: npm run verify
      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$HUB_API_KEY" || { echo 'HUB_API_KEY is missing'; exit 1; }
          test -n "$ADMIN_API_KEY" || { echo 'ADMIN_API_KEY is missing'; exit 1; }
      - name: Resolve or create D1 database
        shell: bash
        run: |
          list_db() { npx --yes wrangler@latest d1 list --json; }
          extract_id() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);const db=rows.find(x=>x.name==='content-orchestrator');if(db?.uuid)process.stdout.write(db.uuid);});"; }
          DB_ID="$(list_db | extract_id)"
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@latest d1 create content-orchestrator --location apac
            DB_ID="$(list_db | extract_id)"
          fi
          test -n "$DB_ID" || { echo 'Could not resolve D1 database ID'; exit 1; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Render Wrangler config
        run: node scripts/render-wrangler.mjs
      - name: Validate production automation gates
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('wrangler.jsonc','utf8');
          for (const needle of [
            '"HUB_REQUEST_TIMEOUT_MS": "180000"',
            '"BLOGGER_WRITES_ENABLED": "true"',
            '"AUTO_PUBLISH_EXECUTION_ENABLED": "true"',
            '"DAILY_WORK_EXECUTION_ENABLED": "true"',
            '"JOB_RECOVERY_EXECUTION_ENABLED": "true"',
            '"DAILY_NEW_PER_BLOG": "2"',
            '"DAILY_REPAIR_PER_BLOG": "2"',
            '"SERIAL_AI_COOLDOWN_MS": "30000"',
            '"SERIAL_AI_CHAIN_MAX_ITEMS": "4"',
            '"crons": ["*/3 * * * *", "*/5 * * * *"]'
          ]) if (!text.includes(needle)) throw new Error(`PRODUCTION_GATE_INVALID:${needle}`);
          NODE
      - name: Apply D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply content-orchestrator --remote --config wrangler.jsonc
      - name: Prepare runtime secret bundle
        shell: bash
        run: |
          node - <<'NODE'
          const { writeFileSync, chmodSync } = require('node:fs');
          const values = { HUB_API_KEY: process.env.HUB_API_KEY, ADMIN_API_KEY: process.env.ADMIN_API_KEY };
          for (const [key, value] of Object.entries(values)) if (!value) throw new Error(`${key}_REQUIRED`);
          writeFileSync('.deploy-secrets.json', JSON.stringify(values));
          chmodSync('.deploy-secrets.json', 0o600);
          NODE
      - name: Deploy Worker, PWA and runtime secrets atomically
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc --secrets-file .deploy-secrets.json
      - name: Production health read-back
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://content-orchestrator.smileseon.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=1;i<=15;i++){
            const stamp=`${Date.now()}_${i}`;
            const [healthResp,recoveryResp]=await Promise.all([
              fetch(`${base}/health?deploy=${stamp}`,{cache:'no-store'}),
              fetch(`${base}/api/operations/recovery?deploy=${stamp}`,{cache:'no-store',headers:{'x-admin-api-key':process.env.ADMIN_API_KEY}})
            ]);
            const [health,recovery]=await Promise.all([
              healthResp.json().catch(()=>({})),
              recoveryResp.json().catch(()=>({}))
            ]);
            const ok=healthResp.ok && recoveryResp.ok
              && health.bloggerWritesEnabled===true
              && health.phase2Automation?.autoPublishExecutionEnabled===true
              && recovery.executionEnabled===true
              && recovery.dailyWorkExecutionEnabled===true;
            if(ok){
              console.log(`PRODUCTION_AUTOMATION_READBACK_OK recoveryRetryWait=${Number(recovery.summary?.jobs?.retryWait||0)} ready=${Number(recovery.summary?.jobs?.ready||0)}`);
              process.exit(0);
            }
            await sleep(1000);
          }
          throw new Error('PRODUCTION_AUTOMATION_READBACK_FAILED');
          NODE
      - name: Ensure current daily plan and report workload
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://content-orchestrator.smileseon.workers.dev';
          const headers={'x-admin-api-key':process.env.ADMIN_API_KEY,'content-type':'application/json'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let lastStatus=0;
          for(let attempt=1;attempt<=5;attempt++){
            try {
              const response=await fetch(`${base}/api/operations/plan-today`,{method:'POST',headers,body:'{}',cache:'no-store',signal:AbortSignal.timeout(45000)});
              lastStatus=response.status;
              const plan=await response.json().catch(()=>({}));
              if(response.ok){
                const decisions=Array.isArray(plan.workload?.decisions)?plan.workload.decisions:[];
                const plannedWork=decisions.reduce((sum,d)=>sum+Number(d.newArticles||0)+Number(d.repairs||0),0);
                console.log(`PRODUCTION_DAILY_PLAN_ENSURED planDate=${String(plan.planDate||'unknown')} blogs=${Number(plan.blogCount||0)} requestedSlots=${Number(plan.requestedSlots||0)} insertedSlots=${Number(plan.insertedSlots||0)} plannedWork=${plannedWork} attempt=${attempt}`);
                process.exit(0);
              }
              if(response.status<500) throw Object.assign(new Error(`PRODUCTION_DAILY_PLAN_ENSURE_FAILED:${response.status}`),{hardFailure:true});
              console.log(`PRODUCTION_DAILY_PLAN_RETRY status=${response.status} attempt=${attempt}`);
            } catch(error) {
              if(error?.hardFailure) throw error;
              const code=String(error?.cause?.code||error?.code||error?.name||'TRANSPORT_UNKNOWN').slice(0,40);
              console.log(`PRODUCTION_DAILY_PLAN_RETRY transport=${code} attempt=${attempt}`);
            }
            await sleep(attempt*2000);
          }

          const [healthResp,todayResp,recoveryResp]=await Promise.all([
            fetch(`${base}/health?planFallback=${Date.now()}`,{cache:'no-store'}),
            fetch(`${base}/api/operations/today?planFallback=${Date.now()}`,{headers:{'x-admin-api-key':process.env.ADMIN_API_KEY},cache:'no-store'}),
            fetch(`${base}/api/operations/recovery?planFallback=${Date.now()}`,{headers:{'x-admin-api-key':process.env.ADMIN_API_KEY},cache:'no-store'})
          ]);
          const [health,today,recovery]=await Promise.all([
            healthResp.json().catch(()=>({})),todayResp.json().catch(()=>({})),recoveryResp.json().catch(()=>({}))
          ]);
          const healthy=healthResp.ok && todayResp.ok && recoveryResp.ok
            && health.bloggerWritesEnabled===true
            && recovery.executionEnabled===true
            && recovery.dailyWorkExecutionEnabled===true;
          if(!healthy) throw new Error(`PRODUCTION_DAILY_PLAN_AND_READBACK_FAILED:${lastStatus||'transport'}`);
          console.log(`PRODUCTION_DAILY_PLAN_INCONCLUSIVE upstreamStatus=${lastStatus||'transport'} slots=${Array.isArray(today.slots)?today.slots.length:0} recoveryReady=${Number(recovery.summary?.jobs?.ready||0)}`);
          NODE
      - name: Run bounded automatic work probe
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://content-orchestrator.smileseon.workers.dev';
          const headers={'x-admin-api-key':process.env.ADMIN_API_KEY,'content-type':'application/json'};
          let probe='not-run';
          try {
            const response=await fetch(`${base}/api/operations/work-tick?maxItems=1`,{
              method:'POST',headers,body:'{}',cache:'no-store',signal:AbortSignal.timeout(240000)
            });
            const work=await response.json().catch(()=>({}));
            if(response.status>=500) throw Object.assign(new Error(`PRODUCTION_WORK_TICK_FAILED:${response.status}:${String(work.error||'unknown').slice(0,80)}`),{hardFailure:true});
            const item=(Array.isArray(work.items)?work.items:[])[0]||{};
            probe=`completed attempted=${Number(work.attempted||0)} completed=${Number(work.completed||0)} failed=${Number(work.failed||0)} skipped=${Number(work.skipped||0)} itemStatus=${String(item.status||'none')} recovery=${String(item.recovery?.recoveryState||'none')} code=${String(item.errorCode||'none')}`;
            console.log(`PRODUCTION_WORK_TICK_OK ${probe}`);
          } catch(error) {
            if(error?.hardFailure) throw error;
            const code=String(error?.cause?.code||error?.code||error?.name||'TRANSPORT_UNKNOWN').slice(0,40);
            probe=`inconclusive transport=${code}`;
            console.log(`PRODUCTION_WORK_TICK_INCONCLUSIVE ${probe}`);
          }

          const [todayResp,recoveryResp,healthResp]=await Promise.all([
            fetch(`${base}/api/operations/today`,{headers:{'x-admin-api-key':process.env.ADMIN_API_KEY},cache:'no-store'}),
            fetch(`${base}/api/operations/recovery`,{headers:{'x-admin-api-key':process.env.ADMIN_API_KEY},cache:'no-store'}),
            fetch(`${base}/health?probe=${Date.now()}`,{cache:'no-store'})
          ]);
          const [today,recovery,health]=await Promise.all([
            todayResp.json().catch(()=>({})),recoveryResp.json().catch(()=>({})),healthResp.json().catch(()=>({}))
          ]);
          if(!todayResp.ok||!recoveryResp.ok||!healthResp.ok) throw new Error('PRODUCTION_PROGRESS_READBACK_FAILED');
          if(health.bloggerWritesEnabled!==true || recovery.executionEnabled!==true || recovery.dailyWorkExecutionEnabled!==true) {
            throw new Error('PRODUCTION_AUTOMATION_GATE_READBACK_FAILED');
          }
          const slots=Array.isArray(today.slots)?today.slots:[];
          const counts=slots.reduce((a,s)=>{const k=String(s.status||'unknown');a[k]=(a[k]||0)+1;return a;},{});
          const retrySlots=slots.filter(s=>String(s.recovery_state||'none')==='retry_wait').length;
          const heldSlots=slots.filter(s=>String(s.recovery_state||'none')==='held').length;
          console.log(`PRODUCTION_AUTOMATION_PROGRESS probe=${probe} slots=${slots.length} resolved=${Number(counts.resolved||0)} pending=${Number(counts.pending||0)} skipped=${Number(counts.skipped||0)} retryWaitSlots=${retrySlots} heldSlots=${heldSlots} dueJobRetries=${Array.isArray(recovery.dueRetries)?recovery.dueRetries.length:0}`);
          NODE
      - name: Smoke test API Hub to Cloudflare Workers AI
        run: node scripts/postdeploy-smoke.mjs
      - name: Cleanup generated deployment files
        if: always()
        shell: bash
        run: rm -f .deploy-secrets.json wrangler.jsonc
