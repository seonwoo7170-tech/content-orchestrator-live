name: deploy-cloudflare

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply remote D1 migrations before deploy'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/deploy-cloudflare-trigger'

permissions:
  contents: read

concurrency:
  group: content-orchestrator-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: content-orchestrator

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify source
        run: npm run verify
      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
      - name: Resolve or create D1 database
        shell: bash
        run: |
          list_db() { npx --yes wrangler@latest d1 list --json; }
          extract_id() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);const db=rows.find(x=>x.name==='content-orchestrator');if(db?.uuid)process.stdout.write(db.uuid);});"; }
          DB_ID="$(list_db | extract_id)"
          if [ -z "$DB_ID" ]; then
            npx --yes wrangler@latest d1 create content-orchestrator --location apac
            DB_ID="$(list_db | extract_id)"
          fi
          test -n "$DB_ID" || { echo 'Could not resolve D1 database ID'; exit 1; }
          echo "D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"
      - name: Render Wrangler config
        run: node scripts/render-wrangler.mjs
      - name: Validate production automation gates
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('wrangler.jsonc','utf8');
          for (const needle of [
            '"SYSTEM_PAUSED": "false"',
            '"main": "worker/mcp-entry.js"',
            '"HUB_REQUEST_TIMEOUT_MS": "180000"',
            '"BLOGGER_WRITES_ENABLED": "true"',
            '"AUTO_PUBLISH_EXECUTION_ENABLED": "true"',
            '"DAILY_WORK_EXECUTION_ENABLED": "true"',
            '"JOB_RECOVERY_EXECUTION_ENABLED": "true"',
            '"GSC_COLLECTION_ENABLED": "true"',
            '"GA4_COLLECTION_ENABLED": "true"',
            '"ADSENSE_COLLECTION_ENABLED": "true"',
            '"MODELSCOPE_IMAGE_ENABLED": "false"',
            '"KIE_IMAGE_CALLBACK_ENABLED": "false"',
            '"KIE_IMAGE_FALLBACK_ENABLED": "false"',
            '"DAILY_NEW_PER_BLOG": "2"',
            '"DAILY_REPAIR_PER_BLOG": "2"',
            '"TREND_KEYWORDS_ENABLED": "true"',
            '"SERIAL_AI_COOLDOWN_MS": "30000"',
            '"SERIAL_AI_CHAIN_MAX_ITEMS": "4"',
            '"SERIAL_IMAGE_COOLDOWN_MS": "0"',
            '"SERIAL_IMAGE_POLL_INTERVAL_MS": "3000"',
            '"SERIAL_ARTICLE_IMAGE_COOLDOWN_MS": "10000"',
            '"crons": ["*/3 * * * *", "*/5 * * * *"]'
          ]) if (!text.includes(needle)) throw new Error(`PRODUCTION_GATE_INVALID:${needle}`);
          NODE
      - name: Decide D1 migration mode
        id: d1_migrations
        shell: bash
        run: |
          APPLY=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply_migrations }}" = "true" ]; then
            APPLY=true
          elif [ -f .github/deploy-cloudflare-trigger ] && grep -qi 'with-migrations' .github/deploy-cloudflare-trigger; then
            APPLY=true
          fi
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          echo "D1 migrations requested: $APPLY"
      - name: Apply D1 migrations
        if: steps.d1_migrations.outputs.apply == 'true'
        run: npx --yes wrangler@latest d1 migrations apply content-orchestrator --remote --config wrangler.jsonc
      - name: Deploy Worker and PWA while preserving existing runtime secrets
        # Required by listJobImages even when optional migrations are not requested.
        run: |
          node scripts/ensure-image-schema.mjs
          npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Production public health read-back
        shell: bash
        run: |
          node - <<'NODE'
          const base='https://content-orchestrator.smileseon.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=1;i<=20;i++){
            const response=await fetch(`${base}/health?deploy=${Date.now()}_${i}`,{cache:'no-store'});
            const health=await response.json().catch(()=>({}));
            const ok=response.ok
              && health.systemPaused!==true
              && health.bloggerWritesEnabled===true
              && health.phase2Automation?.autoPublishExecutionEnabled===true;
            if(ok){
              console.log(`PRODUCTION_PUBLIC_HEALTH_OK systemPaused=${health.systemPaused} bloggerWrites=${health.bloggerWritesEnabled} autoPublish=${health.phase2Automation?.autoPublishExecutionEnabled}`);
              process.exit(0);
            }
            await sleep(1000);
          }
          throw new Error('PRODUCTION_PUBLIC_HEALTH_READBACK_FAILED');
          NODE

      - name: Verify recovered Job 105 image progress
        if: contains(github.event.head_commit.message, 'job105')
        run: node scripts/check-image-job-progress.mjs 105
