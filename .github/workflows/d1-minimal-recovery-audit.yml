name: d1-minimal-recovery-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/d1-minimal-recovery-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Minimal D1 reads for Job 105 and Threads
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,init={}){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{...init,headers:{...headers,...(init.headers||{})},signal:AbortSignal.timeout(30000)});
            const d=await r.json().catch(()=>({}));
            if(!r.ok||d.success===false) throw new Error(`${path}:${r.status}:${JSON.stringify(d.errors||d).slice(0,400)}`);
            return d;
          }
          const dbs=(await cf('/d1/database')).result||[];
          console.log('D1_DATABASES '+JSON.stringify(dbs.map(d=>({name:d.name,uuid:d.uuid}))));
          async function q(db,sql,params=[]){
            const d=await cf(`/d1/database/${db.uuid}/query`,{method:'POST',body:JSON.stringify({sql,params})});
            const x=Array.isArray(d.result)?d.result[0]:d.result;
            return {rows:x?.results||[],meta:x?.meta||{}};
          }
          const orch=dbs.find(d=>d.name==='content-orchestrator');
          if(orch){
            const job=await q(orch,`SELECT id,mode,blog_id,blogger_post_id,status,error,retry_count,recovery_state,next_retry_at,hold_reason,last_error_code,result_json,updated_at,archived_at FROM jobs WHERE id=?`,[105]);
            console.log('JOB105 '+JSON.stringify({rows:job.rows,meta:job.meta}));
            let images={rows:[],meta:{}};
            try{images=await q(orch,`SELECT id,job_id,role,position,status,provider,public_url,error,provider_task_id,updated_at FROM job_images WHERE job_id=? ORDER BY position,id`,[105]);}catch(e){
              try{images=await q(orch,`SELECT id,job_id,role,position,status,provider,public_url,error,updated_at FROM images WHERE job_id=? ORDER BY position,id`,[105]);}catch(e2){console.log('JOB105_IMAGES_READ_ERROR '+String(e2.message||e2));}
            }
            console.log('JOB105_IMAGES '+JSON.stringify({rows:images.rows,meta:images.meta}));
          }
          const threads=dbs.find(d=>d.name==='threads-automation-db');
          if(threads){
            for(const [label,sql] of [
              ['THREADS_TABLE_COUNTS',`SELECT 'scheduled_posts' t,COUNT(*) n FROM scheduled_posts UNION ALL SELECT 'publish_logs',COUNT(*) FROM publish_logs UNION ALL SELECT 'reply_actions',COUNT(*) FROM reply_actions UNION ALL SELECT 'pickhub_products',COUNT(*) FROM pickhub_products UNION ALL SELECT 'thread_insight_snapshots',COUNT(*) FROM thread_insight_snapshots`],
              ['THREADS_INDEXES',`SELECT name,tbl_name FROM sqlite_master WHERE type='index' AND name IN ('idx_scheduled_posts_status_updated','idx_thread_insights_captured','idx_reply_actions_daily_updated','idx_pickhub_products_active_updated','idx_pickhub_products_image_scope') ORDER BY name`],
              ['THREADS_RECENT_ACTIVITY',`SELECT status,COUNT(*) n FROM scheduled_posts WHERE updated_at>=datetime('now','-24 hours') GROUP BY status ORDER BY status`]
            ]){
              try{const out=await q(threads,sql);console.log(label+' '+JSON.stringify({rows:out.rows,meta:out.meta}));}catch(e){console.log(label+'_ERROR '+String(e.message||e));}
            }
          }
          const scripts=await cf('/workers/scripts');
          console.log('WORKER_SCRIPTS '+JSON.stringify((scripts.result||[]).filter(s=>['content-orchestrator','threads-automation-web'].includes(s.id)).map(s=>({id:s.id,modified_on:s.modified_on,etag:s.etag||null}))));
          NODE
