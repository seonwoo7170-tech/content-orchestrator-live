name: d1-minimal-recovery-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/d1-minimal-recovery-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Minimal D1 reads for Job 105 and Threads
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,init={}){
            const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{...init,headers:{...headers,...(init.headers||{})},signal:AbortSignal.timeout(30000)});
            const d=await r.json().catch(()=>({}));
            if(!r.ok||d.success===false) throw new Error(`${path}:${r.status}:${JSON.stringify(d.errors||d).slice(0,400)}`);
            return d;
          }
          const dbs=(await cf('/d1/database')).result||[];
          console.log('D1_DATABASES '+JSON.stringify(dbs.map(d=>({name:d.name,uuid:d.uuid}))));
          async function q(db,sql,params=[]){
            const d=await cf(`/d1/database/${db.uuid}/query`,{method:'POST',body:JSON.stringify({sql,params})});
            const x=Array.isArray(d.result)?d.result[0]:d.result;
            return {rows:x?.results||[],meta:x?.meta||{}};
          }
          async function threadsAudit(db,prefix){
            const tables=await q(db,`SELECT name FROM sqlite_master WHERE type='table' AND name IN ('scheduled_posts','publish_logs','reply_actions','pickhub_products','thread_insight_snapshots') ORDER BY name`);
            console.log(prefix+'_TABLES '+JSON.stringify({rows:tables.rows,meta:tables.meta}));
            const names=new Set(tables.rows.map(r=>r.name));
            if(names.has('scheduled_posts')){
              const activity=await q(db,`SELECT status,COUNT(*) n FROM scheduled_posts WHERE updated_at>=datetime('now','-24 hours') GROUP BY status ORDER BY status`);
              console.log(prefix+'_RECENT_ACTIVITY '+JSON.stringify({rows:activity.rows,meta:activity.meta}));
            }
            const idx=await q(db,`SELECT name,tbl_name FROM sqlite_master WHERE type='index' AND name IN ('idx_scheduled_posts_status_updated','idx_thread_insights_captured','idx_reply_actions_daily_updated','idx_pickhub_products_active_updated','idx_pickhub_products_image_scope') ORDER BY name`);
            console.log(prefix+'_INDEXES '+JSON.stringify({rows:idx.rows,meta:idx.meta}));
          }
          const orch=dbs.find(d=>d.name==='content-orchestrator');
          if(orch){
            const job=await q(orch,`SELECT id,mode,blog_id,blogger_post_id,status,error,retry_count,recovery_state,next_retry_at,hold_reason,last_error_code,result_json,updated_at,archived_at FROM jobs WHERE id=?`,[105]);
            console.log('JOB105 '+JSON.stringify({rows:job.rows,meta:job.meta}));
            const images=await q(orch,`SELECT id,job_id,role,position,status,provider,public_url,error,provider_task_id,provider_status,updated_at FROM job_images WHERE job_id=? ORDER BY position,id`,[105]);
            console.log('JOB105_IMAGES '+JSON.stringify({rows:images.rows,meta:images.meta}));
            await threadsAudit(orch,'SHARED_ORCH_THREADS');
          }
          const threads=dbs.find(d=>d.name==='threads-automation-db');
          if(threads) await threadsAudit(threads,'DEDICATED_THREADS');
          const scripts=await cf('/workers/scripts');
          console.log('WORKER_SCRIPTS '+JSON.stringify((scripts.result||[]).filter(s=>['content-orchestrator','threads-automation-web'].includes(s.id)).map(s=>({id:s.id,modified_on:s.modified_on,etag:s.etag||null}))));
          NODE
