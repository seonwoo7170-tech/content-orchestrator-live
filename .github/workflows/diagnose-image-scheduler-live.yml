name: diagnose-image-scheduler-live
# second read back job 143 after scheduled recovery window, 2026-09-11 KST

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-image-scheduler-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read back recovered job 143
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const db='content-orchestrator';
          function q(sql){
            const out=execFileSync('npx',['--yes','wrangler@latest','d1','execute',db,'--remote','--command',sql,'--json'],{encoding:'utf8',env:process.env,maxBuffer:10*1024*1024});
            const x=JSON.parse(out); return (Array.isArray(x)?x:[x]).flatMap(g=>Array.isArray(g?.results)?g.results:[]);
          }
          console.log('JOB143',JSON.stringify(q("SELECT id,status,mode,blog_id,blogger_post_id,target_url,error,retry_count,recovery_state,next_retry_at,hold_reason,last_error_code,last_failure_at,created_at,updated_at FROM jobs WHERE id=143")));
          console.log('JOB143_EVENTS',JSON.stringify(q("SELECT id,level,event_type,stage,message,meta_json,created_at FROM job_events WHERE job_id=143 ORDER BY id DESC LIMIT 40")));
          console.log('JOB143_PUBLICATION',JSON.stringify(q("SELECT job_id,status,blogger_post_id,error,created_at,updated_at FROM job_publications WHERE job_id=143")));
          console.log('AI_LOCK',JSON.stringify(q("SELECT lock_key,expires_at,updated_at FROM runtime_locks WHERE lock_key='serial-ai-watchdog'")));
          console.log('ACTIVE_AI',JSON.stringify(q("SELECT id,status,mode,blog_id,blogger_post_id,retry_count,recovery_state,last_error_code,created_at,updated_at FROM jobs WHERE archived_at IS NULL AND status IN ('writing','critic_review','repairing','final_critic') ORDER BY updated_at DESC LIMIT 10")));
          console.log('NOW',JSON.stringify(q("SELECT datetime('now') utc_now,datetime('now','+9 hours') kst_now")));
          NODE
