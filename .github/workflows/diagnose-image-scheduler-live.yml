name: diagnose-image-scheduler-live
# live readback after job133 completion, 2026-09-11 KST

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-image-scheduler-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read production work progression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const db='content-orchestrator';
          function q(sql){
            const out=execFileSync('npx',['--yes','wrangler@latest','d1','execute',db,'--remote','--command',sql,'--json'],{encoding:'utf8',env:process.env,maxBuffer:10*1024*1024});
            const x=JSON.parse(out); return (Array.isArray(x)?x:[x]).flatMap(g=>Array.isArray(g?.results)?g.results:[]);
          }
          console.log('RECENT_JOBS',JSON.stringify(q("SELECT id,status,mode,blog_id,topic,blogger_post_id,target_url,created_at,updated_at FROM jobs WHERE archived_at IS NULL ORDER BY id DESC LIMIT 12")));
          console.log('TODAY_SLOTS',JSON.stringify(q("SELECT id,plan_date,blog_id,kind,status,job_id,recovery_state,retry_count,last_error_code,updated_at FROM daily_plan_slots WHERE plan_date IN (date('now'),date('now','+9 hours')) ORDER BY id DESC LIMIT 40")));
          console.log('JOB133_RESULT',JSON.stringify(q("SELECT id,status,blogger_post_id,target_url,json_extract(result_json,'$.status') AS result_status,json_extract(result_json,'$.publication.status') AS publication_status,json_extract(result_json,'$.publication.url') AS publication_url,json_extract(result_json,'$.publication.postId') AS publication_post_id,json_extract(result_json,'$.imagePipeline.currentCount') AS current_count,updated_at FROM jobs WHERE id=133")));
          console.log('NOW',JSON.stringify(q("SELECT datetime('now') utc_now,datetime('now','+9 hours') kst_now")));
          NODE
