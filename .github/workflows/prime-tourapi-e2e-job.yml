name: Prime TourAPI E2E Job

on:
  push:
    branches:
      - 'claude/github-connection-check-umb3pv'
    paths:
      - '.github/prime-tourapi-e2e-job-trigger'

permissions:
  contents: read

jobs:
  prime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOURAPI_CONTENT_ID: '264107'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source before production action
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run verify
          (cd api-hub-v2 && npm test)

      - name: Prime only the exact queued TourAPI E2E job for existing safe recovery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          DB_ID="$(npx --yes wrangler@latest d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s);const db=rows.find(x=>x.name==='content-orchestrator');if(db?.uuid)process.stdout.write(db.uuid);});")"
          test -n "$DB_ID"
          D1_DATABASE_ID="$DB_ID" node --input-type=module - <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.D1_DATABASE_ID;
          const contentId = process.env.TOURAPI_CONTENT_ID;
          const url = `https://api.cloudflare.com/client/v4/accounts/${accountId}/d1/database/${databaseId}/query`;
          async function query(sql, params = []) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ sql, params }),
              signal: AbortSignal.timeout(120000)
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.success !== true) throw new Error(`D1_QUERY_FAILED:${response.status}`);
            return payload.result?.[0]?.results || [];
          }
          const jobs = await query(
            `SELECT j.id, j.status, j.recovery_state, j.retry_count, j.created_at, j.updated_at,
                    m.blog_name, m.blog_url
               FROM jobs j
               JOIN managed_blogs m ON m.blog_id = j.blog_id
              WHERE j.mode = 'new_article'
                AND json_extract(j.payload_json, '$.tourApiContentId') = ?
                AND (lower(COALESCE(m.blog_name,'')) LIKE '%smileatlas%'
                     OR lower(COALESCE(m.blog_url,'')) LIKE '%smileatlas%')
              ORDER BY j.id DESC LIMIT 2`,
            [String(contentId)]
          );
          if (jobs.length !== 1) throw new Error(`EXACT_E2E_JOB_NOT_UNIQUE:${jobs.length}`);
          const job = jobs[0];
          if (job.status !== 'queued') {
            console.log('E2E_PRIME_NOT_NEEDED ' + JSON.stringify({ id:Number(job.id), status:job.status, recoveryState:job.recovery_state || 'none', retryCount:Number(job.retry_count || 0) }));
            process.exit(0);
          }
          const changed = await query(
            `UPDATE jobs
                SET updated_at = datetime('now', '-21 minutes')
              WHERE id = ? AND status = 'queued'
              RETURNING id, status, recovery_state, retry_count, created_at, updated_at`,
            [Number(job.id)]
          );
          if (changed.length !== 1) throw new Error('E2E_PRIME_UPDATE_NOT_APPLIED');
          console.log('E2E_PRIMED_FOR_EXISTING_RECOVERY ' + JSON.stringify({
            id:Number(changed[0].id), status:changed[0].status,
            recoveryState:changed[0].recovery_state || 'none', retryCount:Number(changed[0].retry_count || 0),
            updatedAt:changed[0].updated_at
          }));
          NODE
