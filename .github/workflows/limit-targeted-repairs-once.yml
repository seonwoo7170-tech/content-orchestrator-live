name: Limit targeted repairs once

on:
  push:
    paths:
      - '.github/workflows/limit-targeted-repairs-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Limit targeted repair loop to two attempts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('worker/lib/pipeline.js')
          s = p.read_text()
          old1 = 'const DEFAULT_MAX_TARGETED_REPAIRS = 3;'
          old2 = "return boundedInteger(env?.TARGETED_REPAIR_MAX_ATTEMPTS, DEFAULT_MAX_TARGETED_REPAIRS, 2, 3);"
          assert old1 in s, 'default targeted repair constant not found'
          assert old2 in s, 'targeted repair bound not found'
          s = s.replace(old1, 'const DEFAULT_MAX_TARGETED_REPAIRS = 2;', 1)
          s = s.replace(old2, "return boundedInteger(env?.TARGETED_REPAIR_MAX_ATTEMPTS, DEFAULT_MAX_TARGETED_REPAIRS, 2, 2);", 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/lib/pipeline.js
          git diff --cached --check
          git commit -m 'perf: cap targeted repair loop at two attempts'
          git push
