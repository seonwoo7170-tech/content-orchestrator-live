name: Deploy API Hub v2 preserving runtime secrets

on:
  push:
    paths:
      - '.github/deploy-api-hub-v2-preserve-secrets-trigger'

permissions:
  contents: read

concurrency:
  group: api-hub-v2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_HUB_V2_BASE_URL: https://api-hub-v2.smileseon.workers.dev
      GOOGLE_OAUTH_SETUP_ENABLED: 'false'
      GOOGLE_OAUTH_SCOPE_UPGRADE_ENABLED: 'false'
      BLOGGER_WRITES_ENABLED: 'true'
      BLOGGER_WRITE_MODE: managed_allowlist
      BLOGGER_WRITE_ALLOWED_BLOG_IDS: 2028653002689012296,3842750331568707733,5540565797560833468,7741529904469657049,6470344354760178454,359287489505251041,286230575079975521
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_DEPLOY_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }

      - name: Install and verify API Hub v2
        working-directory: api-hub-v2
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Confirm critical runtime secret names exist before deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name api-hub-v2 > /tmp/secrets-before.txt
          for name in ORCHESTRATOR_API_KEY GEMINI_API_KEY KIE_API_KEY TAVILY_API_KEY; do
            grep -q "$name" /tmp/secrets-before.txt || { echo "Required Cloudflare runtime secret name missing before deploy: $name"; exit 1; }
          done
          echo 'Critical Cloudflare runtime secret names confirmed before deploy.'

      - name: Confirm production health before deploy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/health?before=${Date.now()}`, {cache:'no-store'});
          const h = await r.json().catch(()=>({}));
          if (!r.ok || h.ok !== true) throw new Error('PREDEPLOY_HEALTH_FAILED');
          for (const [key, expected] of [
            ['geminiConfigured', true],
            ['kieImageConfigured', true],
            ['tavilyConfigured', true],
            ['bloggerConfigured', true],
            ['bloggerWritesEnabled', true],
            ['bloggerWriteMode', 'managed_allowlist']
          ]) {
            if (h[key] !== expected) throw new Error(`PREDEPLOY_HEALTH_INVALID:${key}`);
          }
          console.log('PREDEPLOY_HEALTH_OK providers=gemini,kie,tavily blogger=managed');
          NODE

      - name: Render Wrangler config
        working-directory: api-hub-v2
        run: node scripts/render-wrangler.mjs

      - name: Deploy code while preserving existing Cloudflare secrets
        working-directory: api-hub-v2
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Confirm critical runtime secret names remain after deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name api-hub-v2 > /tmp/secrets-after.txt
          for name in ORCHESTRATOR_API_KEY GEMINI_API_KEY KIE_API_KEY TAVILY_API_KEY; do
            grep -q "$name" /tmp/secrets-after.txt || { echo "Required Cloudflare runtime secret name missing after deploy: $name"; exit 1; }
          done
          echo 'Critical Cloudflare runtime secret names preserved after deploy.'

      - name: Confirm production health after deploy
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let last = null;
          for (let attempt=1; attempt<=20; attempt++) {
            const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/health?after=${Date.now()}_${attempt}`, {cache:'no-store'});
            const h = await r.json().catch(()=>({}));
            last = {ok:r.ok && h.ok===true, h};
            const good = last.ok
              && h.geminiConfigured===true
              && h.kieImageConfigured===true
              && h.tavilyConfigured===true
              && h.bloggerConfigured===true
              && h.bloggerWritesEnabled===true
              && h.bloggerWriteMode==='managed_allowlist';
            if (good) {
              console.log(`POSTDEPLOY_HEALTH_OK attempt=${attempt} providers=gemini,kie,tavily blogger=managed`);
              process.exit(0);
            }
            await sleep(1500);
          }
          throw new Error('POSTDEPLOY_HEALTH_FAILED');
          NODE

      - name: Cleanup rendered config
        if: always()
        shell: bash
        run: rm -f api-hub-v2/wrangler.jsonc /tmp/secrets-before.txt /tmp/secrets-after.txt
