name: Apply external D1 maintenance gate

on:
  push:
    branches:
      - fix/d1-external-maintenance-gate-20260907
    paths:
      - .github/workflows/apply-external-d1-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d1-external-maintenance-gate-20260907
      - name: Gate disabled external maintenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/phase6-entry.js')
          text = path.read_text()
          old = """async function runExternalMaintenance(env, now = new Date()) {\n  const blogs = await loadConnectedBlogs(env);\n  await ensureDefaultExternalSettings(env, blogs);\n  const assets = await syncExternalContentAssets(env, { limit: 120 });\n  const delivery = await runExternalDeliveryTick(env, { maxItems: 1, now });\n  return { ok: true, assets, delivery };\n}"""
          new = """function externalDistributionEnabled(env) {\n  return String(env?.EXTERNAL_DISTRIBUTION_ENABLED || '').trim().toLowerCase() === 'true';\n}\n\nasync function runExternalMaintenance(env, now = new Date()) {\n  if (!externalDistributionEnabled(env)) {\n    return { ok: true, skipped: true, reason: 'EXTERNAL_DISTRIBUTION_DISABLED' };\n  }\n  const blogs = await loadConnectedBlogs(env);\n  await ensureDefaultExternalSettings(env, blogs);\n  const assets = await syncExternalContentAssets(env, { limit: 120 });\n  const delivery = await runExternalDeliveryTick(env, { maxItems: 1, now });\n  return { ok: true, assets, delivery };\n}"""
          if old not in text:
              raise SystemExit('phase6 maintenance shape changed; refusing blind patch')
          path.write_text(text.replace(old, new))

          Path('tests/d1-external-maintenance-budget.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\nconst phase6 = fs.readFileSync(new URL('../worker/phase6-entry.js', import.meta.url), 'utf8');\n\ntest('disabled external distribution skips the five-minute asset sync before any D1 inventory reads', () => {\n  assert.match(phase6, /function externalDistributionEnabled\\(env\\)/);\n  assert.match(phase6, /if \\(!externalDistributionEnabled\\(env\\)\\)[\\s\\S]*EXTERNAL_DISTRIBUTION_DISABLED/);\n  const maintenance = phase6.slice(phase6.indexOf('async function runExternalMaintenance'), phase6.indexOf('export default'));
  assert.ok(maintenance.indexOf('if (!externalDistributionEnabled(env))') < maintenance.indexOf('loadConnectedBlogs(env)'));\n  assert.ok(maintenance.indexOf('if (!externalDistributionEnabled(env))') < maintenance.indexOf('syncExternalContentAssets(env'));\n});\n""")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/phase6-entry.js tests/d1-external-maintenance-budget.test.mjs
          git commit -m "Skip external D1 sync while distribution is disabled"
          git push origin HEAD:fix/d1-external-maintenance-gate-20260907
