name: Patch KIE topic-preserving prompt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-kie-topic-preservation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch safePromptForKie without changing subject intent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('api-hub-v2/src/lib/kie-image.js')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(r"export function safePromptForKie\(value\) \{.*?\n\}\n\nfunction numericCode", re.S)
          replacement = r'''export function safePromptForKie(value) {
  const prompt = String(value || '').replace(/\s+/g, ' ').trim();
  if (!prompt) return prompt;

  // Preserve the article/image planner's subject and action. KIE safety shaping may
  // remove text-bearing details, but it must never replace the requested scene with
  // a generic PC-cleaning, monitor, cable, or other unrelated recovery scene.
  const commonSafety = 'Preserve the exact subject, action, problem context, objects, and scene requested above. Photorealistic real-world image. Use plain unbranded objects and surfaces. If a screen is visible, keep it blank or featureless unless the requested concept absolutely requires a screen; never invent UI. No visible text, letters, numbers, logos, icons, UI, packaging, labels, documents, signs, or watermarks. Do not substitute a different troubleshooting action, component, or generic cleaning scene.';
  return `${prompt}. ${commonSafety}`;
}

function numericCode'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one safePromptForKie function, replaced={count}')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify topic preservation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { safePromptForKie } from './api-hub-v2/src/lib/kie-image.js';
          const samples = [
            'CPU overheating while gaming, technician checking the CPU cooler',
            'Windows laptop blue screen troubleshooting with a technician inspecting the laptop',
            'Monitor flickering caused by a loose HDMI cable, hand checking the cable connection',
            'Desktop PC fan making a rattling noise, hand inspecting the cooling fan'
          ];
          for (const input of samples) {
            const out = safePromptForKie(input);
            const key = input.split(/[,.]/)[0];
            if (!out.includes(key)) throw new Error(`subject lost: ${input}`);
          }
          const fan = safePromptForKie(samples[3]);
          if (/being gently brushed clean|cleaning brush|ventilation grille being cleaned/i.test(fan)) {
            throw new Error('generic cleaning substitution remains');
          }
          console.log('KIE topic-preservation checks passed');
          NODE

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-kie-topic-preservation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api-hub-v2/src/lib/kie-image.js .github/workflows/patch-kie-topic-preservation.yml
          git diff --cached --check
          git commit -m 'fix: preserve article subject in KIE image prompts'
          git push origin HEAD:main
