name: TourAPI SmileAtlas Production E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/github-connection-check-umb3pv'
    paths:
      - '.github/tourapi-smileatlas-e2e-trigger'

permissions:
  contents: read

concurrency:
  group: tourapi-smileatlas-production-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      ORCHESTRATOR_BASE_URL: https://content-orchestrator.smileseon.workers.dev
      TOURAPI_CONTENT_ID: '264107'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify source before production action
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          (cd api-hub-v2 && npm test)

      - name: Run guarded SmileAtlas TourAPI E2E and sweep production queue
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          node --input-type=module - <<'NODE'
          const base = process.env.ORCHESTRATOR_BASE_URL;
          const contentId = process.env.TOURAPI_CONTENT_ID;
          const headers = {
            'content-type': 'application/json',
            'x-admin-api-key': process.env.ADMIN_API_KEY
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(path, init = {}) {
            const response = await fetch(`${base}${path}`, {
              cache: 'no-store',
              signal: AbortSignal.timeout(120000),
              ...init,
              headers: { ...headers, ...(init.headers || {}) }
            });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; }
            catch { data = { error: 'NON_JSON_RESPONSE' }; }
            if (!response.ok) {
              const error = new Error(`${path}:${response.status}:${String(data?.error || 'REQUEST_FAILED').slice(0, 180)}`);
              error.status = response.status;
              error.data = data;
              throw error;
            }
            return data;
          }

          function parseJson(value) {
            if (!value) return null;
            try { return typeof value === 'string' ? JSON.parse(value) : value; }
            catch { return null; }
          }

          function safeJob(row, images = []) {
            const result = parseJson(row?.result_json);
            const payload = parseJson(row?.payload_json);
            return {
              id: Number(row?.id || 0),
              mode: row?.mode || null,
              blogId: row?.blog_id || row?.blogId || null,
              status: row?.status || null,
              tourApiContentId: payload?.tourApiContentId || null,
              bloggerPostId: row?.blogger_post_id || null,
              retryCount: Number(row?.retry_count || 0),
              recoveryState: row?.recovery_state || 'none',
              nextRetryAt: row?.next_retry_at || null,
              holdReason: row?.hold_reason || null,
              lastErrorCode: row?.last_error_code || null,
              error: row?.error ? String(row.error).slice(0, 180) : null,
              resultStatus: result?.status || null,
              finalCritic: result?.finalCritic ? {
                status: result.finalCritic.status || null,
                score: Number(result.finalCritic.score || 0),
                issueCount: Array.isArray(result.finalCritic.issues) ? result.finalCritic.issues.length : null
              } : null,
              imagePipeline: result?.imagePipeline ? {
                status: result.imagePipeline.status || null,
                requested: Number(result.imagePipeline.requested || 0),
                stored: Number(result.imagePipeline.stored || 0),
                failed: Number(result.imagePipeline.failed || 0)
              } : null,
              images: images.map((image) => ({
                id: Number(image.id || 0),
                role: image.role || null,
                position: Number(image.position || 0),
                status: image.status || null,
                provider: image.provider || null,
                error: image.error ? String(image.error).slice(0, 160) : null,
                hasUrl: Boolean(image.public_url),
                updatedAt: image.updated_at || null
              })),
              createdAt: row?.created_at || null,
              updatedAt: row?.updated_at || null
            };
          }

          async function detailWithImages(jobId) {
            let job = null;
            let images = [];
            try { job = (await request(`/api/jobs/${jobId}?e2e=${Date.now()}`))?.job || null; }
            catch (error) { return { readError: String(error.message || error), id: Number(jobId) }; }
            try { images = (await request(`/api/jobs/${jobId}/images?e2e=${Date.now()}`))?.images || []; }
            catch { images = []; }
            return safeJob(job, images);
          }

          async function queueSweep() {
            const out = { jobs: [], imageDiagnostics: null, job144: null };
            try {
              const jobsData = await request(`/api/jobs?limit=100&e2e=${Date.now()}`);
              const rows = Array.isArray(jobsData?.jobs) ? jobsData.jobs : [];
              out.jobs = rows
                .filter((row) => String(row.status || '') !== 'completed')
                .map((row) => safeJob(row));
            } catch (error) {
              out.jobsReadError = String(error.message || error);
            }
            try {
              const d = await request(`/api/operations/images/diagnostics?e2e=${Date.now()}`);
              out.imageDiagnostics = {
                health: d?.health || null,
                pipelineVersion: d?.pipelineVersion || null,
                configuredProviderMode: d?.configuredProviderMode || null,
                totals: d?.totals || {},
                statusCounts: d?.statusCounts || {},
                providerCounts: d?.providerCounts || {},
                missing: (Array.isArray(d?.missing) ? d.missing : []).slice(0, 50).map((row) => ({
                  jobId: Number(row.jobId || 0),
                  mode: row.mode || null,
                  current: Number(row.current || 0),
                  target: Number(row.target || 0),
                  missing: Number(row.missing || 0),
                  providers: row.providers || [],
                  updatedAt: row.updatedAt || null
                })),
                failures: (Array.isArray(d?.failures) ? d.failures : []).slice(0, 50).map((row) => ({
                  jobId: Number(row.jobId || 0),
                  mode: row.mode || null,
                  role: row.role || null,
                  position: Number(row.position || 0),
                  errorCode: row.errorCode || null,
                  updatedAt: row.updatedAt || null
                }))
              };
            } catch (error) {
              out.imageDiagnostics = { readError: String(error.message || error) };
            }
            out.job144 = await detailWithImages(144);
            console.log('QUEUE_SWEEP_SAFE ' + JSON.stringify(out));
            return out;
          }

          let pendingError = null;
          try {
            const blogsData = await request(`/api/blogs?e2e=${Date.now()}`);
            const blogs = Array.isArray(blogsData?.blogs) ? blogsData.blogs : [];
            const candidates = blogs.filter((blog) => {
              const text = `${blog?.name || blog?.blogName || ''} ${blog?.url || ''}`.toLowerCase();
              return text.includes('smileatlas') || text.includes('smile atlas');
            });
            if (candidates.length !== 1) {
              const visible = blogs.map((blog) => ({
                blogId: String(blog?.blogId || blog?.id || ''),
                name: blog?.name || blog?.blogName || null,
                host: (() => { try { return new URL(String(blog?.url || '')).hostname; } catch { return null; } })()
              }));
              throw new Error(`SMILEATLAS_TARGET_NOT_UNIQUE:${candidates.length}:${JSON.stringify(visible)}`);
            }
            const target = candidates[0];
            const blogId = String(target?.blogId || target?.id || '').trim();
            if (!blogId) throw new Error('SMILEATLAS_BLOG_ID_MISSING');
            console.log('E2E_TARGET_SAFE ' + JSON.stringify({
              blogId,
              name: target?.name || target?.blogName || null,
              host: (() => { try { return new URL(String(target?.url || '')).hostname; } catch { return null; } })(),
              contentId
            }));

            // Reuse an existing same-content job if a previous interrupted probe already created one.
            const jobsData = await request(`/api/jobs?limit=100&e2e=${Date.now()}`);
            const rows = Array.isArray(jobsData?.jobs) ? jobsData.jobs : [];
            let chosen = null;
            for (const row of rows.slice(0, 60)) {
              if (String(row?.blog_id || row?.blogId || '') !== blogId || String(row?.mode || '') !== 'new_article') continue;
              let detail = row;
              if (!row?.payload_json) {
                try { detail = (await request(`/api/jobs/${row.id}?e2e=${Date.now()}`))?.job || row; }
                catch { detail = row; }
              }
              const payload = parseJson(detail?.payload_json);
              if (String(payload?.tourApiContentId || '') === contentId) {
                chosen = detail;
                break;
              }
            }

            let jobId = Number(chosen?.id || 0);
            if (!jobId) {
              const created = await request('/api/jobs/new', {
                method: 'POST',
                body: JSON.stringify({ blogId, topic: '', tourApiContentId: contentId })
              });
              jobId = Number(created?.jobId || 0);
              if (!jobId) throw new Error('E2E_JOB_ID_MISSING');
              console.log('E2E_JOB_CREATED ' + JSON.stringify({ jobId, blogId, contentId }));
            } else {
              console.log('E2E_JOB_REUSED ' + JSON.stringify({ jobId, blogId, contentId, status: chosen?.status || null }));
            }

            let lastFingerprint = '';
            let completed = null;
            for (let attempt = 0; attempt < 120; attempt += 1) {
              const snapshot = await detailWithImages(jobId);
              const fingerprint = JSON.stringify({
                status: snapshot?.status,
                recoveryState: snapshot?.recoveryState,
                lastErrorCode: snapshot?.lastErrorCode,
                updatedAt: snapshot?.updatedAt,
                images: (snapshot?.images || []).map((image) => [image.id, image.status, image.provider, image.updatedAt])
              });
              if (fingerprint !== lastFingerprint) {
                console.log('E2E_STATE_SAFE ' + JSON.stringify(snapshot));
                lastFingerprint = fingerprint;
              }
              if (snapshot?.status === 'completed') {
                completed = snapshot;
                break;
              }
              if (snapshot?.recoveryState === 'held') {
                throw new Error(`E2E_JOB_HELD:${jobId}:${snapshot?.lastErrorCode || snapshot?.error || 'UNKNOWN'}`);
              }
              await sleep(15000);
            }
            if (!completed) throw new Error(`E2E_NOT_COMPLETED:${jobId}`);
            if (!completed.bloggerPostId) throw new Error(`E2E_COMPLETED_WITHOUT_BLOGGER_POST_ID:${jobId}`);
            console.log('E2E_COMPLETED_SAFE ' + JSON.stringify(completed));
          } catch (error) {
            pendingError = error;
            console.error('E2E_FAILURE_SAFE ' + String(error?.message || error).slice(0, 500));
          } finally {
            await queueSweep();
          }
          if (pendingError) throw pendingError;
          NODE
