name: ModelScope Smoke Test

on:
  push:
    paths:
      - '.github/workflows/modelscope-smoke-test.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
    steps:
      - name: Call ModelScope Z-Image-Turbo
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo 'MODELSCOPE_TOKEN_MISSING'; exit 2; }
          node --input-type=module - <<'NODE'
          const token = process.env.MODELSCOPE_TOKEN;
          const base = 'https://api-inference.modelscope.ai';
          const model = 'Tongyi-MAI/Z-Image-Turbo';
          const headers = {
            authorization: `Bearer ${token}`,
            'content-type': 'application/json'
          };
          const submit = await fetch(`${base}/v1/images/generations`, {
            method: 'POST',
            headers: { ...headers, 'X-ModelScope-Async-Mode': 'true' },
            body: JSON.stringify({
              model,
              prompt: 'A clean studio photograph of a single blue ceramic mug on a white table, soft daylight, no text, no logo',
              size: '1024x1024'
            })
          });
          const submitText = await submit.text();
          const quota = {
            totalLimit: submit.headers.get('modelscope-ratelimit-requests-limit'),
            totalRemaining: submit.headers.get('modelscope-ratelimit-requests-remaining'),
            modelLimit: submit.headers.get('modelscope-ratelimit-model-requests-limit'),
            modelRemaining: submit.headers.get('modelscope-ratelimit-model-requests-remaining')
          };
          console.log(`MODELSCOPE_SUBMIT_HTTP=${submit.status}`);
          console.log(`MODELSCOPE_QUOTA=${JSON.stringify(quota)}`);
          let submitJson = {};
          try { submitJson = JSON.parse(submitText); } catch {}
          if (!submit.ok) {
            const safe = {
              code: submitJson?.code ?? submitJson?.Code ?? null,
              message: String(submitJson?.message ?? submitJson?.Message ?? submitJson?.error ?? 'request failed').slice(0, 240)
            };
            console.log(`MODELSCOPE_SUBMIT_ERROR=${JSON.stringify(safe)}`);
            process.exit(3);
          }
          const taskId = String(submitJson?.task_id || '').trim();
          if (!taskId) {
            console.log('MODELSCOPE_TASK_ID_MISSING');
            process.exit(4);
          }
          console.log('MODELSCOPE_TASK_ACCEPTED=true');
          let outputUrl = '';
          for (let i = 1; i <= 24; i += 1) {
            await new Promise(r => setTimeout(r, 5000));
            const poll = await fetch(`${base}/v1/tasks/${encodeURIComponent(taskId)}`, {
              headers: { ...headers, 'X-ModelScope-Task-Type': 'image_generation' }
            });
            const pollText = await poll.text();
            let data = {};
            try { data = JSON.parse(pollText); } catch {}
            const state = String(data?.task_status || '').toUpperCase();
            console.log(`MODELSCOPE_POLL_${i}=http:${poll.status},state:${state || 'UNKNOWN'}`);
            if (!poll.ok) process.exit(5);
            if (state === 'FAILED') process.exit(6);
            if (state === 'SUCCEED') {
              outputUrl = String(Array.isArray(data?.output_images) ? data.output_images[0] || '' : '');
              break;
            }
          }
          if (!outputUrl) {
            console.log('MODELSCOPE_RESULT_TIMEOUT');
            process.exit(7);
          }
          const image = await fetch(outputUrl, { redirect: 'follow' });
          const bytes = new Uint8Array(await image.arrayBuffer());
          const isJpeg = bytes.length >= 3 && bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
          const isPng = bytes.length >= 4 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47;
          const isWebp = bytes.length >= 12 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 && bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50;
          console.log(`MODELSCOPE_IMAGE_HTTP=${image.status}`);
          console.log(`MODELSCOPE_IMAGE_CONTENT_TYPE=${image.headers.get('content-type') || ''}`);
          console.log(`MODELSCOPE_IMAGE_BYTES=${bytes.length}`);
          console.log(`MODELSCOPE_IMAGE_MAGIC_OK=${isJpeg || isPng || isWebp}`);
          if (!image.ok || !(isJpeg || isPng || isWebp) || bytes.length < 1000) process.exit(8);
          console.log('MODELSCOPE_SMOKE_TEST=PASS');
          NODE
