name: production-image-provider-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-image-provider-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
      HUB_URL: https://api-hub-v2.smileseon.workers.dev
    steps:
      - name: Probe Cloudflare image provider only
        shell: bash
        run: |
          node - <<'NODE'
          const base=process.env.HUB_URL;
          const key=process.env.HUB_API_KEY;
          if(!key) throw new Error('HUB_API_KEY_MISSING');
          const healthResp=await fetch(`${base}/health`,{cache:'no-store'});
          const health=await healthResp.json().catch(()=>({}));
          console.log('IMAGE_PROVIDER_HEALTH',JSON.stringify({status:healthResp.status,ok:healthResp.ok,imageProvider:health.imageProvider||null,imageModel:health.imageModel||null,imageConfigured:health.imageConfigured===true,kieImageConfigured:health.kieImageConfigured===true,imageQaRequired:health.imageQaRequired===true}));
          const started=Date.now();
          try {
            const response=await fetch(`${base}/api/hub/image/generate`,{
              method:'POST',
              headers:{'content-type':'application/json','x-hub-api-key':key},
              body:JSON.stringify({role:'body',prompt:'A simple clean home maintenance scene with a plain hand tool on a neutral surface. No text or logos.',providerMode:'cloudflare'}),
              cache:'no-store',signal:AbortSignal.timeout(35000)
            });
            const data=await response.json().catch(()=>({}));
            console.log('CLOUDFLARE_IMAGE_PROBE',JSON.stringify({elapsedMs:Date.now()-started,httpStatus:response.status,ok:response.ok,provider:data.provider||null,model:data.model||null,error:data.error||null,hasImage:Boolean(data.imageBase64)}));
          } catch(error) {
            console.log('CLOUDFLARE_IMAGE_PROBE',JSON.stringify({elapsedMs:Date.now()-started,timeout:true,error:String(error?.name||error?.message||'UNKNOWN')}));
          }
          NODE
