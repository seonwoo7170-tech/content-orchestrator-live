name: diagnose-job-images

on:
  push:
    branches: [main]
    paths:
      - '.github/diagnose-job-images-trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      ORCHESTRATOR_URL: https://content-orchestrator.smileseon.workers.dev
    steps:
      - name: Read current production work state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base=process.env.ORCHESTRATOR_URL;
          const headers={'x-admin-api-key':process.env.ADMIN_API_KEY};
          async function get(path){
            const r=await fetch(base+path,{headers,cache:'no-store',signal:AbortSignal.timeout(30000)});
            const d=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`${path}:${r.status}:${d.error||'FAILED'}`);
            return d;
          }
          function safeResult(row){ try { return row?.result_json ? JSON.parse(row.result_json) : null; } catch { return null; } }
          function safeJob(row, images=[]){
            const result=safeResult(row);
            return {
              id:Number(row?.id||0), mode:row?.mode||null, blogId:row?.blog_id||null, status:row?.status||null,
              dailySlotId:row?.daily_slot_id||null, bloggerPostId:row?.blogger_post_id||null, topic:row?.topic||null,
              retryCount:Number(row?.retry_count||0), recoveryState:row?.recovery_state||'none', nextRetryAt:row?.next_retry_at||null,
              holdReason:row?.hold_reason||null, lastErrorCode:row?.last_error_code||null, error:row?.error||null,
              resultStatus:result?.status||null, finalCritic:result?.finalCritic ? {status:result.finalCritic.status,score:Number(result.finalCritic.score||0),issues:Array.isArray(result.finalCritic.issues)?result.finalCritic.issues.length:null}:null,
              imagePipeline:result?.imagePipeline||null,
              images:images.map(i=>({id:i.id,role:i.role,position:i.position,status:i.status,provider:i.provider||null,error:i.error||null,hasUrl:Boolean(i.public_url),updatedAt:i.updated_at||null})),
              createdAt:row?.created_at||null, updatedAt:row?.updated_at||null
            };
          }
          const [jobsData,today,recovery,imageDiag,automation]=await Promise.all([
            get('/api/jobs?limit=60'),
            get('/api/operations/today').catch(e=>({readError:String(e.message||e)})),
            get('/api/operations/recovery').catch(e=>({readError:String(e.message||e)})),
            get('/api/operations/images/diagnostics').catch(e=>({readError:String(e.message||e)})),
            get('/api/automation/settings').catch(e=>({readError:String(e.message||e)}))
          ]);
          const jobs=Array.isArray(jobsData.jobs)?jobsData.jobs:[];
          const active=jobs.filter(j=>['queued','running','ready','failed','needs_review'].includes(String(j.status)));
          console.log('CURRENT_COUNTS '+JSON.stringify(Object.fromEntries([...new Set(jobs.map(j=>String(j.status)))].map(s=>[s,jobs.filter(j=>String(j.status)===s).length]))));
          console.log('TODAY_SAFE '+JSON.stringify({planDate:today.planDate||null,count:today.count||0,slots:(today.slots||[]).map(s=>({id:s.id,blogId:s.blog_id||s.blogId,slotNo:s.slot_no||s.slotNo,kind:s.kind,status:s.status,jobId:s.job_id||s.jobId,recoveryState:s.recovery_state||null,nextRetryAt:s.next_retry_at||null,lastErrorCode:s.last_error_code||null})),readError:today.readError||null}));
          console.log('RECOVERY_SAFE '+JSON.stringify({summary:recovery.summary||null,dueRetries:recovery.dueRetries||[],heldItems:recovery.heldItems||[],readError:recovery.readError||null}));
          console.log('IMAGE_DIAGNOSTICS_SAFE '+JSON.stringify(imageDiag));
          const blogs=(automation.blogs||[]).map(b=>({blogId:b.blogId,enabled:b.effective?.enabled,approvalMode:b.effective?.approvalMode,autoPublishEnabled:b.effective?.autoPublishEnabled,imagesEnabled:b.effective?.imagesEnabled,bodyImageCount:b.effective?.bodyImageCount,maxPublishesPerDay:b.effective?.maxPublishesPerDay}));
          console.log('AUTOMATION_SAFE '+JSON.stringify({global:automation.global?{enabled:automation.global.enabled,approvalMode:automation.global.approvalMode,autoPublishEnabled:automation.global.autoPublishEnabled}:null,blogs,readError:automation.readError||null}));
          for(const row of active){
            let detail=row, images=[];
            try { const d=await get(`/api/jobs/${row.id}`); detail=d.job||row; } catch {}
            try { const d=await get(`/api/jobs/${row.id}/images`); images=Array.isArray(d.images)?d.images:[]; } catch {}
            console.log('ACTIVE_JOB '+JSON.stringify(safeJob(detail,images)));
          }
          // Keep a few most recent completed jobs visible to verify delivery evidence.
          for(const row of jobs.filter(j=>String(j.status)==='completed').slice(0,8)){
            let detail=row, images=[];
            try { const d=await get(`/api/jobs/${row.id}`); detail=d.job||row; } catch {}
            try { const d=await get(`/api/jobs/${row.id}/images`); images=Array.isArray(d.images)?d.images:[]; } catch {}
            console.log('RECENT_COMPLETED '+JSON.stringify(safeJob(detail,images)));
          }
          NODE
