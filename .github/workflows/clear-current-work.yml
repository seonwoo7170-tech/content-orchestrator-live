name: clear-current-work

on:
  push:
    branches: [main]
    paths:
      - '.github/clear-current-work-trigger'

permissions:
  contents: read

concurrency:
  group: content-orchestrator-production
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Snapshot active work counts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --command "SELECT COUNT(*) AS active_jobs FROM jobs WHERE archived_at IS NULL AND status <> 'completed'; SELECT COUNT(*) AS pending_slots FROM daily_plan_slots WHERE status = 'pending'; SELECT COUNT(*) AS retry_wait FROM jobs WHERE recovery_state = 'retry_wait'; SELECT COUNT(*) AS held_jobs FROM jobs WHERE recovery_state = 'held';"
      - name: Stop and clear current work
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/clear-current-work.sql <<'SQL'
          PRAGMA foreign_keys = ON;
          UPDATE daily_plan_slots
             SET status = 'skipped',
                 job_id = NULL,
                 retry_count = 0,
                 recovery_state = 'none',
                 next_retry_at = NULL,
                 hold_reason = NULL,
                 last_error_code = NULL,
                 last_failure_at = NULL,
                 updated_at = datetime('now')
           WHERE status = 'pending';
          DELETE FROM job_publications
           WHERE job_id IN (
             SELECT id FROM jobs
              WHERE archived_at IS NULL
                AND status <> 'completed'
           );
          DELETE FROM job_images
           WHERE job_id IN (
             SELECT id FROM jobs
              WHERE archived_at IS NULL
                AND status <> 'completed'
           );
          DELETE FROM jobs
           WHERE archived_at IS NULL
             AND status <> 'completed';
          SQL
          npx --yes wrangler@latest d1 execute content-orchestrator --remote --file=/tmp/clear-current-work.sql
      - name: Verify queue is empty
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(npx --yes wrangler@latest d1 execute content-orchestrator --remote --json --command "SELECT (SELECT COUNT(*) FROM jobs WHERE archived_at IS NULL AND status <> 'completed') AS active_jobs, (SELECT COUNT(*) FROM daily_plan_slots WHERE status = 'pending') AS pending_slots, (SELECT COUNT(*) FROM jobs WHERE recovery_state = 'retry_wait') AS retry_wait, (SELECT COUNT(*) FROM jobs WHERE recovery_state = 'held') AS held_jobs;")"
          printf '%s' "$OUT" > /tmp/verify.json
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/verify.json','utf8'));
          const rows = data?.[0]?.results || data?.[0]?.result || [];
          const row = Array.isArray(rows) ? rows[0] : rows;
          if (!row) throw new Error('CLEAR_VERIFY_NO_RESULT');
          const values = ['active_jobs','pending_slots','retry_wait','held_jobs'].map(k => Number(row[k] || 0));
          console.log(`CLEAR_CURRENT_WORK_VERIFY active_jobs=${values[0]} pending_slots=${values[1]} retry_wait=${values[2]} held_jobs=${values[3]}`);
          if (values.some(v => v !== 0)) throw new Error('CLEAR_CURRENT_WORK_VERIFY_FAILED');
          NODE
