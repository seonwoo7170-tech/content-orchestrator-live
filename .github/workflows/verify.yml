name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Content Orchestrator dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Content Orchestrator
        run: npm run verify
      - name: Verify API Hub v2
        run: npm run verify
        working-directory: api-hub-v2
