name: check-puter-runtime-secret

on:
  push:
    branches: [main]
    paths:
      - '.github/check-puter-runtime-secret-trigger'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Confirm Puter secret name exists on content-orchestrator
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest secret list --name content-orchestrator > /tmp/secrets.json
          if grep -q 'PUTER_AUTH_TOKEN' /tmp/secrets.json; then
            echo 'PUTER_RUNTIME_SECRET_PRESENT=true'
          else
            echo 'PUTER_RUNTIME_SECRET_PRESENT=false'
            exit 2
          fi
