name: Production Job Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/production-job-diagnostics-trigger'
      - '.github/workflows/production-job-diagnostics.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-job-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
      ORCHESTRATOR_BASE_URL: https://content-orchestrator.smileseon.workers.dev
      API_HUB_BASE_URL: https://api-hub-v2.smileseon.workers.dev
    steps:
      - name: Inspect production state safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          test -n "$HUB_API_KEY"
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';

          const base = process.env.ORCHESTRATOR_BASE_URL;
          const hub = process.env.API_HUB_BASE_URL;
          const adminHeaders = { 'x-admin-api-key': process.env.ADMIN_API_KEY };
          const hubHeaders = { 'content-type': 'application/json', 'x-hub-api-key': process.env.HUB_API_KEY };

          async function jsonFetch(url, init = {}) {
            const response = await fetch(url, { cache: 'no-store', ...init });
            const text = await response.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text.slice(0, 300) }; }
            return { status: response.status, ok: response.ok, data };
          }

          const [health, recovery, jobs, today, imageDiag, hubHealth] = await Promise.all([
            jsonFetch(`${base}/health?diag=${Date.now()}`),
            jsonFetch(`${base}/api/operations/recovery?diag=${Date.now()}`, { headers: adminHeaders }),
            jsonFetch(`${base}/api/jobs?limit=50&diag=${Date.now()}`, { headers: adminHeaders }),
            jsonFetch(`${base}/api/operations/today?diag=${Date.now()}`, { headers: adminHeaders }),
            jsonFetch(`${base}/api/operations/images/diagnostics?diag=${Date.now()}`, { headers: adminHeaders }),
            jsonFetch(`${hub}/health?diag=${Date.now()}`)
          ]);

          if (!health.ok || !recovery.ok || !jobs.ok || !today.ok || !imageDiag.ok || !hubHealth.ok) {
            throw new Error(`DIAGNOSTIC_READ_FAILED orchestrator=${health.status}/${recovery.status}/${jobs.status}/${today.status}/${imageDiag.status} hub=${hubHealth.status}`);
          }

          const safeJobs = (Array.isArray(jobs.data?.jobs) ? jobs.data.jobs : []).map((row) => ({
            id: Number(row.id),
            mode: row.mode,
            status: row.status,
            blogId: row.blog_id,
            bloggerPostId: row.blogger_post_id || null,
            targetUrl: row.target_url || null,
            hasResult: Boolean(Number(row.has_result || 0)),
            retryCount: Number(row.retry_count || 0),
            recoveryState: row.recovery_state || 'none',
            nextRetryAt: row.next_retry_at || null,
            holdReason: row.hold_reason || null,
            lastErrorCode: row.last_error_code || null,
            error: row.error ? String(row.error).slice(0, 180) : null,
            lastFailureAt: row.last_failure_at || null,
            updatedAt: row.updated_at || null
          }));
          const active = safeJobs.filter((row) => !['completed'].includes(String(row.status)));
          const healthSummary = {
            bloggerWritesEnabled: health.data?.bloggerWritesEnabled,
            apiHubConfigured: health.data?.apiHubConfigured,
            autoPublish: health.data?.phase2Automation?.autoPublishExecutionEnabled,
            hubService: hubHealth.data?.service,
            criticProvider: hubHealth.data?.criticProvider,
            criticConfigured: hubHealth.data?.criticConfigured,
            repairProviderOrder: hubHealth.data?.repairProviderOrder
          };
          const recoverySummary = recovery.data?.summary || {};
          const imageSummary = {
            health: imageDiag.data?.health || null,
            pipelineVersion: imageDiag.data?.pipelineVersion || null,
            configuredProviderMode: imageDiag.data?.configuredProviderMode || null,
            kieFallbackRequested: Boolean(imageDiag.data?.kieFallbackRequested),
            totals: imageDiag.data?.totals || {},
            statusCounts: imageDiag.data?.statusCounts || {},
            providerCounts: imageDiag.data?.providerCounts || {},
            missing: (Array.isArray(imageDiag.data?.missing) ? imageDiag.data.missing : []).slice(0, 30).map((row) => ({
              jobId: Number(row.jobId), mode: row.mode, current: Number(row.current || 0), target: Number(row.target || 0), missing: Number(row.missing || 0), providers: row.providers || [], updatedAt: row.updatedAt || null
            })),
            failures: (Array.isArray(imageDiag.data?.failures) ? imageDiag.data.failures : []).slice(0, 30).map((row) => ({
              jobId: Number(row.jobId), mode: row.mode, role: row.role, position: Number(row.position || 0), errorCode: row.errorCode || null, updatedAt: row.updatedAt || null
            }))
          };
          const slots = Array.isArray(today.data?.slots) ? today.data.slots : [];
          const slotSummary = slots.reduce((acc, slot) => {
            const key = `${slot.status || 'unknown'}:${slot.recovery_state || 'none'}`;
            acc[key] = (acc[key] || 0) + 1;
            return acc;
          }, {});

          const routeProbes = {};
          const missingRoutes = [];
          for (const path of ['/api/hub/ai/critic', '/api/hub/ai/repair', '/api/blogger/post/get']) {
            const probe = await jsonFetch(`${hub}${path}`, { method: 'POST', headers: hubHeaders, body: '{}' });
            routeProbes[path] = { status: probe.status, error: probe.data?.error || null };
            if ([404, 405].includes(probe.status) && ['NOT_FOUND', 'METHOD_NOT_ALLOWED'].includes(String(probe.data?.error || ''))) {
              missingRoutes.push({ path, status: probe.status });
            }
          }

          const bloggerIdentityProbes = [];
          for (const job of active.filter((row) => row.mode === 'repair_existing' && row.lastErrorCode === 'API_HUB_404' && row.blogId && row.targetUrl)) {
            const byId = job.bloggerPostId
              ? await jsonFetch(`${hub}/api/blogger/post/get`, {
                  method: 'POST', headers: hubHeaders,
                  body: JSON.stringify({ blogId: job.blogId, bloggerPostId: job.bloggerPostId })
                })
              : null;
            const byUrl = await jsonFetch(`${hub}/api/blogger/post/get`, {
              method: 'POST', headers: hubHeaders,
              body: JSON.stringify({ blogId: job.blogId, targetUrl: job.targetUrl })
            });
            const summarize = (probe) => probe ? ({
              status: probe.status,
              error: probe.data?.error || null,
              resolvedPostId: probe.data?.bloggerPostId || probe.data?.identity?.bloggerPostId || null,
              permalink: probe.data?.permalink || probe.data?.identity?.permalink || null
            }) : null;
            bloggerIdentityProbes.push({ jobId: job.id, requestedPostId: job.bloggerPostId, targetUrl: job.targetUrl, byId: summarize(byId), byUrl: summarize(byUrl) });
          }

          const heldResultProbes = [];
          for (const job of active.filter((row) => row.recoveryState === 'held' || (row.retryCount >= 3 && ['needs_review','critic_review','repairing','final_critic'].includes(String(row.status))))) {
            const detail = await jsonFetch(`${base}/api/jobs/${job.id}?diag=${Date.now()}`, { headers: adminHeaders });
            let result = null;
            try { result = detail.data?.job?.result_json ? JSON.parse(detail.data.job.result_json) : null; } catch { result = null; }
            heldResultProbes.push({
              jobId: job.id,
              detailStatus: detail.status,
              status: detail.data?.job?.status || job.status,
              recoveryState: detail.data?.job?.recovery_state || job.recoveryState,
              retryCount: Number(detail.data?.job?.retry_count ?? job.retryCount),
              lastErrorCode: detail.data?.job?.last_error_code || job.lastErrorCode,
              hasResult: Boolean(result),
              resultStatus: result?.status || null,
              hasArticle: Boolean(result?.article),
              continuationAttempt: Number(result?.continuationAttempt || 0),
              totalRepairAttempts: Number(result?.totalRepairAttempts || result?.repairAttempts || 0),
              finalCriticStatus: result?.finalCritic?.status || null,
              finalCriticScore: Number.isFinite(Number(result?.finalCritic?.score)) ? Number(result.finalCritic.score) : null,
              finalIssueCount: Array.isArray(result?.finalCritic?.issues) ? result.finalCritic.issues.length : null
            });
          }

          console.log('PRODUCTION_HEALTH', JSON.stringify(healthSummary));
          console.log('PRODUCTION_RECOVERY', JSON.stringify(recoverySummary));
          console.log('PRODUCTION_IMAGE_PIPELINE', JSON.stringify(imageSummary));
          console.log('PRODUCTION_ACTIVE_JOBS', JSON.stringify(active));
          console.log('PRODUCTION_SLOT_SUMMARY', JSON.stringify(slotSummary));
          console.log('API_HUB_ROUTE_PROBES', JSON.stringify(routeProbes));
          console.log('BLOGGER_IDENTITY_PROBES', JSON.stringify(bloggerIdentityProbes));
          console.log('HELD_RESULT_PROBES', JSON.stringify(heldResultProbes));

          const report = [
            `## Production diagnostics ${new Date().toISOString()}`,
            '',
            '### Health', '```json', JSON.stringify(healthSummary, null, 2), '```',
            '',
            '### Recovery', '```json', JSON.stringify(recoverySummary, null, 2), '```',
            '',
            '### Image pipeline', '```json', JSON.stringify(imageSummary, null, 2), '```',
            '',
            '### Active jobs', '```json', JSON.stringify(active, null, 2), '```',
            '',
            '### Daily slot summary', '```json', JSON.stringify(slotSummary, null, 2), '```',
            '',
            '### API Hub route probes', '```json', JSON.stringify(routeProbes, null, 2), '```',
            '',
            '### Blogger identity probes for API_HUB_404 jobs', '```json', JSON.stringify(bloggerIdentityProbes, null, 2), '```',
            '',
            '### Held/legacy result probes', '```json', JSON.stringify(heldResultProbes, null, 2), '```',
            ''
          ].join('\n');
          writeFileSync('/tmp/production-diag.md', report);
          if (missingRoutes.length) throw new Error(`API_HUB_ROUTE_MISSING:${JSON.stringify(missingRoutes)}`);
          NODE
      - name: Publish sanitized diagnostic report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -s /tmp/production-diag.md ]; then
            gh issue comment 80 --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-diag.md
          fi
