name: Phase 3-1 Daily Diagnostics

on:
  push:
    paths:
      - '.github/phase3-1-daily-diagnostics-trigger'

permissions:
  contents: write

concurrency:
  group: phase3-1-daily-diagnostics
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Phase 3-1 diagnostics patch
        run: node scripts/phase3-1-daily-diagnostics-v2.mjs

      - name: Verify source
        run: npm run verify

      - name: Verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git diff --check
          git status --short
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const allowed = new Set([
            'tests/build-stage.test.mjs',
            'tests/daily-diagnostics.test.mjs',
            'web/build-stage.js',
            'web/operations.js',
            'worker/index.js',
            'worker/lib/daily-diagnostics.js',
            'worker/lib/daily-operations.js',
            'worker/migrations/0007_phase3_daily_diagnostics.sql'
          ]);
          const raw = execFileSync('git', ['status', '--porcelain'], { encoding: 'utf8' });
          const status = raw.replace(/\s+$/, '').split(/\r?\n/).filter(Boolean);
          const changed = status.map((line) => line.slice(3).trim()).map((path) => path.includes(' -> ') ? path.split(' -> ').at(-1) : path);
          for (const path of changed) if (!allowed.has(path)) throw new Error(`UNEXPECTED_CHANGED_FILE:${path}`);
          for (const path of allowed) if (!changed.includes(path)) throw new Error(`EXPECTED_CHANGED_FILE_MISSING:${path}`);
          NODE

      - name: Commit verified Phase 3-1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/build-stage.test.mjs \
            tests/daily-diagnostics.test.mjs \
            web/build-stage.js \
            web/operations.js \
            worker/index.js \
            worker/lib/daily-diagnostics.js \
            worker/lib/daily-operations.js \
            worker/migrations/0007_phase3_daily_diagnostics.sql
          git commit -m 'feat: complete Phase 3-1 daily blog diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
