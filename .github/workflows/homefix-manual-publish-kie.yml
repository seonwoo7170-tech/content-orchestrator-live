name: Homefix Manual Publish KIE

on:
  push:
    branches: [feature/phase2-ops-images]
    paths:
      - '.github/homefix-manual-publish-kie-trigger'

permissions:
  contents: read

concurrency:
  group: api-hub-v2-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_HUB_V2_KEY: ${{ secrets.API_HUB_V2_ORCHESTRATOR_API_KEY }}
      EXISTING_ORCHESTRATOR_KEY: ${{ secrets.HUB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.API_HUB_V2_GEMINI_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.API_HUB_V2_GOOGLE_REFRESH_TOKEN }}
      API_HUB_V2_BASE_URL: https://api-hub-v2.smileseon.workers.dev
      ORCHESTRATOR_BASE_URL: https://content-orchestrator.smileseon.workers.dev
      EXPECTED_BLOG_ID: '5540565797560833468'
      EXPECTED_BLOG_NAME: Smile HomeFix
      EXPECTED_BLOG_HOST: www.smileinfo.net
      ARTICLE_TOPIC: 벽걸이 에어컨에서 물이 떨어질 때 집에서 먼저 확인할 원인과 안전한 조치 순서
      BUCKET_NAME: content-orchestrator-images

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source before production action
        run: |
          npm run verify
          (cd api-hub-v2 && npm run verify)

      - name: Resolve keys without printing secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$API_HUB_V2_KEY" ]; then HUB_API_KEY="$API_HUB_V2_KEY"; else HUB_API_KEY="$EXISTING_ORCHESTRATOR_KEY"; fi
          test -n "$HUB_API_KEY" || { echo 'Hub key missing'; exit 1; }
          echo "HUB_API_KEY=$HUB_API_KEY" >> "$GITHUB_ENV"
          for name in DEPLOY_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            test -n "${!name}" || { echo "$name missing"; exit 1; }
          done

      - name: Confirm safe state and exact Homefix target
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const [hubResp, orchResp] = await Promise.all([
            fetch(`${process.env.API_HUB_V2_BASE_URL}/health`, { cache: 'no-store' }),
            fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health`, { cache: 'no-store' })
          ]);
          const [hub, orch] = await Promise.all([hubResp.json().catch(()=>({})), orchResp.json().catch(()=>({}))]);
          if (!hubResp.ok || hub.ok !== true || hub.bloggerWritesEnabled !== false || hub.bloggerWriteMode !== 'disabled') throw new Error('API_HUB_SAFE_STATE_REQUIRED');
          if (!orchResp.ok || orch.ok !== true || orch.bloggerWritesEnabled !== false || orch.phase2Automation?.autoPublishExecutionEnabled !== false) throw new Error('ORCHESTRATOR_SAFE_STATE_REQUIRED');
          const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/blogger/blogs`, {
            method:'POST', headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY}, body:JSON.stringify({action:'list'})
          });
          const data = await r.json().catch(()=>({}));
          if (!r.ok || !Array.isArray(data.blogs)) throw new Error('BLOG_LIST_FAILED');
          const target = data.blogs.find(b => String(b.id || b.blogId || '') === process.env.EXPECTED_BLOG_ID);
          if (!target) throw new Error('HOMEFIX_NOT_CONNECTED');
          const name = String(target.name || target.blogName || '');
          const host = new URL(String(target.url || '')).hostname.toLowerCase();
          if (name !== process.env.EXPECTED_BLOG_NAME || host !== process.env.EXPECTED_BLOG_HOST) throw new Error('HOMEFIX_IDENTITY_MISMATCH');
          console.log(`TARGET_OK name=${name}; host=${host}; connected=${data.blogs.length}`);
          NODE

      - name: Build one publication-ready article with standard pipeline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { runNewArticlePipeline } from './worker/lib/pipeline.js';
          import { validateArticle } from './worker/lib/contracts.js';
          import { lintNaturalWriting } from './worker/lib/natural-writing-linter.js';
          const env = { API_HUB_BASE_URL: process.env.API_HUB_V2_BASE_URL, HUB_API_KEY: process.env.HUB_API_KEY };
          let chosen = null;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const stages = [];
            const result = await runNewArticlePipeline(env, {
              blogId: process.env.EXPECTED_BLOG_ID,
              topic: process.env.ARTICLE_TOPIC,
              language: 'ko'
            }, fetch, { onStage: async stage => { stages.push(stage); console.log(`candidate=${attempt}; stage=${stage}`); } });
            if (result.status !== 'READY') {
              console.log(`CANDIDATE_${attempt}_REJECT status=${result.status}; reason=${result.reviewReason || 'quality_gate'}`);
              continue;
            }
            if (result.finalCritic?.status !== 'PASS' || Number(result.finalCritic?.score || 0) < 95 || (result.finalCritic?.issues || []).length !== 0) continue;
            const article = validateArticle(result.article);
            const lint = lintNaturalWriting(article);
            if (lint.status === 'BLOCK') continue;
            chosen = { article, initialCritic: result.initialCritic, finalCritic: result.finalCritic, stages, attempt, lintStatus: lint.status };
            break;
          }
          if (!chosen) throw new Error('NO_READY_CANDIDATE_AFTER_3');
          fs.writeFileSync('.homefix-ready.json', JSON.stringify({ ...chosen, images: [] }));
          fs.chmodSync('.homefix-ready.json', 0o600);
          console.log(`READY_ARTICLE title=${chosen.article.title}; finalCritic=${chosen.finalCritic.score}; candidate=${chosen.attempt}`);
          NODE

      - name: Try KIE images only, skip images gracefully if unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KIE_API_KEY:-}" ] || [ -z "${R2_API_TOKEN:-}" ]; then
            echo 'KIE or R2 unavailable; publishing without generated images.'
            exit 0
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateArticle } from './worker/lib/contracts.js';
          import { buildImagePlan, attachStoredImages } from './worker/lib/image-plan.js';
          const ready = JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          const plan = buildImagePlan(ready.article, { bodyCount: 2 });
          const rows = [];
          try {
            for (let i = 0; i < plan.images.length; i += 1) {
              const image = plan.images[i];
              const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/hub/image/generate`, {
                method:'POST',
                headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY},
                body:JSON.stringify({ role:image.role, providerMode:'kie', prompt:image.prompt, aspectRatio:image.role === 'thumbnail' ? '16:9' : '4:3' })
              });
              const g = await r.json().catch(()=>({}));
              if (!r.ok || g.ok !== true) throw new Error(`KIE_IMAGE_${i}_FAILED:${g.error || r.status}`);
              const mime = String(g.mimeType || '').split(';')[0].trim().toLowerCase();
              const ext = mime === 'image/png' ? 'png' : mime === 'image/webp' ? 'webp' : mime === 'image/jpeg' ? 'jpg' : '';
              if (!ext) throw new Error(`IMAGE_MIME_INVALID:${mime}`);
              const bytes = Buffer.from(String(g.imageBase64 || ''), 'base64');
              if (bytes.length < 1000) throw new Error('IMAGE_BYTES_TOO_SMALL');
              const localFile = `/tmp/homefix-${i}.${ext}`;
              const storageKey = `jobs/homefix-manual-${process.env.GITHUB_RUN_ID}/${image.role}-${image.position}.${ext}`;
              fs.writeFileSync(localFile, bytes);
              rows.push({ id: 930000 + i, role:image.role, position:image.position, status:'stored', public_url:`${process.env.ORCHESTRATOR_BASE_URL}/media/${storageKey}`, alt_text:image.altText, storage_key:storageKey, mimeType:mime, localFile });
            }
            ready.article = validateArticle(attachStoredImages(ready.article, rows));
            ready.images = rows;
            fs.writeFileSync('.homefix-ready.json', JSON.stringify(ready));
            console.log(`KIE_IMAGES_READY count=${rows.length}`);
          } catch (error) {
            console.log(`KIE_IMAGES_SKIPPED reason=${String(error.message || 'unknown')}`);
            for (const row of rows) { try { fs.unlinkSync(row.localFile); } catch {} }
            ready.images = [];
            fs.writeFileSync('.homefix-ready.json', JSON.stringify(ready));
          }
          NODE

      - name: Upload KIE images to R2 if generated
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('.homefix-ready.json'));process.stdout.write(String((x.images||[]).length))")"
          if [ "$COUNT" = "0" ]; then echo 'No images to upload.'; exit 0; fi
          node --input-type=module - <<'NODE' > /tmp/homefix-r2.tsv
          import fs from 'node:fs';
          const ready=JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for (const image of ready.images) console.log([image.localFile,image.storage_key,image.mimeType].join('\t'));
          NODE
          while IFS=$'\t' read -r file key mime; do
            CLOUDFLARE_API_TOKEN="$R2_API_TOKEN" npx --yes wrangler@latest r2 object put "$BUCKET_NAME/$key" --file "$file" --content-type "$mime" --remote
          done < /tmp/homefix-r2.tsv
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ready=JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for (const image of ready.images) {
            const r=await fetch(image.public_url,{cache:'no-store'});
            if (!r.ok) throw new Error(`MEDIA_HTTP_${r.status}`);
            const remote=Buffer.from(await r.arrayBuffer());
            const local=fs.readFileSync(image.localFile);
            if (!remote.equals(local)) throw new Error(`MEDIA_BYTES_MISMATCH:${image.storage_key}`);
          }
          console.log(`R2_IMAGES_VERIFIED count=${ready.images.length}`);
          NODE

      - name: Prepare exact-target single-publish config
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_OAUTH_SETUP_ENABLED=false node api-hub-v2/scripts/render-wrangler.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const normal=JSON.parse(fs.readFileSync('api-hub-v2/wrangler.jsonc','utf8'));
          if (normal.vars?.BLOGGER_WRITES_ENABLED !== 'false' || normal.vars?.BLOGGER_WRITE_MODE !== 'disabled') throw new Error('NORMAL_GATE_NOT_DISABLED');
          fs.writeFileSync('api-hub-v2/wrangler.normal.jsonc',JSON.stringify(normal,null,2));
          const single=structuredClone(normal);
          single.vars.BLOGGER_WRITES_ENABLED='true';
          single.vars.BLOGGER_WRITE_MODE='phase2_single_publish';
          single.vars.PHASE2_SINGLE_PUBLISH_BLOG_ID=process.env.EXPECTED_BLOG_ID;
          fs.writeFileSync('api-hub-v2/wrangler.single.jsonc',JSON.stringify(single,null,2));
          const secrets={ORCHESTRATOR_API_KEY:process.env.HUB_API_KEY,GEMINI_API_KEY:process.env.GEMINI_API_KEY,GOOGLE_CLIENT_ID:process.env.GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET:process.env.GOOGLE_CLIENT_SECRET,GOOGLE_REFRESH_TOKEN:process.env.GOOGLE_REFRESH_TOKEN};
          if (process.env.KIE_API_KEY) secrets.KIE_API_KEY=process.env.KIE_API_KEY;
          fs.writeFileSync('api-hub-v2/.single-secrets.json',JSON.stringify(secrets));
          fs.chmodSync('api-hub-v2/.single-secrets.json',0o600);
          NODE

      - name: Temporarily enable exact Homefix write gate
        working-directory: api-hub-v2
        shell: bash
        run: CLOUDFLARE_API_TOKEN="$DEPLOY_API_TOKEN" npx --yes wrangler@latest deploy --config wrangler.single.jsonc --secrets-file .single-secrets.json

      - name: Confirm exact write gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          for(let i=0;i<20;i++){
            const r=await fetch(`${process.env.API_HUB_V2_BASE_URL}/health`,{cache:'no-store'});
            const h=await r.json().catch(()=>({}));
            if(r.ok&&h.bloggerWritesEnabled===true&&h.bloggerWriteMode==='phase2_single_publish'){console.log('SINGLE_PUBLISH_GATE_ACTIVE');process.exit(0)}
            await sleep(1500);
          }
          throw new Error('SINGLE_PUBLISH_GATE_NOT_READY');
          NODE

      - name: Publish exactly one Homefix article and read it back
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ready=JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          async function call(path,body){
            const r=await fetch(`${process.env.API_HUB_V2_BASE_URL}${path}`,{method:'POST',headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY},body:JSON.stringify(body)});
            const data=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(`${path}:${r.status}:${data.error||'REQUEST_FAILED'}`);
            return data;
          }
          const published=await call('/api/blogger/post',{phase2SinglePublish:true,operation:'create',publishMode:'published',blogId:process.env.EXPECTED_BLOG_ID,article:ready.article});
          const postId=String(published.bloggerPostId||'').trim();
          if(!postId) throw new Error('BLOGGER_POST_ID_MISSING');
          const marker={blogId:process.env.EXPECTED_BLOG_ID,bloggerPostId:postId,title:ready.article.title,url:published.url||null,imageCount:(ready.images||[]).length,finalCriticScore:ready.finalCritic.score};
          fs.writeFileSync('.homefix-published.json',JSON.stringify(marker));
          const verify=await call('/api/blogger/post/get',{blogId:process.env.EXPECTED_BLOG_ID,bloggerPostId:postId,language:'ko'});
          if(String(verify.identity?.bloggerPostId||'')!==postId) throw new Error('POST_ID_READBACK_MISMATCH');
          if(String(verify.identity?.status||'').toUpperCase()!=='LIVE') throw new Error(`POST_NOT_LIVE:${verify.identity?.status||'unknown'}`);
          if(String(verify.article?.title||'')!==ready.article.title) throw new Error('TITLE_READBACK_MISMATCH');
          marker.url=published.url||verify.identity?.permalink||null;
          marker.status='LIVE';
          fs.writeFileSync('.homefix-published.json',JSON.stringify(marker));
          console.log(`HOMEFIX_SINGLE_PUBLISH_OK title=${marker.title}; status=LIVE; images=${marker.imageCount}; finalCritic=${marker.finalCriticScore}`);
          console.log(`HOMEFIX_PUBLIC_URL=${marker.url||'available-in-Blogger'}`);
          NODE

      - name: Restore Blogger writes disabled
        if: always()
        working-directory: api-hub-v2
        shell: bash
        run: |
          set -euo pipefail
          if [ -f wrangler.normal.jsonc ] && [ -f .single-secrets.json ]; then
            CLOUDFLARE_API_TOKEN="$DEPLOY_API_TOKEN" npx --yes wrangler@latest deploy --config wrangler.normal.jsonc --secrets-file .single-secrets.json
          fi

      - name: Verify final safety and published post
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let safe=false;
          for(let i=0;i<20;i++){
            const [hr,or]=await Promise.all([fetch(`${process.env.API_HUB_V2_BASE_URL}/health`,{cache:'no-store'}),fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health`,{cache:'no-store'})]);
            const [h,o]=await Promise.all([hr.json().catch(()=>({})),or.json().catch(()=>({}))]);
            safe=hr.ok&&or.ok&&h.bloggerWritesEnabled===false&&h.bloggerWriteMode==='disabled'&&o.bloggerWritesEnabled===false&&o.phase2Automation?.autoPublishExecutionEnabled===false;
            if(safe) break;
            await sleep(1500);
          }
          if(!safe) throw new Error('FINAL_WRITE_GATES_NOT_DISABLED');
          if(!fs.existsSync('.homefix-published.json')){console.log('FINAL_SAFETY_OK no post created; writes OFF');process.exit(0)}
          const p=JSON.parse(fs.readFileSync('.homefix-published.json','utf8'));
          const r=await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/blogger/post/get`,{method:'POST',headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY},body:JSON.stringify({blogId:p.blogId,bloggerPostId:p.bloggerPostId,language:'ko'})});
          const data=await r.json().catch(()=>({}));
          if(!r.ok||String(data.identity?.status||'').toUpperCase()!=='LIVE') throw new Error('FINAL_POST_READBACK_FAILED');
          console.log(`FINAL_SAFETY_OK title=${p.title}; url=${p.url||data.identity?.permalink||'available-in-Blogger'}; APIHubWrites=OFF; OrchestratorWrites=OFF; AutoPublish=OFF`);
          NODE

      - name: Remove orphan images if publication failed before Post ID
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .homefix-published.json ]; then echo 'Post marker exists; keeping article images.'; exit 0; fi
          if [ ! -f .homefix-ready.json ] || [ -z "${R2_API_TOKEN:-}" ]; then exit 0; fi
          node --input-type=module - <<'NODE' > /tmp/orphan-keys.txt
          import fs from 'node:fs';
          const x=JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for(const image of x.images||[]) console.log(image.storage_key);
          NODE
          while read -r key; do [ -z "$key" ] || CLOUDFLARE_API_TOKEN="$R2_API_TOKEN" npx --yes wrangler@latest r2 object delete "$BUCKET_NAME/$key" --remote || true; done < /tmp/orphan-keys.txt

      - name: Cleanup local sensitive files
        if: always()
        shell: bash
        run: rm -f .homefix-ready.json .homefix-published.json api-hub-v2/.single-secrets.json api-hub-v2/wrangler*.jsonc /tmp/homefix-* /tmp/orphan-keys.txt
