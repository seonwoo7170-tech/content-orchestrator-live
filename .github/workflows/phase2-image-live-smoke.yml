name: Phase 2 Image Live Smoke

on:
  push:
    branches: [feature/phase2-ops-images]
    paths:
      - '.github/phase2-image-live-smoke-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-image-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
      HUB_URL: https://api-hub-v2.smileseon.workers.dev
      ORCHESTRATOR_URL: https://content-orchestrator.smileseon.workers.dev
      BUCKET_NAME: content-orchestrator-images
      OBJECT_KEY: jobs/phase2-live-smoke/kie-z-image-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select R2-capable token without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$R2_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$R2_API_TOKEN" >> "$GITHUB_ENV"
          elif [ -n "$DEPLOY_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN=$DEPLOY_API_TOKEN" >> "$GITHUB_ENV"
          else
            echo 'Cloudflare API token missing'; exit 1
          fi
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account id missing'; exit 1; }
          test -n "$HUB_API_KEY" || { echo 'Hub API key missing'; exit 1; }

      - name: Confirm production write gates and KIE readiness
        shell: bash
        run: |
          set -euo pipefail
          HUB_HEALTH="$(curl -fsS "$HUB_URL/health")"
          ORCH_HEALTH="$(curl -fsS "$ORCHESTRATOR_URL/health")"
          HUB_HEALTH="$HUB_HEALTH" ORCH_HEALTH="$ORCH_HEALTH" node - <<'NODE'
          const hub = JSON.parse(process.env.HUB_HEALTH);
          const orch = JSON.parse(process.env.ORCH_HEALTH);
          if (hub.bloggerWritesEnabled !== false) throw new Error('API_HUB_BLOGGER_WRITES_MUST_BE_DISABLED');
          if (orch.bloggerWritesEnabled !== false) throw new Error('ORCHESTRATOR_BLOGGER_WRITES_MUST_BE_DISABLED');
          if (orch.phase2Automation?.autoPublishExecutionEnabled !== false) throw new Error('AUTO_PUBLISH_MUST_BE_DISABLED');
          if (orch.phase2Images?.bucketBound !== true) throw new Error('R2_BUCKET_NOT_BOUND');
          if (hub.kieImageConfigured !== true) throw new Error('KIE_IMAGE_NOT_CONFIGURED');
          if (hub.kieImageModel !== 'z-image') throw new Error('KIE_IMAGE_MODEL_INVALID');
          console.log('Write gates disabled, R2 bound, KIE Z-Image configured.');
          NODE

      - name: Generate one KIE Z-Image probe through API Hub
        shell: bash
        run: |
          set -euo pipefail
          HTTP="$(curl -sS -o /tmp/image-response.json -w '%{http_code}' -X POST "$HUB_URL/api/hub/image/generate" \
            -H "x-hub-api-key: $HUB_API_KEY" \
            -H 'content-type: application/json' \
            --data '{"role":"thumbnail","providerMode":"kie","aspectRatio":"16:9","prompt":"Clean realistic editorial image of a tidy home repair workbench with simple hand tools, soft natural light, one clear focal point, no people"}')"
          HTTP="$HTTP" node - <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.env.HTTP);
          const data = JSON.parse(fs.readFileSync('/tmp/image-response.json', 'utf8'));
          if (status !== 200) throw new Error(`IMAGE_GENERATION_HTTP_${status}:${String(data.error || 'UNKNOWN')}`);
          if (!data.ok || data.provider !== 'kie-ai') throw new Error('KIE_PROVIDER_RESULT_INVALID');
          if (data.model !== 'z-image') throw new Error('KIE_MODEL_RESULT_INVALID');
          const mime = String(data.mimeType || '').toLowerCase();
          if (!['image/jpeg','image/png','image/webp'].includes(mime)) throw new Error(`KIE_MIME_INVALID:${mime}`);
          const bytes = Buffer.from(String(data.imageBase64 || ''), 'base64');
          if (bytes.length < 1000) throw new Error('KIE_IMAGE_BYTES_TOO_SMALL');
          fs.writeFileSync('/tmp/phase2-smoke.img', bytes);
          fs.writeFileSync('/tmp/mime.txt', mime);
          console.log(`KIE Z-Image generated: ${bytes.length} bytes (${mime})`);
          NODE

      - name: Put KIE image into remote R2
        shell: bash
        run: |
          set -euo pipefail
          MIME="$(cat /tmp/mime.txt)"
          npx --yes wrangler@latest r2 object put "$BUCKET_NAME/$OBJECT_KEY" --file /tmp/phase2-smoke.img --content-type "$MIME" --remote

      - name: Verify Orchestrator public media read-back byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          MIME="$(cat /tmp/mime.txt)"
          curl -fsS -D /tmp/media-headers.txt "$ORCHESTRATOR_URL/media/$OBJECT_KEY" -o /tmp/media-readback.img
          test -s /tmp/media-readback.img
          cmp -s /tmp/phase2-smoke.img /tmp/media-readback.img || { echo 'MEDIA_BYTES_MISMATCH'; exit 1; }
          grep -qi "^content-type: $MIME" /tmp/media-headers.txt || { echo 'MEDIA_CONTENT_TYPE_INVALID'; exit 1; }
          echo 'KIE Z-Image R2/media read-back verified byte-for-byte.'

      - name: Remove KIE smoke image from remote R2
        if: always()
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            npx --yes wrangler@latest r2 object delete "$BUCKET_NAME/$OBJECT_KEY" --remote || true
          fi
          rm -f /tmp/image-response.json /tmp/phase2-smoke.img /tmp/media-readback.img /tmp/media-headers.txt /tmp/mime.txt
