name: image-postdeploy-cycle-check

on:
  push:
    branches: [main]
    paths:
      - '.github/image-postdeploy-cycle-check-trigger'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check image states after next watchdog cycle
        shell: bash
        run: |
          set -euo pipefail
          sleep 95
          node - <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN, account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${token}`,'content-type':'application/json'};
          async function cf(url,init={}){const r=await fetch(url,{...init,headers:{...headers,...(init.headers||{})},signal:AbortSignal.timeout(45000)});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(`CF:${r.status}:${JSON.stringify(d.errors||d).slice(0,500)}`);return d;}
          const list=await cf(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`);
          const db=(list.result||[]).find(x=>x.name==='content-orchestrator'); if(!db?.uuid)throw new Error('D1_DATABASE_NOT_FOUND');
          const url=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`;
          async function q(sql){const d=await cf(url,{method:'POST',body:JSON.stringify({sql})});return ((Array.isArray(d.result)?d.result[0]:d.result)||{}).results||[];}
          const images=await q(`SELECT id,job_id,role,position,status,provider,provider_status,provider_task_id,provider_attempt_count,updated_at FROM job_images WHERE job_id IN (95,96,98,100) ORDER BY job_id,id`);
          const jobs=await q(`SELECT id,mode,status,json_extract(result_json,'$.imagePipeline.complete') AS image_complete,json_extract(result_json,'$.imagePipeline.qa') AS image_qa,updated_at FROM jobs WHERE id IN (95,96,98,100) ORDER BY id`);
          console.log('POSTDEPLOY_IMAGES '+JSON.stringify(images));
          console.log('POSTDEPLOY_JOBS '+JSON.stringify(jobs));
          NODE
