name: resolve-current-production-work

on:
  push:
    branches: [main]
    paths:
      - '.github/resolve-current-production-work-trigger'

permissions:
  contents: read

concurrency:
  group: content-orchestrator-current-production-resolver
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    env:
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      ORCHESTRATOR_URL: https://content-orchestrator.smileseon.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve current failed, ready, image and delivery work
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_API_KEY"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const base = process.env.ORCHESTRATOR_URL;
          const adminHeaders = {'x-admin-api-key': process.env.ADMIN_API_KEY};
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          const cfAccount = process.env.CLOUDFLARE_ACCOUNT_ID;
          const cfHeaders = {authorization:`Bearer ${cfToken}`,'content-type':'application/json'};
          const attemptedFresh = new Set();
          const deliveryLinks = new Map();

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          function codeOf(row={}) {
            return String(row.last_error_code || row.error || '').split(/[:\s]/)[0].slice(0,80);
          }
          function safeJob(row={}) {
            let result = null;
            try { result = row.result_json ? JSON.parse(row.result_json) : null; } catch {}
            return {
              id:Number(row.id||0), mode:row.mode||null, blogId:row.blog_id||null,
              bloggerPostId:row.blogger_post_id||null, status:row.status||null,
              error:row.error||null, retryCount:Number(row.retry_count||0),
              recoveryState:row.recovery_state||'none', nextRetryAt:row.next_retry_at||null,
              lastErrorCode:row.last_error_code||null,
              resultStatus:result?.status||null,
              finalCritic:result?.finalCritic ? {status:result.finalCritic.status,score:Number(result.finalCritic.score||0),issues:Array.isArray(result.finalCritic.issues)?result.finalCritic.issues.length:null}:null,
              imageQa:result?.imagePipeline?.qa||null,
              publication:result?.publication ? {status:result.publication.status||null,postId:result.publication.postId||null,url:result.publication.url||null}:null,
              repairUpdate:result?.repairUpdate ? {status:result.repairUpdate.status||null,postId:result.repairUpdate.postId||null,url:result.repairUpdate.url||null}:null,
              updatedAt:row.updated_at||null
            };
          }

          async function api(path, init={}, timeout=45000) {
            const r = await fetch(base+path, {
              ...init,
              headers:{...adminHeaders,...(init.headers||{})},
              cache:'no-store',
              signal:AbortSignal.timeout(timeout)
            });
            const data = await r.json().catch(()=>({}));
            if (!r.ok && r.status !== 207) throw new Error(`ORCH:${path}:${r.status}:${data.error||'FAILED'}`);
            return {status:r.status,data};
          }
          async function get(path, timeout=45000) { return (await api(path,{},timeout)).data; }
          async function post(path, timeout=210000) { return api(path,{method:'POST'},timeout); }

          async function cf(url, init={}) {
            const r = await fetch(url,{...init,headers:{...cfHeaders,...(init.headers||{})},signal:AbortSignal.timeout(45000)});
            const data = await r.json().catch(()=>({}));
            if (!r.ok || data.success === false) throw new Error(`CF:${r.status}:${JSON.stringify(data.errors||data).slice(0,600)}`);
            return data;
          }
          const dbList = await cf(`https://api.cloudflare.com/client/v4/accounts/${cfAccount}/d1/database`);
          const db = (dbList.result||[]).find(item=>item.name==='content-orchestrator');
          if (!db?.uuid) throw new Error('D1_DATABASE_NOT_FOUND');
          const queryUrl = `https://api.cloudflare.com/client/v4/accounts/${cfAccount}/d1/database/${db.uuid}/query`;
          async function query(sql, params=[]) {
            const data = await cf(queryUrl,{method:'POST',body:JSON.stringify({sql,params})});
            return (Array.isArray(data.result)?data.result[0]:data.result)||{};
          }

          const fixableCodes = new Set(['CLOUDFLARE_AI_ACCOUNT_LIMITED','REPAIR_JSON_INVALID','CRITIC_REVIEW_CONTINUE']);
          async function currentFixableFailures() {
            const result = await query(`SELECT j.*
              FROM jobs j
             WHERE j.status='failed'
               AND j.archived_at IS NULL
               AND COALESCE(j.last_error_code,j.error,'') IN ('CLOUDFLARE_AI_ACCOUNT_LIMITED','REPAIR_JSON_INVALID','CRITIC_REVIEW_CONTINUE')
               AND (
                 j.id IN (
                   SELECT job_id FROM daily_plan_slots
                    WHERE plan_date=date('now','+9 hours') AND job_id IS NOT NULL
                 )
                 OR (
                   j.mode='new_article'
                   AND j.created_at >= datetime('now','-2 days')
                   AND NOT EXISTS (SELECT 1 FROM daily_plan_slots sx WHERE sx.job_id=j.id)
                 )
               )
             ORDER BY j.id`);
            return result.results||[];
          }

          async function requeueOne(row, preserveContinuation=false) {
            const id=Number(row.id);
            if (!id) return;
            const keep = preserveContinuation ? 'CRITIC_REVIEW_CONTINUE' : null;
            await query(`UPDATE jobs
                            SET status='queued', error=NULL, retry_count=0, recovery_state='none', next_retry_at=NULL,
                                hold_reason=NULL, last_error_code=?, last_failure_at=NULL, updated_at=datetime('now')
                          WHERE id=? AND status='failed' AND archived_at IS NULL`,[keep,id]);
            await query(`UPDATE daily_plan_slots
                            SET retry_count=0, recovery_state='none', next_retry_at=NULL, hold_reason=NULL,
                                last_error_code=NULL, last_failure_at=NULL, updated_at=datetime('now')
                          WHERE job_id=?`,[id]);
          }

          async function readJob(id) {
            const data = await get(`/api/jobs/${id}`);
            return data.job || data;
          }

          async function executeFreshFailure(row) {
            const id=Number(row.id);
            const originalCode=codeOf(row);
            if (!fixableCodes.has(originalCode)) return;
            console.log('RESCUE_TARGET '+JSON.stringify(safeJob(row)));
            await requeueOne(row, originalCode==='CRITIC_REVIEW_CONTINUE');
            let runs=0;
            while (runs < 3) {
              runs += 1;
              try {
                const out=await post(`/api/jobs/${id}/run`,210000);
                console.log(`JOB_RUN id=${id} round=${runs} http=${out.status}`);
              } catch (error) {
                console.log(`JOB_RUN_ERROR id=${id} round=${runs} ${String(error.message||error)}`);
              }
              await sleep(800);
              const current=await readJob(id);
              console.log('JOB_AFTER_RUN '+JSON.stringify({...safeJob(current),round:runs}));
              if (!['failed'].includes(String(current.status))) return;
              const nextCode=codeOf(current);
              if (nextCode !== 'CRITIC_REVIEW_CONTINUE' || runs >= 3) return;
              await requeueOne(current,true);
              await sleep(500);
            }
          }

          async function rescueNewFailures(label) {
            const rows=await currentFixableFailures();
            const fresh=rows.filter(row=>!attemptedFresh.has(Number(row.id)));
            console.log(`${label}_FIXABLE count=${rows.length} fresh=${fresh.length} ids=${fresh.map(r=>r.id).join(',')}`);
            for (const row of fresh) {
              attemptedFresh.add(Number(row.id));
              await executeFreshFailure(row);
              await sleep(1200);
            }
          }

          async function drainReadyWork(label, maxRounds=24) {
            let stableIdle=0;
            for (let round=1; round<=maxRounds; round++) {
              let publish={data:{}};
              try {
                publish=await post('/api/operations/publish-tick',210000);
                const p=publish.data||{};
                for (const item of p.links||[]) if (item?.jobId) deliveryLinks.set(Number(item.jobId),item);
                console.log(`${label}_PUBLISH round=${round} http=${publish.status} `+JSON.stringify({images:p.images||null,publications:p.publications||null,links:p.links||[]}));
              } catch (error) {
                console.log(`${label}_PUBLISH_ERROR round=${round} ${String(error.message||error)}`);
              }

              let repair={data:{}};
              try {
                repair=await post('/api/operations/repair-publish-tick',90000);
                const r=repair.data?.repairs||repair.data||{};
                console.log(`${label}_REPAIR_UPDATE round=${round} http=${repair.status} `+JSON.stringify({attempted:Number(r.attempted||0),updated:Number(r.updated||r.completed||0),failed:Number(r.failed||0),blocked:Number(r.blocked||0),outcomes:r.outcomes||[]}));
              } catch (error) {
                console.log(`${label}_REPAIR_UPDATE_ERROR round=${round} ${String(error.message||error)}`);
              }

              const diag=await get('/api/operations/images/diagnostics').catch(error=>({readError:String(error.message||error)}));
              const missing=Number(diag.readyMissingImages ?? diag.summary?.readyMissingImages ?? 0);
              const pubAttempted=Number(publish.data?.publications?.attempted||0);
              const imageAttempted=Number(publish.data?.images?.attempted||0);
              const rep=repair.data?.repairs||repair.data||{};
              const repairAttempted=Number(rep.attempted||0);
              console.log(`${label}_STATE round=${round} readyJobs=${Number(diag.readyJobs||diag.summary?.readyJobs||0)} missingImages=${missing} imageAttempted=${imageAttempted} pubAttempted=${pubAttempted} repairAttempted=${repairAttempted}`);
              if (missing===0 && imageAttempted===0 && pubAttempted===0 && repairAttempted===0) stableIdle += 1;
              else stableIdle=0;
              if (stableIdle>=2) break;
              await sleep(1200);
            }
          }

          const before=await get('/api/jobs?limit=80');
          console.log('BEFORE_ACTIVE '+JSON.stringify((before.jobs||[]).filter(j=>['queued','running','repairing','ready','failed','needs_review'].includes(String(j.status))).map(safeJob)));

          await rescueNewFailures('CYCLE1');
          await drainReadyWork('DRAIN1',24);
          await rescueNewFailures('CYCLE2');
          await drainReadyWork('DRAIN2',18);

          // One final repair-delivery pass after all image work is complete.
          for (let i=1;i<=6;i++) {
            const out=await post('/api/operations/repair-publish-tick',90000).catch(error=>({status:0,data:{error:String(error.message||error)}}));
            const r=out.data?.repairs||out.data||{};
            console.log(`FINAL_REPAIR round=${i} http=${out.status} `+JSON.stringify({attempted:Number(r.attempted||0),updated:Number(r.updated||r.completed||0),failed:Number(r.failed||0),blocked:Number(r.blocked||0),error:out.data?.error||null}));
            if (Number(r.attempted||0)===0) break;
            await sleep(900);
          }

          const [jobsData,today,recovery,images,publications]=await Promise.all([
            get('/api/jobs?limit=100'),
            get('/api/operations/today'),
            get('/api/operations/recovery'),
            get('/api/operations/images/diagnostics'),
            get('/api/operations/publications/today').catch(error=>({readError:String(error.message||error)}))
          ]);
          const jobs=jobsData.jobs||[];
          const currentIds=new Set((today.slots||[]).map(s=>Number(s.job_id||s.jobId||0)).filter(Boolean));
          for (const row of jobs) {
            const recentManual = row.mode==='new_article' && row.created_at >= new Date(Date.now()-2*86400000).toISOString().replace('T',' ').slice(0,19);
            if (recentManual && !row.daily_slot_id && row.archived_at==null) currentIds.add(Number(row.id));
          }
          const unresolved=jobs.filter(row=>currentIds.has(Number(row.id)) && !['completed'].includes(String(row.status)) && row.archived_at==null);
          console.log('FINAL_DELIVERY_LINKS '+JSON.stringify([...deliveryLinks.values()]));
          console.log('FINAL_RECOVERY '+JSON.stringify(recovery.summary||recovery));
          console.log('FINAL_IMAGES '+JSON.stringify(images));
          console.log('FINAL_PUBLICATIONS '+JSON.stringify(publications));
          console.log('FINAL_UNRESOLVED '+JSON.stringify(unresolved.map(safeJob)));

          // Do not pretend a provider or quality gate failure is resolved. Leave it
          // in its normal recovery state and make the workflow visibly red.
          if (unresolved.some(row=>['failed','needs_review'].includes(String(row.status)))) {
            throw new Error('CURRENT_WORK_HAS_FAILED_OR_REVIEW_ITEMS');
          }
          NODE
