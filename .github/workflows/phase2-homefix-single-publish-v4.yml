name: Phase 2 Homefix Single Publish v4

on:
  push:
    branches: [feature/phase2-ops-images]
    paths:
      - '.github/phase2-homefix-single-publish-v4-trigger'

permissions:
  contents: read

concurrency:
  group: api-hub-v2-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    env:
      DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      R2_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_HUB_V2_KEY: ${{ secrets.API_HUB_V2_ORCHESTRATOR_API_KEY }}
      EXISTING_ORCHESTRATOR_KEY: ${{ secrets.HUB_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.API_HUB_V2_GEMINI_API_KEY }}
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.API_HUB_V2_GOOGLE_REFRESH_TOKEN }}
      API_HUB_V2_BASE_URL: https://api-hub-v2.smileseon.workers.dev
      ORCHESTRATOR_BASE_URL: https://content-orchestrator.smileseon.workers.dev
      EXPECTED_BLOG_ID: '5540565797560833468'
      EXPECTED_BLOG_NAME: Smile HomeFix
      EXPECTED_BLOG_HOST: www.smileinfo.net
      TEST_TOPIC: 샤워기 수압이 약해졌을 때 집에서 먼저 확인할 5가지
      BUCKET_NAME: content-orchestrator-images

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify source before any production action
        run: |
          npm run verify
          (cd api-hub-v2 && npm run verify)

      - name: Resolve Hub key and validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$API_HUB_V2_KEY" ]; then HUB_API_KEY="$API_HUB_V2_KEY"; else HUB_API_KEY="$EXISTING_ORCHESTRATOR_KEY"; fi
          test -n "$HUB_API_KEY" || { echo 'Hub key missing'; exit 1; }
          echo "HUB_API_KEY=$HUB_API_KEY" >> "$GITHUB_ENV"
          for name in DEPLOY_API_TOKEN R2_API_TOKEN CLOUDFLARE_ACCOUNT_ID GEMINI_API_KEY KIE_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            test -n "${!name}" || { echo "$name is missing"; exit 1; }
          done

      - name: Lock exact Smile HomeFix target with all write gates OFF
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const [hubResp, orchResp] = await Promise.all([
            fetch(`${process.env.API_HUB_V2_BASE_URL}/health`, { cache: 'no-store' }),
            fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health`, { cache: 'no-store' })
          ]);
          const [hub, orch] = await Promise.all([hubResp.json().catch(()=>({})), orchResp.json().catch(()=>({}))]);
          if (!hubResp.ok || hub.ok !== true || hub.bloggerWritesEnabled !== false || hub.bloggerWriteMode !== 'disabled') throw new Error('API_HUB_SAFE_STATE_REQUIRED');
          if (!orchResp.ok || orch.ok !== true || orch.bloggerWritesEnabled !== false || orch.phase2Automation?.autoPublishExecutionEnabled !== false) throw new Error('ORCHESTRATOR_SAFE_STATE_REQUIRED');
          if (orch.phase2Images?.bucketBound !== true) throw new Error('R2_BUCKET_NOT_BOUND');
          const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/blogger/blogs`, {
            method: 'POST', headers: { 'content-type': 'application/json', 'x-hub-api-key': process.env.HUB_API_KEY }, body: JSON.stringify({ action: 'list' })
          });
          const data = await r.json().catch(()=>({}));
          if (!r.ok || !Array.isArray(data.blogs) || data.blogs.length !== 7) throw new Error('CONNECTED_BLOG_LIST_INVALID');
          const target = data.blogs.find(b => String(b.id || b.blogId || '') === process.env.EXPECTED_BLOG_ID);
          if (!target) throw new Error('HOMEFIX_ID_NOT_CONNECTED');
          const name = String(target.name || target.blogName || '');
          const host = new URL(String(target.url || '')).hostname.toLowerCase();
          if (name !== process.env.EXPECTED_BLOG_NAME || host !== process.env.EXPECTED_BLOG_HOST) throw new Error(`HOMEFIX_IDENTITY_MISMATCH:${name}:${host}`);
          console.log(`TARGET_OK name=${name}; id=${process.env.EXPECTED_BLOG_ID}; host=${host}; connected=${data.blogs.length}`);
          NODE

      - name: Find one READY article from at most three fresh standard-pipeline candidates
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { runNewArticlePipeline } from './worker/lib/pipeline.js';
          import { validateArticle } from './worker/lib/contracts.js';
          import { lintNaturalWriting } from './worker/lib/natural-writing-linter.js';
          const env = { API_HUB_BASE_URL: process.env.API_HUB_V2_BASE_URL, HUB_API_KEY: process.env.HUB_API_KEY };
          let chosen = null;
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const stages = [];
            console.log(`CANDIDATE_${attempt}_START`);
            const result = await runNewArticlePipeline(env, {
              blogId: process.env.EXPECTED_BLOG_ID,
              topic: process.env.TEST_TOPIC,
              language: 'ko'
            }, fetch, { onStage: async stage => { stages.push(stage); console.log(`candidate=${attempt}; stage=${stage}`); } });
            if (result.status !== 'READY') {
              const lint = result.styleLint?.afterPostRepairStyleRepair || result.styleLint?.afterStyleRepair || null;
              const codes = (lint?.blockingIssues || []).map(x => `${x.code}@${x.location}`).join(',') || 'none';
              console.log(`CANDIDATE_${attempt}_REJECT status=${result.status}; reason=${result.reviewReason || 'quality_gate'}; blocks=${codes}`);
              continue;
            }
            if (result.finalCritic?.status !== 'PASS' || Number(result.finalCritic?.score || 0) < 95 || (result.finalCritic?.issues || []).length !== 0) {
              console.log(`CANDIDATE_${attempt}_REJECT finalCritic=${result.finalCritic?.status}:${result.finalCritic?.score}`);
              continue;
            }
            const article = validateArticle(result.article);
            const lint = lintNaturalWriting(article);
            if (lint.status === 'BLOCK') {
              console.log(`CANDIDATE_${attempt}_REJECT finalLint=BLOCK`);
              continue;
            }
            chosen = { article, initialCritic: result.initialCritic, finalCritic: result.finalCritic, repairApplied: result.repairApplied === true, styleRepairApplied: result.styleRepairApplied === true, stages, attempt, lintStatus: lint.status };
            break;
          }
          if (!chosen) throw new Error('NO_READY_CANDIDATE_AFTER_3');
          fs.writeFileSync('.homefix-pipeline.json', JSON.stringify(chosen));
          fs.chmodSync('.homefix-pipeline.json', 0o600);
          console.log(`READY_ARTICLE attempt=${chosen.attempt}; title=${chosen.article.title}; finalCritic=${chosen.finalCritic.score}; lint=${chosen.lintStatus}; BloggerWrites=OFF`);
          NODE

      - name: Generate thumbnail plus two body images with FLUX-to-KIE auto routing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateArticle } from './worker/lib/contracts.js';
          import { buildImagePlan, attachStoredImages } from './worker/lib/image-plan.js';
          import { lintNaturalWriting } from './worker/lib/natural-writing-linter.js';
          const pipeline = JSON.parse(fs.readFileSync('.homefix-pipeline.json','utf8'));
          const plan = buildImagePlan(pipeline.article, { bodyCount: 2 });
          if (plan.images.length !== 3) throw new Error(`IMAGE_PLAN_COUNT_INVALID:${plan.images.length}`);
          const rows = [];
          for (let i = 0; i < plan.images.length; i += 1) {
            const image = plan.images[i];
            const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/hub/image/generate`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', 'x-hub-api-key': process.env.HUB_API_KEY },
              body: JSON.stringify({ role: image.role, providerMode: 'auto', prompt: image.prompt, aspectRatio: image.role === 'thumbnail' ? '16:9' : '4:3', steps: 4, seed: 20260829 + i })
            });
            const g = await r.json().catch(()=>({}));
            if (!r.ok || g.ok !== true) throw new Error(`IMAGE_GENERATION_FAILED_${i}:${g.error || r.status}`);
            const mime = String(g.mimeType || '').split(';')[0].trim().toLowerCase();
            const ext = mime === 'image/png' ? 'png' : mime === 'image/webp' ? 'webp' : mime === 'image/jpeg' ? 'jpg' : '';
            if (!ext) throw new Error(`IMAGE_MIME_INVALID:${mime}`);
            const bytes = Buffer.from(String(g.imageBase64 || ''), 'base64');
            if (bytes.length < 1000) throw new Error('IMAGE_BYTES_TOO_SMALL');
            const localFile = `/tmp/homefix-${i}.${ext}`;
            const storageKey = `jobs/homefix-single-publish-${process.env.GITHUB_RUN_ID}/${image.role}-${image.position}.${ext}`;
            const publicUrl = `${process.env.ORCHESTRATOR_BASE_URL}/media/${storageKey}`;
            fs.writeFileSync(localFile, bytes);
            rows.push({ id: 920000 + i, role: image.role, position: image.position, status: 'stored', public_url: publicUrl, alt_text: image.altText, storage_key: storageKey, mimeType: mime, localFile, provider: String(g.provider || ''), model: String(g.model || '') });
            console.log(`IMAGE_${i + 1} provider=${g.provider}; model=${g.model}; mime=${mime}; bytes=${bytes.length}`);
          }
          const article = validateArticle(attachStoredImages(pipeline.article, rows));
          if (lintNaturalWriting(article).status === 'BLOCK') throw new Error('ARTICLE_BLOCKED_AFTER_IMAGE_ATTACHMENT');
          fs.writeFileSync('.homefix-ready.json', JSON.stringify({ ...pipeline, article, images: rows }));
          fs.chmodSync('.homefix-ready.json', 0o600);
          console.log('IMAGES_READY count=3');
          NODE

      - name: Upload and verify three permanent R2 article images
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE' > /tmp/homefix-r2.tsv
          import fs from 'node:fs';
          const ready = JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for (const image of ready.images) console.log([image.localFile, image.storage_key, image.mimeType].join('\t'));
          NODE
          while IFS=$'\t' read -r file key mime; do
            CLOUDFLARE_API_TOKEN="$R2_API_TOKEN" npx --yes wrangler@latest r2 object put "$BUCKET_NAME/$key" --file "$file" --content-type "$mime" --remote
          done < /tmp/homefix-r2.tsv
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ready = JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for (const image of ready.images) {
            const r = await fetch(image.public_url, { cache: 'no-store' });
            if (!r.ok) throw new Error(`MEDIA_HTTP_${r.status}`);
            const remote = Buffer.from(await r.arrayBuffer());
            const local = fs.readFileSync(image.localFile);
            const mime = String(r.headers.get('content-type') || '').split(';')[0].trim().toLowerCase();
            if (!remote.equals(local) || mime !== image.mimeType) throw new Error(`MEDIA_VERIFY_FAILED:${image.storage_key}`);
          }
          console.log('MEDIA_PREFLIGHT_OK count=3');
          NODE

      - name: Prepare disabled and exact-target guarded API Hub configs
        shell: bash
        run: |
          set -euo pipefail
          GOOGLE_OAUTH_SETUP_ENABLED=false node api-hub-v2/scripts/render-wrangler.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const normal = JSON.parse(fs.readFileSync('api-hub-v2/wrangler.jsonc','utf8'));
          if (normal.vars?.BLOGGER_WRITES_ENABLED !== 'false' || normal.vars?.BLOGGER_WRITE_MODE !== 'disabled') throw new Error('NORMAL_GATE_NOT_DISABLED');
          fs.writeFileSync('api-hub-v2/wrangler.normal.jsonc', JSON.stringify(normal, null, 2));
          const guarded = structuredClone(normal);
          guarded.vars.BLOGGER_WRITES_ENABLED = 'true';
          guarded.vars.BLOGGER_WRITE_MODE = 'phase2_single_publish';
          guarded.vars.PHASE2_SINGLE_PUBLISH_BLOG_ID = process.env.EXPECTED_BLOG_ID;
          fs.writeFileSync('api-hub-v2/wrangler.single.jsonc', JSON.stringify(guarded, null, 2));
          const secrets = { ORCHESTRATOR_API_KEY: process.env.HUB_API_KEY, GEMINI_API_KEY: process.env.GEMINI_API_KEY, KIE_API_KEY: process.env.KIE_API_KEY, GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET, GOOGLE_REFRESH_TOKEN: process.env.GOOGLE_REFRESH_TOKEN };
          fs.writeFileSync('api-hub-v2/.single-secrets.json', JSON.stringify(secrets));
          fs.chmodSync('api-hub-v2/.single-secrets.json', 0o600);
          NODE

      - name: Temporarily enable exact-target single-publish gate
        shell: bash
        working-directory: api-hub-v2
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$DEPLOY_API_TOKEN" npx --yes wrangler@latest deploy --config wrangler.single.jsonc --secrets-file .single-secrets.json

      - name: Confirm temporary gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          for (let i=0;i<20;i++) {
            const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/health`, { cache:'no-store' });
            const h = await r.json().catch(()=>({}));
            if (r.ok && h.bloggerWritesEnabled === true && h.bloggerWriteMode === 'phase2_single_publish') { console.log('SINGLE_PUBLISH_GATE_ACTIVE'); process.exit(0); }
            await sleep(1500);
          }
          throw new Error('SINGLE_PUBLISH_GATE_NOT_READY');
          NODE

      - name: Publish exactly one Smile HomeFix post and mark Post ID immediately
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const ready = JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          async function call(path, body) {
            const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}${path}`, { method:'POST', headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY}, body:JSON.stringify(body) });
            const data = await r.json().catch(()=>({}));
            if (!r.ok) throw new Error(`${path}:${r.status}:${data.error || 'REQUEST_FAILED'}`);
            return data;
          }
          const published = await call('/api/blogger/post', { phase2SinglePublish:true, operation:'create', publishMode:'published', blogId:process.env.EXPECTED_BLOG_ID, article:ready.article });
          const postId = String(published.bloggerPostId || '').trim();
          if (!postId) throw new Error('BLOGGER_POST_ID_MISSING');
          const marker = { blogId:process.env.EXPECTED_BLOG_ID, bloggerPostId:postId, title:ready.article.title, url:published.url || null, imageCount:ready.images.length, finalCriticScore:ready.finalCritic.score };
          fs.writeFileSync('.homefix-published.json', JSON.stringify(marker));
          fs.chmodSync('.homefix-published.json', 0o600);
          console.log(`HOMEFIX_POST_CREATED postId=${postId}; title=${ready.article.title}`);
          if (published.url) console.log(`HOMEFIX_PUBLIC_URL=${published.url}`);
          const verify = await call('/api/blogger/post/get', { blogId:process.env.EXPECTED_BLOG_ID, bloggerPostId:postId, language:'ko' });
          if (String(verify.identity?.bloggerPostId || '') !== postId) throw new Error('POST_ID_READBACK_MISMATCH');
          if (String(verify.identity?.status || '').toUpperCase() !== 'LIVE') throw new Error(`POST_NOT_LIVE:${verify.identity?.status || 'unknown'}`);
          if (String(verify.article?.title || '') !== ready.article.title) throw new Error('TITLE_READBACK_MISMATCH');
          for (const image of ready.images) if (!String(verify.article?.html || '').includes(image.public_url)) throw new Error(`BLOGGER_IMAGE_MISSING:${image.storage_key}`);
          marker.url = published.url || verify.identity?.permalink || null;
          marker.status = 'LIVE';
          fs.writeFileSync('.homefix-published.json', JSON.stringify(marker));
          console.log(`HOMEFIX_SINGLE_PUBLISH_OK postId=${postId}; status=LIVE; images=3; finalCritic=${ready.finalCritic.score}; candidate=${ready.attempt}`);
          console.log(`HOMEFIX_PUBLIC_URL=${marker.url || 'available-in-Blogger'}`);
          NODE

      - name: Restore API Hub Blogger writes disabled
        if: always()
        shell: bash
        working-directory: api-hub-v2
        run: |
          set -euo pipefail
          if [ -f wrangler.normal.jsonc ] && [ -f .single-secrets.json ]; then
            CLOUDFLARE_API_TOKEN="$DEPLOY_API_TOKEN" npx --yes wrangler@latest deploy --config wrangler.normal.jsonc --secrets-file .single-secrets.json
          fi

      - name: Verify final safety and exact existing post if created
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          let safe = false;
          for (let i=0;i<20;i++) {
            const [hr,or] = await Promise.all([fetch(`${process.env.API_HUB_V2_BASE_URL}/health`,{cache:'no-store'}),fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health`,{cache:'no-store'})]);
            const [h,o] = await Promise.all([hr.json().catch(()=>({})),or.json().catch(()=>({}))]);
            safe = hr.ok && or.ok && h.bloggerWritesEnabled === false && h.bloggerWriteMode === 'disabled' && o.bloggerWritesEnabled === false && o.phase2Automation?.autoPublishExecutionEnabled === false;
            if (safe) break;
            await sleep(1500);
          }
          if (!safe) throw new Error('FINAL_WRITE_GATES_NOT_DISABLED');
          if (!fs.existsSync('.homefix-published.json')) { console.log('FINAL_SAFETY_OK no post marker; all writes OFF'); process.exit(0); }
          const p = JSON.parse(fs.readFileSync('.homefix-published.json','utf8'));
          const r = await fetch(`${process.env.API_HUB_V2_BASE_URL}/api/blogger/post/get`, { method:'POST', headers:{'content-type':'application/json','x-hub-api-key':process.env.HUB_API_KEY}, body:JSON.stringify({blogId:p.blogId,bloggerPostId:p.bloggerPostId,language:'ko'}) });
          const data = await r.json().catch(()=>({}));
          if (!r.ok || String(data.identity?.status || '').toUpperCase() !== 'LIVE') throw new Error('FINAL_POST_READBACK_FAILED');
          console.log(`FINAL_SAFETY_OK postId=${p.bloggerPostId}; url=${p.url || data.identity?.permalink || 'available-in-Blogger'}; APIHubWrites=OFF; OrchestratorWrites=OFF; AutoPublish=OFF`);
          NODE

      - name: Delete orphan R2 images only when no Blogger Post ID was returned
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .homefix-published.json ]; then echo 'Post marker exists; keeping its permanent R2 images and refusing duplicate cleanup.'; exit 0; fi
          if [ -f .homefix-ready.json ]; then
            node --input-type=module - <<'NODE' > /tmp/homefix-cleanup.txt
          import fs from 'node:fs';
          const ready=JSON.parse(fs.readFileSync('.homefix-ready.json','utf8'));
          for (const image of ready.images || []) console.log(image.storage_key);
          NODE
            while IFS= read -r key; do [ -n "$key" ] && CLOUDFLARE_API_TOKEN="$R2_API_TOKEN" npx --yes wrangler@latest r2 object delete "$BUCKET_NAME/$key" --remote || true; done < /tmp/homefix-cleanup.txt
          fi

      - name: Cleanup local sensitive files
        if: always()
        shell: bash
        run: rm -f .homefix-pipeline.json .homefix-ready.json .homefix-published.json /tmp/homefix-* api-hub-v2/.single-secrets.json api-hub-v2/wrangler.jsonc api-hub-v2/wrangler.normal.jsonc api-hub-v2/wrangler.single.jsonc
