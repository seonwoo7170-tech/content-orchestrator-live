name: patch-provider-task-id-isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-provider-task-id-isolation-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate async task ids by provider
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/lib/image-executor.js')
          s=p.read_text()
          old="""  if ((providerMode === 'kie' || providerMode === 'modelscope') && String(image?.provider_task_id || '').trim()) {\n    payload.taskId = String(image.provider_task_id).trim();\n  }\n"""
          new="""  const existingProvider = String(image?.provider || '').trim().toLowerCase();\n  const existingTaskId = String(image?.provider_task_id || '').trim();\n  const sameAsyncProvider = providerMode === 'kie'\n    ? ['kie', 'kie-ai'].includes(existingProvider)\n    : providerMode === 'modelscope'\n      ? existingProvider === 'modelscope'\n      : false;\n  if (sameAsyncProvider && existingTaskId) payload.taskId = existingTaskId;\n"""
          if old not in s:
              raise SystemExit('provider task id forwarding block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name "smileseon-ops"
          git config user.email "actions@users.noreply.github.com"
          git add worker/lib/image-executor.js
          git commit -m "fix: never forward Puter checkpoint ids to KIE"
          git push origin HEAD:main
