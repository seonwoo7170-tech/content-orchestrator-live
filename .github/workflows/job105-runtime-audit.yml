name: job105-runtime-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/job105-runtime-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      KIE_API_KEY: ${{ secrets.KIE_API_KEY }}
      PUTER_AUTH_TOKEN: ${{ secrets.PUTER_AUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate exact image watchdog candidate query
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          console.log('GITHUB_PUTER_TOKEN_PRESENT '+Boolean(process.env.PUTER_AUTH_TOKEN));
          console.log('GITHUB_KIE_KEY_PRESENT '+Boolean(process.env.KIE_API_KEY));
          if(process.env.KIE_API_KEY) {
            const response=await fetch('https://api.kie.ai/api/v1/chat/credit',{headers:{authorization:'Bearer '+process.env.KIE_API_KEY},signal:AbortSignal.timeout(20000)});
            const result=await response.json();
            console.log('KIE_CREDIT_CHECK '+JSON.stringify({httpStatus:response.status,providerCode:result.code,credits:typeof result.data==='number'?result.data:null}));
          }
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,init={}){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{...init,headers});const d=await r.json();if(!r.ok||d.success===false)throw new Error(`${path}:${r.status}:${JSON.stringify(d.errors||d).slice(0,500)}`);return d;}
          for (const worker of ['content-orchestrator','api-hub-v2']) {
            const settings=(await cf('/workers/scripts/'+worker+'/settings')).result;
            console.log('BINDINGS '+worker+' '+JSON.stringify((settings.bindings||[]).filter(b=>b.type==='service').map(b=>({name:b.name,service:b.service,environment:b.environment,entrypoint:b.entrypoint}))));
            const puterBindings=(settings.bindings||[]).filter(b=>/PUTER/i.test(String(b.name||''))).map(b=>({name:b.name,type:b.type}));
            console.log('PUTER_BINDINGS '+worker+' '+JSON.stringify(puterBindings));
            console.log('LIMITS '+worker+' '+JSON.stringify(settings.limits||{}));
            const health=await fetch('https://'+worker+'.smileseon.workers.dev/health');
            console.log('HEALTH '+worker+' '+health.status+' '+(await health.text()).slice(0,10000));
          }
          const scripts=(await cf('/workers/scripts')).result || [];
          const relevant=scripts.map(s=>s.id||s.name).filter(name=>/(orchestrator|hub|five|smile)/i.test(String(name||'')));
          for (const name of relevant) {
            try {
              const settings=(await cf('/workers/scripts/'+name+'/settings')).result;
              const puter=(settings.bindings||[]).filter(b=>/PUTER/i.test(String(b.name||''))).map(b=>({name:b.name,type:b.type}));
              if(puter.length) console.log('PUTER_SCRIPT_BINDINGS '+name+' '+JSON.stringify(puter));
            } catch {}
          }
          console.log('RELEVANT_WORKERS '+JSON.stringify(relevant));
          for (const environment of ['production']) {
            try {
              const settings=(await cf('/workers/services/content-orchestrator/environments/'+environment+'/settings')).result;
              console.log('PUTER_ENV_BINDINGS '+environment+' '+JSON.stringify((settings.bindings||[]).filter(b=>/PUTER/i.test(String(b.name||''))).map(b=>({name:b.name,type:b.type}))));
            } catch (error) {
              console.log('PUTER_ENV_BINDINGS '+environment+' '+JSON.stringify({unavailable:true}));
            }
          }
          const db=(await cf('/d1/database')).result.find(d=>d.name==='content-orchestrator');
          async function q(sql,params=[]){const d=await cf(`/d1/database/${db.uuid}/query`,{method:'POST',body:JSON.stringify({sql,params})});const x=Array.isArray(d.result)?d.result[0]:d.result;return {rows:x?.results||[],meta:x?.meta||{}};}
          const {listReadyImageCandidates}=await import('./worker/lib/image-completion.js');
          const candidates=await listReadyImageCandidates({ORCHESTRATOR_DB:{prepare(sql){return {bind(...params){return {async all(){return {results:(await q(sql,params)).rows};}};}};}}},{maxJobs:8,staleMinutes:0});
          console.log('READY_SHAPES '+JSON.stringify(candidates.map(r=>{let v;try{v=JSON.parse(r.result_json);}catch{}return {id:r.job_id,mode:r.mode,status:v?.status,article:!!v?.article,imageComplete:v?.imagePipeline?.complete};})));
          console.log('PRESERVED_FAILURES '+JSON.stringify(await q("SELECT job_id,id,provider_error_code,updated_at FROM job_images WHERE provider_error_code LIKE 'IMAGE_FALLBACK_FAILED:%' ORDER BY datetime(updated_at) DESC LIMIT 8")));
          console.log('CANDIDATE_IMAGES '+JSON.stringify(await q("SELECT job_id,id,status,provider,provider_status,provider_error_code,updated_at FROM job_images WHERE job_id IN (127,128,129,96,98,95,100,114,115,116,117) ORDER BY job_id,position")));
          console.log('CANDIDATES '+JSON.stringify(candidates.map(r=>({id:r.job_id,updated:r.updated_at,failed:r.has_failed_images,active:r.has_active_provider_task,checked:r.active_provider_checked_at}))));
          console.log('SETTINGS105 '+JSON.stringify(await q(`SELECT scope_key,inherit_global,json_extract(settings_json,'$.enabled') AS enabled,json_extract(settings_json,'$.imagesEnabled') AS images_enabled FROM automation_settings WHERE scope_key='global' OR blog_id=(SELECT blog_id FROM jobs WHERE id=105)`)));
          console.log('SCHEMA '+JSON.stringify((await q('PRAGMA table_info(job_images)')).rows.map(r=>r.name)));
          console.log('LOCKS '+JSON.stringify(await q(`SELECT lock_key,expires_at,updated_at FROM runtime_locks WHERE lock_key LIKE '%image%'`)));
          console.log('JOBS_105_133 '+JSON.stringify(await q(`SELECT id,status,updated_at,json_extract(result_json,'$.status') AS result_status,json_extract(result_json,'$.imagePipeline.complete') AS image_complete FROM jobs WHERE id IN (105,133) ORDER BY id`)));
          console.log('IMAGES_105_133 '+JSON.stringify(await q(`SELECT job_id,id,position,status,provider,provider_task_id,provider_status,provider_checked_at,provider_attempt_count,provider_error_code,created_at,updated_at FROM job_images WHERE job_id IN (105,133) ORDER BY job_id,position,id`)));
          NODE
