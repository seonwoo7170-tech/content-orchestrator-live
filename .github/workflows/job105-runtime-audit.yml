name: job105-runtime-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/job105-runtime-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Job 105 runtime lock and image state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'content-type':'application/json'};
          async function cf(path,init={}){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`,{...init,headers});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={raw:text.slice(0,3000)}}if(!r.ok||d.success===false)throw new Error(`${path}:${r.status}:${JSON.stringify(d.errors||d).slice(0,500)}`);return d;}
          const dbs=(await cf('/d1/database')).result||[]; const db=dbs.find(d=>d.name==='content-orchestrator'); if(!db)throw new Error('DB_NOT_FOUND');
          async function q(sql,params=[]){const d=await cf(`/d1/database/${db.uuid}/query`,{method:'POST',body:JSON.stringify({sql,params})});const x=Array.isArray(d.result)?d.result[0]:d.result;return {rows:x?.results||[],meta:x?.meta||{}};}
          console.log('LOCK '+JSON.stringify(await q(`SELECT lock_key,expires_at,updated_at FROM runtime_locks WHERE lock_key='serial-image-kie'`)));
          console.log('JOB '+JSON.stringify(await q(`SELECT id,status,updated_at FROM jobs WHERE id=105`)));
          console.log('IMAGES '+JSON.stringify(await q(`SELECT id,status,provider,provider_task_id,provider_status,provider_checked_at,public_url,error,updated_at FROM job_images WHERE job_id=105 ORDER BY position,id`)));
          try {
            const settings=await cf('/workers/scripts/content-orchestrator/settings');
            const bindings=(settings.result?.bindings||settings.bindings||[]).map(b=>({name:b.name,type:b.type,text:typeof b.text==='string'?b.text:null}));
            const wanted=new Set(['DAILY_WORK_EXECUTION_ENABLED','JOB_RECOVERY_EXECUTION_ENABLED','BLOGGER_WRITES_ENABLED','AUTO_PUBLISH_EXECUTION_ENABLED','KIE_IMAGE_CALLBACK_ENABLED','KIE_IMAGE_FALLBACK_ENABLED','MODELSCOPE_IMAGE_ENABLED','IMAGE_COMPLETION_MAX_ITEMS','SERIAL_IMAGE_CHAIN_MAX_ITEMS','SERIAL_IMAGE_POLL_INTERVAL_MS','SERIAL_ARTICLE_IMAGE_COOLDOWN_MS','SERIAL_IMAGE_JOB_BUDGET_MS','SERIAL_IMAGE_CHAIN_BUDGET_MS','KIE_ACTIVE_TASK_STALE_MINUTES','KIE_ACTIVE_TASK_STALE_MS']);
            console.log('RUNTIME_VARS '+JSON.stringify(bindings.filter(b=>wanted.has(b.name))));
            console.log('SECRET_PRESENCE '+JSON.stringify(bindings.filter(b=>['PUTER_AUTH_TOKEN','API_HUB_KEY','API_HUB_API_KEY','ADMIN_API_KEY'].includes(b.name)).map(b=>({name:b.name,type:b.type}))));
          } catch(e){console.log('SETTINGS_ERROR '+String(e.message||e));}
          NODE
