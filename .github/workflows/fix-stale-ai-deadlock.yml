name: fix-stale-ai-deadlock

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stale-ai-deadlock.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Patch stale AI recovery ordering guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('worker/mcp-entry.js')
          s = p.read_text()
          old = """async function activeAiJob(env) {
  if (!env?.ORCHESTRATOR_DB) return null;
  const row = await env.ORCHESTRATOR_DB.prepare(
    `SELECT id, status
       FROM jobs
      WHERE archived_at IS NULL
        AND status IN ('writing', 'critic_review', 'repairing', 'final_critic')
      ORDER BY updated_at, id
      LIMIT 1`
  ).first();
  return row ? { id: Number(row.id), status: String(row.status || '') } : null;
}
"""
          new = """async function activeAiJob(env) {
  if (!env?.ORCHESTRATOR_DB) return null;
  const staleMinutes = positiveBounded(env?.JOB_RECOVERY_STALE_MINUTES, 20, 5, 1440);
  const row = await env.ORCHESTRATOR_DB.prepare(
    `SELECT id, status
       FROM jobs
      WHERE archived_at IS NULL
        AND status IN ('writing', 'critic_review', 'repairing', 'final_critic')
        AND datetime(updated_at) > datetime('now', ?)
      ORDER BY datetime(updated_at), id
      LIMIT 1`
  ).bind(`-${staleMinutes} minutes`).first();
  return row ? { id: Number(row.id), status: String(row.status || '') } : null;
}
"""
          if old not in s:
              raise SystemExit('mcp-entry target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('worker/lib/job-auto-rescue.js')
          s = p.read_text()
          old = "OR (status IN ('queued','writing','critic_review','repairing','final_critic') AND updated_at <= ?)"
          new = "OR (status IN ('queued','writing','critic_review','repairing','final_critic') AND datetime(updated_at) <= datetime(?))"
          if old not in s:
              raise SystemExit('job-auto-rescue target not found')
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/stale-ai-deadlock.test.mjs')
          t.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';

test('stale AI rows do not block watchdog recovery forever', async () => {
  const source = await readFile(new URL('../worker/mcp-entry.js', import.meta.url), 'utf8');
  assert.match(source, /datetime\(updated_at\) > datetime\('now', \?\)/);
  assert.match(source, /JOB_RECOVERY_STALE_MINUTES/);
});

test('automatic stale rescue compares SQLite timestamps as datetimes', async () => {
  const source = await readFile(new URL('../worker/lib/job-auto-rescue.js', import.meta.url), 'utf8');
  assert.match(source, /datetime\(updated_at\) <= datetime\(\?\)/);
});
""")
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name smileseon-ops
          git config user.email actions@users.noreply.github.com
          git add worker/mcp-entry.js worker/lib/job-auto-rescue.js tests/stale-ai-deadlock.test.mjs
          git diff --cached --check
          git commit -m "fix: prevent stale AI watchdog deadlock"
          git push
