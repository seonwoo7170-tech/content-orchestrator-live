name: HomeFix Language Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/homefix-language-audit-trigger'

permissions:
  contents: read

concurrency:
  group: homefix-language-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.API_HUB_V2_GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.API_HUB_V2_GOOGLE_REFRESH_TOKEN }}
      API_HUB_V2_BASE_URL: https://api-hub-v2.smileseon.workers.dev
      ORCHESTRATOR_BASE_URL: https://content-orchestrator.smileseon.workers.dev
      EXPECTED_BLOG_NAME: Smile HomeFix
      EXPECTED_BLOG_HOST: www.smileinfo.net
    steps:
      - name: Validate read-only credentials and production safety
        shell: bash
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            test -n "${!name}" || { echo "$name missing"; exit 1; }
          done
          node --input-type=module - <<'NODE'
          const [hr, or] = await Promise.all([
            fetch(`${process.env.API_HUB_V2_BASE_URL}/health?audit=${Date.now()}`, { cache: 'no-store' }),
            fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health?audit=${Date.now()}`, { cache: 'no-store' })
          ]);
          const [h, o] = await Promise.all([hr.json().catch(() => ({})), or.json().catch(() => ({}))]);
          if (!hr.ok || h.bloggerWritesEnabled !== false || h.bloggerWriteMode !== 'disabled') throw new Error('API_HUB_WRITES_NOT_OFF');
          if (!or.ok || o.bloggerWritesEnabled !== false || o.phase2Automation?.autoPublishExecutionEnabled !== false) throw new Error('ORCHESTRATOR_WRITES_NOT_OFF');
          console.log('AUDIT_PRECHECK_SAFE writes=OFF');
          NODE

      - name: Scan every live HomeFix post and classify visible language
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          function stripHtml(value) {
            return String(value || '')
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
              .replace(/<[^>]+>/g, ' ')
              .replace(/&nbsp;/gi, ' ')
              .replace(/&amp;/gi, '&')
              .replace(/&lt;/gi, '<')
              .replace(/&gt;/gi, '>')
              .replace(/&quot;/gi, '"')
              .replace(/&#39;/gi, "'")
              .replace(/\s+/g, ' ')
              .trim();
          }
          function detect(value) {
            const text = stripHtml(value);
            const hangul = (text.match(/[가-힣]/g) || []).length;
            const latin = (text.match(/[A-Za-z]/g) || []).length;
            if (hangul < 12 && latin < 30) return 'unknown';
            if (hangul >= 12 && hangul >= latin * 0.15) return 'ko';
            if (latin >= 30 && latin > hangul * 3) return 'en';
            return hangul > latin ? 'ko' : 'en';
          }
          async function google(path, token) {
            const r = await fetch(`https://www.googleapis.com/blogger/v3${path}`, { headers: { authorization: `Bearer ${token}` } });
            const data = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(`BLOGGER_READ_${r.status}`);
            return data;
          }
          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: { 'content-type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              client_id: process.env.GOOGLE_CLIENT_ID,
              client_secret: process.env.GOOGLE_CLIENT_SECRET,
              refresh_token: process.env.GOOGLE_REFRESH_TOKEN,
              grant_type: 'refresh_token'
            })
          });
          const tokenData = await tokenResponse.json().catch(() => ({}));
          if (!tokenResponse.ok || !tokenData.access_token) throw new Error('GOOGLE_TOKEN_EXCHANGE_FAILED');
          const blogs = await google('/users/self/blogs?fetchUserInfo=false', tokenData.access_token);
          const target = (blogs.items || []).find(blog => {
            let host = '';
            try { host = new URL(String(blog.url || '')).hostname.toLowerCase(); } catch {}
            return String(blog.name || '') === process.env.EXPECTED_BLOG_NAME && host === process.env.EXPECTED_BLOG_HOST;
          });
          if (!target?.id) throw new Error('HOMEFIX_NOT_FOUND');
          const posts = [];
          let pageToken = '';
          do {
            const qs = new URLSearchParams({ fetchBodies: 'true', maxResults: '50', status: 'live', view: 'ADMIN', orderBy: 'published' });
            if (pageToken) qs.set('pageToken', pageToken);
            const page = await google(`/blogs/${encodeURIComponent(target.id)}/posts?${qs}`, tokenData.access_token);
            posts.push(...(page.items || []));
            pageToken = String(page.nextPageToken || '');
          } while (pageToken);

          const classified = posts.map(post => ({
            language: detect(`${post.title || ''}\n${post.content || ''}`),
            title: String(post.title || '').replace(/\s+/g, ' ').trim(),
            url: String(post.url || '').trim(),
            published: String(post.published || '').slice(0, 10)
          }));
          const counts = { en: 0, ko: 0, unknown: 0 };
          for (const item of classified) counts[item.language] = (counts[item.language] || 0) + 1;
          console.log(`HOMEFIX_LANGUAGE_AUDIT total=${classified.length}; en=${counts.en}; ko=${counts.ko}; unknown=${counts.unknown}`);
          classified.filter(x => x.language === 'ko').forEach((item, index) => {
            console.log(`KO_TARGET_${index + 1} published=${item.published}; title=${item.title}; url=${item.url}`);
          });
          NODE

      - name: Reconfirm no write gate changed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const [hr, or] = await Promise.all([
            fetch(`${process.env.API_HUB_V2_BASE_URL}/health?audit_final=${Date.now()}`, { cache: 'no-store' }),
            fetch(`${process.env.ORCHESTRATOR_BASE_URL}/health?audit_final=${Date.now()}`, { cache: 'no-store' })
          ]);
          const [h, o] = await Promise.all([hr.json(), or.json()]);
          if (!hr.ok || h.bloggerWritesEnabled !== false || h.bloggerWriteMode !== 'disabled') throw new Error('API_HUB_FINAL_WRITES_NOT_OFF');
          if (!or.ok || o.bloggerWritesEnabled !== false || o.phase2Automation?.autoPublishExecutionEnabled !== false) throw new Error('ORCHESTRATOR_FINAL_WRITES_NOT_OFF');
          console.log('AUDIT_FINAL_SAFE writes=OFF');
          NODE
