name: blogger-read-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/blogger-read-probe-trigger'
      - '.github/workflows/blogger-read-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed API Hub Blogger route surface
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('CF_CREDENTIALS_MISSING');
          const headers = { authorization: `Bearer ${token}` };
          const listRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts`, { headers, signal: AbortSignal.timeout(15000) });
          const list = await listRes.json().catch(() => ({}));
          if (!listRes.ok || list.success === false) throw new Error(`WORKER_LIST_FAILED:${listRes.status}`);
          const scripts = Array.isArray(list.result) ? list.result : [];
          const candidates = scripts.map((item) => String(item?.id || item?.name || '')).filter((name) => name.toLowerCase().includes('api-hub'));
          console.log('API_HUB_WORKERS', JSON.stringify(candidates));
          const name = candidates.find((value) => value === 'api-hub-v2') || candidates[0];
          if (!name) throw new Error('API_HUB_WORKER_NOT_FOUND');
          const scriptRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${encodeURIComponent(name)}`, { headers, signal: AbortSignal.timeout(15000) });
          const source = await scriptRes.text();
          if (!scriptRes.ok) throw new Error(`WORKER_SOURCE_FAILED:${scriptRes.status}`);
          const routes = [...new Set((source.match(/\/api\/blogger\/[A-Za-z0-9_./:-]+/g) || []).map((value) => value.replace(/["'`),;}]+$/g, '')))].sort();
          const capabilities = {
            postsList: /posts\.list|posts\/list|post\/list|blogger\/posts/.test(source),
            postSearch: /posts\.search|post\/search|posts\/search/.test(source),
            postGet: /post\/get|posts\.get/.test(source),
            bloggerApiPostsCollection: /\/blogs\/[^\s"'`]+\/posts/.test(source) || /blogger\/v3\/blogs/.test(source)
          };
          console.log('BLOGGER_ROUTES', JSON.stringify(routes));
          console.log('BLOGGER_CAPABILITIES', JSON.stringify(capabilities));
          NODE
