name: blogger-read-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/blogger-read-probe-trigger'
      - '.github/workflows/blogger-read-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed API Hub Blogger list contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('CF_CREDENTIALS_MISSING');
          const headers = { authorization: `Bearer ${token}` };
          const listRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts`, { headers, signal: AbortSignal.timeout(15000) });
          const list = await listRes.json().catch(() => ({}));
          if (!listRes.ok || list.success === false) throw new Error(`WORKER_LIST_FAILED:${listRes.status}`);
          const scripts = Array.isArray(list.result) ? list.result : [];
          const candidates = scripts.map((item) => String(item?.id || item?.name || '')).filter((name) => name.toLowerCase().includes('api-hub'));
          const name = candidates.find((value) => value === 'api-hub-v2') || candidates[0];
          if (!name) throw new Error('API_HUB_WORKER_NOT_FOUND');
          const scriptRes = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${encodeURIComponent(name)}`, { headers, signal: AbortSignal.timeout(15000) });
          const source = await scriptRes.text();
          if (!scriptRes.ok) throw new Error(`WORKER_SOURCE_FAILED:${scriptRes.status}`);
          const markers = ['async function listPosts', 'function listPosts', 'var listPosts', 'const listPosts'];
          const found = markers.map((marker) => ({ marker, index: source.indexOf(marker) })).find((item) => item.index >= 0);
          console.log('LIST_POSTS_DEFINITION', JSON.stringify(found || null));
          if (!found) throw new Error('LIST_POSTS_DEFINITION_NOT_FOUND');
          const scrubbed = source.slice(Math.max(0, found.index - 800), found.index + 6200)
            .replace(/Bearer\s+[A-Za-z0-9._~+\/-]+/gi, 'Bearer [REDACTED]')
            .replace(/(client_secret|refresh_token|access_token|api[_-]?key)\s*[:=]\s*["'`][^"'`]+["'`]/gi, '$1:[REDACTED]');
          console.log('LIST_POSTS_CONTEXT_BEGIN');
          console.log(scrubbed);
          console.log('LIST_POSTS_CONTEXT_END');
          NODE
