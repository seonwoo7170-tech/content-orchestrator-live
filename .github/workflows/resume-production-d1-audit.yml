name: resume-production-d1-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/resume-production-d1-audit-trigger'

permissions:
  contents: read

concurrency:
  group: content-orchestrator-resume-d1-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read production D1 before and after scheduler cycles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node - <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:`Bearer ${token}`,'content-type':'application/json'};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function cf(url,init={}){
            const r=await fetch(url,{...init,headers:{...headers,...(init.headers||{})},signal:AbortSignal.timeout(45000)});
            const data=await r.json().catch(()=>({}));
            if(!r.ok||data.success===false) throw new Error(`CF:${r.status}:${JSON.stringify(data.errors||data).slice(0,500)}`);
            return data;
          }
          const list=await cf(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`);
          const db=(list.result||[]).find(x=>x.name==='content-orchestrator');
          if(!db?.uuid) throw new Error('D1_DATABASE_NOT_FOUND');
          const url=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`;
          async function q(sql,params=[]){
            const data=await cf(url,{method:'POST',body:JSON.stringify({sql,params})});
            const out=(Array.isArray(data.result)?data.result[0]:data.result)||{};
            return out.results||[];
          }
          async function snapshot(label){
            const [counts,recent,slots,images]=await Promise.all([
              q(`SELECT status, COUNT(*) AS n FROM jobs WHERE archived_at IS NULL GROUP BY status ORDER BY status`),
              q(`SELECT id,mode,blog_id,status,last_error_code,recovery_state,retry_count,updated_at FROM jobs WHERE archived_at IS NULL AND status<>'completed' ORDER BY datetime(updated_at) DESC,id DESC LIMIT 30`),
              q(`SELECT id,plan_date,blog_id,slot_type,status,job_id,recovery_state,last_error_code,updated_at FROM daily_plan_slots WHERE plan_date=date('now','+9 hours') ORDER BY id`),
              q(`SELECT status,provider,provider_status,COUNT(*) AS n FROM job_images GROUP BY status,provider,provider_status ORDER BY status,provider,provider_status`)
            ]);
            console.log(`${label}_COUNTS ${JSON.stringify(counts)}`);
            console.log(`${label}_RECENT ${JSON.stringify(recent)}`);
            console.log(`${label}_SLOTS ${JSON.stringify(slots)}`);
            console.log(`${label}_IMAGES ${JSON.stringify(images)}`);
            return {counts,recent,slots,images};
          }
          const before=await snapshot('BEFORE');
          await sleep(190000);
          const after=await snapshot('AFTER');
          const beforeMap=new Map(before.recent.map(x=>[Number(x.id),`${x.status}|${x.updated_at}|${x.last_error_code||''}`]));
          const moved=after.recent.filter(x=>beforeMap.has(Number(x.id))&&beforeMap.get(Number(x.id))!==`${x.status}|${x.updated_at}|${x.last_error_code||''}`);
          console.log(`SCHEDULER_MOVED ${JSON.stringify(moved)}`);
          const active=after.recent.filter(x=>['queued','writing','critic_review','repairing','final_critic','ready','running'].includes(String(x.status)));
          console.log(`ACTIVE_AFTER ${JSON.stringify(active)}`);
          NODE
