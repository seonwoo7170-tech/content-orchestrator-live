name: patch-puter-provider-priority-label

on:
  push:
    branches: [main]
    paths:
      - '.github/patch-puter-provider-priority-label-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update watchdog provider priority label
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('worker/mcp-entry.js')
          s=p.read_text()
          old="providerPriority: 'kie->cloudflare'"
          new="providerPriority: 'puter->kie->cloudflare'"
          if old not in s:
              raise SystemExit('provider priority label not found')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          git config user.name "smileseon-ops"
          git config user.email "actions@users.noreply.github.com"
          git add worker/mcp-entry.js
          git commit -m "ops: report Puter-first image provider priority"
          git push origin HEAD:main
