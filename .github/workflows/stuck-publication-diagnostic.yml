name: Stuck Publication Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/stuck-publication-diagnostic-trigger'
      - '.github/workflows/stuck-publication-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
      API_HUB_BASE_URL: https://api-hub-v2.smileseon.workers.dev
    steps:
      - name: Inspect stuck publication state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const hubKey = process.env.HUB_API_KEY;
          if (!token || !account || !hubKey) throw new Error('REQUIRED_SECRET_MISSING');
          const cfHeaders = { authorization: `Bearer ${token}`, 'content-type': 'application/json' };
          async function cf(url, init = {}) {
            const r = await fetch(url, { ...init, headers: { ...cfHeaders, ...(init.headers || {}) } });
            const data = await r.json().catch(() => ({}));
            if (!r.ok || data.success === false) throw new Error(`CF_API_FAILED:${r.status}`);
            return data;
          }
          const list = await cf(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database`);
          const db = (list.result || []).find(x => x.name === 'content-orchestrator');
          if (!db?.uuid) throw new Error('D1_DATABASE_NOT_FOUND');
          const queryUrl = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db.uuid}/query`;
          async function query(sql, params = []) {
            const data = await cf(queryUrl, { method: 'POST', body: JSON.stringify({ sql, params }) });
            return (Array.isArray(data.result) ? data.result[0] : data.result) || {};
          }

          const jobs = await query(`SELECT id, mode, blog_id, blogger_post_id, target_url, topic, status, result_json, error, retry_count, recovery_state, next_retry_at, hold_reason, last_error_code, created_at, updated_at
            FROM jobs
            WHERE archived_at IS NULL
              AND status IN ('publishing_new','updating_existing','failed','needs_review')
              AND EXISTS (SELECT 1 FROM job_publications p WHERE p.job_id = jobs.id)
            ORDER BY id DESC LIMIT 30`);
          const items = [];
          for (const row of jobs.results || []) {
            const pubRes = await query(`SELECT job_id, blog_id, plan_date, slot_no, scheduled_time, status, blogger_post_id, url, error, attempts, created_at, updated_at FROM job_publications WHERE job_id = ? LIMIT 1`, [Number(row.id)]);
            const pub = pubRes.results?.[0] || null;
            let result = null;
            try { result = row.result_json ? JSON.parse(row.result_json) : null; } catch {}
            const candidatePostId = String(pub?.blogger_post_id || result?.publication?.bloggerPostId || row.blogger_post_id || '').trim();
            let readback = null;
            if (candidatePostId) {
              const r = await fetch(`${process.env.API_HUB_BASE_URL}/api/blogger/post/get`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', 'x-hub-api-key': hubKey },
                body: JSON.stringify({ blogId: String(row.blog_id), bloggerPostId: candidatePostId })
              });
              const data = await r.json().catch(() => ({}));
              readback = { http: r.status, error: data?.error || null, identity: data?.identity ? { blogId: data.identity.blogId || null, bloggerPostId: data.identity.bloggerPostId || null, permalink: data.identity.permalink || null, status: data.identity.status || null } : null };
            }
            items.push({
              id: Number(row.id), mode: row.mode, blogId: row.blog_id, status: row.status,
              topic: row.topic || null, error: row.last_error_code || row.error || null, updatedAt: row.updated_at || null,
              publication: pub ? { status: pub.status, bloggerPostId: pub.blogger_post_id || null, url: pub.url || null, error: pub.error || null, attempts: Number(pub.attempts || 0), scheduledAt: pub.scheduled_time || null, updatedAt: pub.updated_at || null } : null,
              resultPublication: result?.publication ? { ok: Boolean(result.publication.ok), bloggerPostId: result.publication.bloggerPostId || null, url: result.publication.url || null, status: result.publication.status || null, mode: result.publication.mode || result.publication.publishMode || null, scheduledAt: result.publication.scheduledAt || result.publication.publishDate || null } : null,
              publicationVerification: result?.publicationVerification || null,
              deliveryEvidence: result?.deliveryEvidence ? { status: result.deliveryEvidence.status || null, passedCount: result.deliveryEvidence.passedCount ?? null, requiredCount: result.deliveryEvidence.requiredCount ?? null, failedGates: (result.deliveryEvidence.gates || []).filter(g => g.required !== false && !g.passed).map(g => g.id) } : null,
              candidatePostId: candidatePostId || null,
              readback
            });
          }
          console.log('STUCK_PUBLICATIONS', JSON.stringify(items));
          NODE
